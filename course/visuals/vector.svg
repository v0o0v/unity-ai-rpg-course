<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">벡터·방향·정규화 — 개념도</title><desc id="desc">벡터는 방향과 크기를 함께 나타내는 값입니다. 위치 두 개의 차이는 목표로 향하는 벡터이며, 정규화는 방향을 유지하면서 길이를 1로 만드는 과정입니다. 1. 방향 만들기: 목표 위치에서 현재 위치를 뺍니다. 2. 길이 조절: 0이 아닌 방향을 길이 1로 정규화합니다. 3. 속도 적용: 초당 속도와 경과 시간을 곱합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  벡터</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="45" y="65" width="355" height="242" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="130" y1="263" x2="335" y2="263" stroke="#156f75" stroke-width="3"/><polygon points="335,263 326.13005077220714,267.6177917554148 326.13005077220714,258.3822082445852" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="130" y1="263" x2="130" y2="95" stroke="#7555b7" stroke-width="3"/><polygon points="130,95 134.61779175541483,103.86994922779284 125.38220824458517,103.86994922779284" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="342" y="266" fill="#156f75" font-size="20" font-weight="500" text-anchor="start"><tspan x="342" dy="0">X</tspan></text><text x="122" y="85" fill="#7555b7" font-size="20" font-weight="500" text-anchor="start"><tspan x="122" dy="0">Y</tspan></text><text x="220" y="295" fill="#203447" font-size="20" font-weight="700" text-anchor="middle"><tspan x="220" dy="0">2D · XY</tspan></text><line x1="130" y1="263" x2="265" y2="139" stroke="#c57121" stroke-width="6"/><polygon points="265,139 261.5912856016392,148.40109919905154 255.34373296910283,141.59932818782244" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="265" y1="139" x2="265" y2="263" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><line x1="130" y1="139" x2="265" y2="139" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><text x="195" y="132" fill="#c57121" font-size="20" font-weight="500" text-anchor="start"><tspan x="195" dy="0">(3, 4)</tspan></text><rect x="490" y="65" width="355" height="242" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="575" y1="263" x2="780" y2="263" stroke="#156f75" stroke-width="3"/><polygon points="780,263 771.1300507722071,267.6177917554148 771.1300507722071,258.3822082445852" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="575" y1="263" x2="575" y2="95" stroke="#7555b7" stroke-width="3"/><polygon points="575,95 579.6177917554148,103.86994922779284 570.3822082445852,103.86994922779284" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="787" y="266" fill="#156f75" font-size="20" font-weight="500" text-anchor="start"><tspan x="787" dy="0">X</tspan></text><text x="567" y="85" fill="#7555b7" font-size="20" font-weight="500" text-anchor="start"><tspan x="567" dy="0">Z</tspan></text><text x="665" y="295" fill="#203447" font-size="20" font-weight="700" text-anchor="middle"><tspan x="665" dy="0">3D · XZ</tspan></text><line x1="575" y1="263" x2="710" y2="139" stroke="#c57121" stroke-width="6"/><polygon points="710,139 706.5912856016392,148.40109919905154 700.3437329691028,141.59932818782244" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="710" y1="139" x2="710" y2="263" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><line x1="575" y1="139" x2="710" y2="139" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><text x="640" y="132" fill="#c57121" font-size="20" font-weight="500" text-anchor="start"><tspan x="640" dy="0">(3, 4)</tspan></text><line x1="420" y1="173" x2="475" y2="173" stroke="#156f75" stroke-width="3"/><polygon points="475,173 466.13005077220714,177.61779175541483 466.13005077220714,168.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  방향 만들기</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">목표 위치에서 현재 위치를</tspan><tspan x="47" dy="26.099999999999998">뺍니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  길이 조절</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">0이 아닌 방향을 길이 1로</tspan><tspan x="341" dy="26.099999999999998">정규화합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  속도 적용</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">초당 속도와 경과 시간을 곱</tspan><tspan x="635" dy="26.099999999999998">합니다.</tspan></text></g></svg>