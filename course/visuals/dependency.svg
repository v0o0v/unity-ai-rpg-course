<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">의존성·DAG·위상 정렬 — 개념도</title><desc id="desc">의존성은 어떤 작업이 다른 결과를 먼저 필요로 하는 관계입니다. DAG는 순환이 없는 방향 그래프이고, 위상 정렬은 그 관계를 지키는 실행 순서를 만드는 방법입니다. 1. 노드: 기획·규칙·UI·검사를 작업으로 나눕니다. 2. 방향: 누가 누구의 결과를 먼저 읽는지 연결합니다. 3. 검사: 없는 선행 작업·자기 의존·순환을 거부합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  의존성</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="291" y="64" width="317" height="79" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="291" y="64" width="7" height="79" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="449.5" y="98" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="449.5" dy="0">현재 요청</tspan></text><line x1="450" y1="152" x2="166" y2="205" stroke="#156f75" stroke-width="3"/><polygon points="166,205 173.8722680160369,198.8333642653646 175.56655904151307,207.91220674150105" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="40" y="214" width="253" height="95" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="214" width="7" height="95" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="248" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">노드</tspan></text><line x1="450" y1="152" x2="453" y2="205" stroke="#7555b7" stroke-width="3"/><polygon points="453,205 447.8883179798451,196.40519302573784 457.10914160348415,195.88325961307902" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="327" y="214" width="253" height="95" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="214" width="7" height="95" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="248" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">방향</tspan></text><line x1="450" y1="152" x2="740" y2="205" stroke="#c57121" stroke-width="3"/><polygon points="740,205 730.4443810256112,207.9479053608112 732.104762323169,198.86280014775895" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="614" y="214" width="253" height="95" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="214" width="7" height="95" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="248" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">검사</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  노드</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">기획·규칙·UI·검사를 작업으</tspan><tspan x="47" dy="26.099999999999998">로 나눕니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  방향</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">누가 누구의 결과를 먼저 읽</tspan><tspan x="341" dy="26.099999999999998">는지 연결합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">없는 선행 작업·자기 의존·</tspan><tspan x="635" dy="26.099999999999998">순환을 거부합니다.</tspan></text></g></svg>