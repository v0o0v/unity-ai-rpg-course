<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">취소 신호·늦은 완료·정리 — 개념도</title><desc id="desc">취소 신호는 더 이상 작업 결과를 사용하지 않겠다는 의사를 전달합니다. 실제 내부 작업이 취소를 지원하는지, 사용 중인 자원은 누가 정리하는지 따로 정해야 합니다. 1. 신호 전달: 화면 종료·새 요청·앱 중단에 맞춰 취소를 알립니다. 2. 유효성 확인: 완료 응답의 요청 ID와 현재 세션을 비교합니다. 3. 정리: 핸들·구독·임시 UI를 한 번만 해제합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  취소 신호</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="247" height="84" rx="7" fill="#156f7522" stroke="#156f75" stroke-width="2"/><text x="180.5" y="161" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="180.5" dy="0">신호 전달</tspan></text><rect x="318" y="110" width="247" height="84" rx="7" fill="#7555b722" stroke="#7555b7" stroke-width="2"/><text x="441.5" y="161" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="441.5" dy="0">유효성 확인</tspan></text><rect x="579" y="110" width="247" height="84" rx="7" fill="#c5712122" stroke="#c57121" stroke-width="2"/><text x="702.5" y="161" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="702.5" dy="0">정리</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#203447" stroke-width="3"/><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#203447" stroke="#203447" stroke-width="2"/><text x="57" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="450" y="314" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">이전 상태와 늦게 도착한 결과를 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  신호 전달</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">화면 종료·새 요청·앱 중단</tspan><tspan x="47" dy="26.099999999999998">에 맞춰 취소를 알립니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  유효성 확인</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">완료 응답의 요청 ID와 현재</tspan><tspan x="341" dy="26.099999999999998">세션을 비교합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  정리</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">핸들·구독·임시 UI를 한 번</tspan><tspan x="635" dy="26.099999999999998">만 해제합니다.</tspan></text></g></svg>