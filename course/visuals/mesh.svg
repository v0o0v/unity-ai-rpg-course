<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">메시·정점·삼각형·노멀 — 개념도</title><desc id="desc">메시는 3D 물체 표면을 정점과 면으로 표현한 자료입니다. 대부분의 렌더링은 삼각형을 사용하며 노멀은 표면이 어느 방향을 향하는지 나타내 조명에 영향을 줍니다. 1. 형태: 정점·삼각형으로 실루엣을 만듭니다. 2. 표면: 노멀·UV·재질을 연결합니다. 3. 검사: 카메라에서 잘 보이는지와 실제 충돌을 따로 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  메시</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><polygon points="80,267 162,100 213,300" fill="#156f7525" stroke="#156f75" stroke-width="3"/><polygon points="162,100 312,121 213,300" fill="#7555b725" stroke="#7555b7" stroke-width="3"/><polygon points="312,121 372,258 213,300" fill="#c5712125" stroke="#c57121" stroke-width="3"/><circle cx="80" cy="267" r="6" fill="#203447" stroke="#203447" stroke-width="2"/><circle cx="162" cy="100" r="6" fill="#203447" stroke="#203447" stroke-width="2"/><circle cx="312" cy="121" r="6" fill="#203447" stroke="#203447" stroke-width="2"/><circle cx="372" cy="258" r="6" fill="#203447" stroke="#203447" stroke-width="2"/><circle cx="213" cy="300" r="6" fill="#203447" stroke="#203447" stroke-width="2"/><line x1="416" y1="201" x2="489" y2="201" stroke="#c57121" stroke-width="3"/><polygon points="489,201 480.13005077220714,205.61779175541483 480.13005077220714,196.38220824458517" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="536" y="80" width="290" height="223" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="550" y="93" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="600" y="93" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="650" y="93" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="700" y="93" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="750" y="93" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="550" y="142" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="600" y="142" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="650" y="142" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="700" y="142" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="750" y="142" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="550" y="191" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="600" y="191" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="650" y="191" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="700" y="191" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="750" y="191" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="550" y="240" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="600" y="240" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><rect x="650" y="240" width="48" height="47" rx="1" fill="#c5712133" stroke="white" stroke-width="1"/><rect x="700" y="240" width="48" height="47" rx="1" fill="#156f7533" stroke="white" stroke-width="1"/><rect x="750" y="240" width="48" height="47" rx="1" fill="#7555b733" stroke="white" stroke-width="1"/><text x="220" y="327" fill="#203447" font-size="21" font-weight="500" text-anchor="middle"><tspan x="220" dy="0">정점과 삼각형</tspan></text><text x="685" y="327" fill="#203447" font-size="21" font-weight="500" text-anchor="middle"><tspan x="685" dy="0">표면 좌표로 색을 가져옴</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  형태</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">정점·삼각형으로 실루엣을</tspan><tspan x="47" dy="26.099999999999998">만듭니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  표면</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">노멀·UV·재질을 연결합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">카메라에서 잘 보이는지와</tspan><tspan x="635" dy="26.099999999999998">실제 충돌을 따로 확인합니</tspan><tspan x="635" dy="26.099999999999998">다.</tspan></text></g></svg>