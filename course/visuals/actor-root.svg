<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">ActorRoot·VisualRoot·ModelRoot — 개념도</title><desc id="desc">이 이름들은 프로젝트에서 몸체·게임 규칙과 외형을 분리하기 위해 정한 오브젝트 이름입니다. ActorRoot는 실제 위치·생명·이동의 기준, VisualRoot나 ModelRoot는 그림·모델을 담는 하위 객체로 사용합니다. 1. 기준 몸체: 이동·충돌·게임 ID를 유지합니다. 2. 외형 자식: 스프라이트나 3D 모델을 붙입니다. 3. 교체: 외형을 바꿔도 몸체·피해 규칙을 보존합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  ActorRoot</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><text x="195" y="99" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">ActorRoot</tspan></text><g transform="translate(194,278) scale(1.45)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><line x1="345" y1="187" x2="409" y2="100" stroke="#156f75" stroke-width="3"/><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="414" height="70" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="7" height="70" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="629.0" y="100" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">기준 몸체</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#7555b7" stroke-width="3"/><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="414" height="70" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="7" height="70" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="629.0" y="186" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">외형 자식</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#c57121" stroke-width="3"/><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="414" height="70" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="7" height="70" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="629.0" y="272" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">교체</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  기준 몸체</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">이동·충돌·게임 ID를 유지합</tspan><tspan x="47" dy="26.099999999999998">니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  외형 자식</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">스프라이트나 3D 모델을 붙</tspan><tspan x="341" dy="26.099999999999998">입니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  교체</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">외형을 바꿔도 몸체·피해 규</tspan><tspan x="635" dy="26.099999999999998">칙을 보존합니다.</tspan></text></g></svg>