<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">비용 한도·예약·실사용량 — 개념도</title><desc id="desc">비용 한도는 허용한 지출 범위입니다. 예약은 호출 전에 잠재 사용량을 잡아 두는 것이고 실사용량은 응답·공급자 기록으로 확인합니다. 추정과 청구서는 다를 수 있습니다. 1. 사전 확인: 모델·이미지·서버 비용 경로를 구분합니다. 2. 한도 적용: 작업·시도·시간·사용량을 제한합니다. 3. 정산: 알려진 실제 사용량과 미상 비용을 따로 남깁니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  비용 한도</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="71" y="94" fill="#203447" font-size="24" font-weight="700" text-anchor="start"><tspan x="71" dy="0">한도 안에서만 권한·자원 사용</tspan></text><circle cx="94" cy="177" r="29" fill="#156f7522" stroke="#156f75" stroke-width="3"/><text x="94" y="184" fill="#156f75" font-size="16" font-weight="700" text-anchor="middle"><tspan x="94" dy="0">사용</tspan></text><circle cx="191" cy="177" r="29" fill="#156f7522" stroke="#156f75" stroke-width="3"/><text x="191" y="184" fill="#156f75" font-size="16" font-weight="700" text-anchor="middle"><tspan x="191" dy="0">사용</tspan></text><circle cx="288" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="288" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="288" dy="0">대기</tspan></text><circle cx="385" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="385" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="385" dy="0">대기</tspan></text><circle cx="482" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="482" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="482" dy="0">대기</tspan></text><circle cx="579" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="579" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="579" dy="0">대기</tspan></text><circle cx="676" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="676" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="676" dy="0">대기</tspan></text><circle cx="773" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="773" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="773" dy="0">대기</tspan></text><text x="448" y="272" fill="#203447" font-size="23" font-weight="500" text-anchor="middle"><tspan x="448" dy="0">획득 → 작업 → 반환 / 정산</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  사전 확인</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">모델·이미지·서버 비용 경로</tspan><tspan x="47" dy="26.099999999999998">를 구분합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  한도 적용</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">작업·시도·시간·사용량을 제</tspan><tspan x="341" dy="26.099999999999998">한합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  정산</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">알려진 실제 사용량과 미상</tspan><tspan x="635" dy="26.099999999999998">비용을 따로 남깁니다.</tspan></text></g></svg>