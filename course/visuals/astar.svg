<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">A* 길찾기 — 개념도</title><desc id="desc">A*는 현재까지 든 이동 비용과 목표까지 남았을 것으로 추정한 비용을 합쳐 유망한 칸부터 탐색하는 길찾기 방법입니다. 캐릭터의 실제 이동과는 별도입니다. 1. 시작·목표: 이동 가능한 셀을 정합니다. 2. 후보 탐색: g(지금 비용)+h(남은 예상값)가 작은 후보를 우선합니다. 3. 경로 복원: 목표를 찾으면 경유점을 역으로 이어 줍니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  A* 길찾기</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="80" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="118" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="156" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="194" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="232" y="73" width="36" height="36" rx="3" fill="#365064" stroke="#ccdde1" stroke-width="1"/><rect x="270" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="308" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="346" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="384" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="422" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="460" y="73" width="36" height="36" rx="3" fill="white" stroke="#