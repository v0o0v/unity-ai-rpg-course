oke="#ccdde1" stroke-width="1"/><line x1="99.0" y1="168.0" x2="137.0" y2="168.0" stroke="#156f75" stroke-width="7"/><line x1="137.0" y1="168.0" x2="175.0" y2="168.0" stroke="#156f75" stroke-width="7"/><line x1="175.0" y1="168.0" x2="213.0" y2="168.0" stroke="#156f75" stroke-width="7"/><line x1="213.0" y1="168.0" x2="213.0" y2="206.0" stroke="#156f75" stroke-width="7"/><line x1="213.0" y1="206.0" x2="213.0" y2="244.0" stroke="#156f75" stroke-width="7"/><line x1="213.0" y1="244.0" x2="213.0" y2="282.0" stroke="#156f75" stroke-width="7"/><line x1="213.0" y1="282.0" x2="251.0" y2="282.0" stroke="#156f75" stroke-width="7"/><line x1="251.0" y1="282.0" x2="289.0" y2="282.0" stroke="#156f75" stroke-width="7"/><line x1="289.0" y1="282.0" x2="327.0" y2="282.0" stroke="#156f75" stroke-width="7"/><line x1="327.0" y1="282.0" x2="327.0" y2="244.0" stroke="#156f75" stroke-width="7"/><line x1="327.0" y1="244.0" x2="327.0" y2="206.0" stroke="#156f75" stroke-width="7"/><line x1="327.0" y1="206.0" x2="365.0" y2="206.0" stroke="#156f75" stroke-width="7"/><circle cx="99" cy="168" r="12" fill="#156f75" stroke="#156f75" stroke-width="2"/><text x="99" y="174" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="99" dy="0">S</tspan></text><circle cx="365" cy="206" r="12" fill="#c57121" stroke="#c57121" stroke-width="2"/><text x="365" y="212" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="365" dy="0">G</tspan></text><text x="541" y="117" fill="#203447" font-size="23" font-weight="700" text-anchor="start"><tspan x="541" dy="0">후보 탐색 → 경로 복원</tspan></text><text x="541" y="207" fill="#156f75" font-size="21" font-weight="500" text-anchor="start"><tspan x="541" dy="0">g + h가 작은 후보부터</tspan></text><text x="541" y="270" fill="#526776" font-size="19" font-weight="500" text-anchor="start"><tspan x="541" dy="0">실제 몸체 충돌은 별도</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  시작·목표</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">이동 가능한 셀을 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  후보 탐색</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">g(지금 비용)+h(남은 예상값</tspan><tspan x="341" dy="26.099999999999998">)가 작은 후보를 우선합니다</tspan><tspan x="341" dy="26.099999999999998">.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  경로 복원</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">목표를 찾으면 경유점을 역</tspan><tspan x="635" dy="26.099999999999998">으로 이어 줍니다.</tspan></text></g></svg>