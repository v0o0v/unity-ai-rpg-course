<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">패키지·패키지 관리자 — 개념도</title><desc id="desc">패키지는 입력·타일맵·테스트처럼 특정 기능을 묶어 프로젝트에 추가하는 단위입니다. Unity Package Manager가 설치와 의존 버전을 관리합니다. 1. 필요 판단: 지금 필요한 기능인지 확인합니다. 2. 의존 확인: 다른 패키지와 Editor 버전 요구를 확인합니다. 3. 설치 검증: 가져오기·컴파일 후 실제 기능을 시험합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  패키지</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="80" width="253" height="234" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="80" width="7" height="234" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="114" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">필요 판단</tspan></text><text x="166.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">지금 필요한 기능인지 확인합니다</tspan><tspan x="166.5" dy="26.099999999999998">.</tspan></text><circle cx="265" cy="98" r="17" fill="#156f75" stroke="#156f75" stroke-width="2"/><text x="265" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="265" dy="0">1</tspan></text><line x1="299" y1="197" x2="319" y2="197" stroke="#156f75" stroke-width="3"/><polygon points="319,197 310.13005077220714,201.61779175541483 310.13005077220714,192.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="327" y="80" width="253" height="234" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="80" width="7" height="234" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="114" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">의존 확인</tspan></text><text x="453.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">다른 패키지와 Editor 버전 요구</tspan><tspan x="453.5" dy="26.099999999999998">를 확인합니다.</tspan></text><circle cx="552" cy="98" r="17" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="552" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="552" dy="0">2</tspan></text><line x1="586" y1="197" x2="606" y2="197" stroke="#7555b7" stroke-width="3"/><polygon points="606,197 597.1300507722071,201.61779175541483 597.1300507722071,192.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="614" y="80" width="253" height="234" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="80" width="7" height="234" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="114" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">설치 검증</tspan></text><text x="740.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">가져오기·컴파일 후 실제 기능을</tspan><tspan x="740.5" dy="26.099999999999998">시험합니다.</tspan></text><circle cx="839" cy="98" r="17" fill="#c57121" stroke="#c57121" stroke-width="2"/><text x="839" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="839" dy="0">3</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  필요 판단</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">지금 필요한 기능인지 확인</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  의존 확인</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">다른 패키지와 Editor 버전</tspan><tspan x="341" dy="26.099999999999998">요구를 확인합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  설치 검증</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">가져오기·컴파일 후 실제 기</tspan><tspan x="635" dy="26.099999999999998">능을 시험합니다.</tspan></text></g></svg>