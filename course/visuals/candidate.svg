<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">후보·스테이징·변경 적용 — 개념도</title><desc id="desc">후보는 원본을 보존하면서 검토할 변경을 적용한 별도 작업물입니다. 스테이징은 적용할 자료를 준비하는 단계이며, 검증된 후보를 다음 기준으로 채택하는 것을 여기서는 승격이라고 부릅니다. 1. 변경 검토: 어떤 파일이 어떻게 바뀌는지 확인합니다. 2. 적용: 승인한 내용만 새 후보에 반영합니다. 3. 검사·채택: 현재 후보의 증거를 확인한 뒤 다음 기준으로 정합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  후보</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="91" width="253" height="190" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="91" width="7" height="190" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="125" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">원본 보존</tspan></text><text x="166.5" y="171" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">아직 바꾸지 않음</tspan></text><line x1="300" y1="187" x2="319" y2="187" stroke="#156f75" stroke-width="3"/><polygon points="319,187 310.13005077220714,191.61779175541483 310.13005077220714,182.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="327" y="91" width="253" height="190" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="91" width="7" height="190" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="125" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">검토한 후보</tspan></text><text x="453.5" y="171" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">승인 범위만 적용</tspan></text><line x1="587" y1="187" x2="606" y2="187" stroke="#156f75" stroke-width="3"/><polygon points="606,187 597.1300507722071,191.61779175541483 597.1300507722071,182.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="614" y="91" width="253" height="190" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="91" width="7" height="190" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="125" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">현재 후보 검사</tspan></text><text x="740.5" y="171" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">새 증거 연결</tspan></text><text x="450" y="327" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">현재 대상과 실제 결과를 연결해야 함</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  변경 검토</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">어떤 파일이 어떻게 바뀌는</tspan><tspan x="47" dy="26.099999999999998">지 확인합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  적용</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">승인한 내용만 새 후보에 반</tspan><tspan x="341" dy="26.099999999999998">영합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사·채택</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">현재 후보의 증거를 확인한</tspan><tspan x="635" dy="26.099999999999998">뒤 다음 기준으로 정합니다.</tspan></text></g></svg>