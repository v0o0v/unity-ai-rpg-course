<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">롤백·핫픽스·이전 버전 — 개념도</title><desc id="desc">롤백은 문제가 있는 변경 대신 이전 정상 버전으로 돌아가는 것이고, 핫픽스는 결함을 작게 고친 새 변경입니다. 앱·콘텐츠·저장 데이터는 되돌릴 수 있는 조건이 다릅니다. 1. 범위 확인: 코드·콘텐츠·저장 중 무엇이 바뀌었는지 봅니다. 2. 복구 가능성: 이전 버전이 현재 저장을 읽을 수 있는지 검사합니다. 3. 새 검증: 같은 반례와 인접 기능을 현재 후보에서 재검사합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  롤백</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="247" height="84" rx="7" fill="#156f7522" stroke="#156f75" stroke-width="2"/><text x="180.5" y="161" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="180.5" dy="0">범위 확인</tspan></text><rect x="318" y="110" width="247" height="84" rx="7" fill="#7555b722" stroke="#7555b7" stroke-width="2"/><text x="441.5" y="161" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="441.5" dy="0">복구 가능성</tspan></text><rect x="579" y="110" width="247" height="84" rx="7" fill="#c5712122" stroke="#c57121" stroke-width="2"/><text x="702.5" y="161" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="702.5" dy="0">새 검증</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#203447" stroke-width="3"/><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#203447" stroke="#203447" stroke-width="2"/><text x="57" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="450" y="314" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">이전 상태와 늦게 도착한 결과를 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  범위 확인</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">코드·콘텐츠·저장 중 무엇이</tspan><tspan x="47" dy="26.099999999999998">바뀌었는지 봅니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  복구 가능성</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">이전 버전이 현재 저장을 읽</tspan><tspan x="341" dy="26.099999999999998">을 수 있는지 검사합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  새 검증</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">같은 반례와 인접 기능을 현</tspan><tspan x="635" dy="26.099999999999998">재 후보에서 재검사합니다.</tspan></text></g></svg>