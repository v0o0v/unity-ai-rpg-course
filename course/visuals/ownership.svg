<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">파일 소유권·읽기 범위·쓰기 범위 — 개념도</title><desc id="desc">파일 소유권은 이번 작업에서 누가 어느 파일을 수정할 책임과 권한이 있는지 정한 규칙입니다. 읽기 허용과 쓰기 허용은 별도로 관리합니다. 1. 역할 한도: 담당이 쓸 수 있는 최대 범위를 정합니다. 2. 작업 한도: 이번 기능에는 더 좁은 경로만 허용합니다. 3. 변경 검사: 응답의 실제 경로·원본 해시·수정 내용을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  파일 소유권</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="291" y="64" width="317" height="79" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="291" y="64" width="7" height="79" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="449.5" y="98" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="449.5" dy="0">사람의 요구·승인</tspan></text><line x1="450" y1="152" x2="166" y2="205" stroke="#156f75" stroke-width="3"/><polygon points="166,205 173.8722680160369,198.8333642653646 175.56655904151307,207.91220674150105" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="40" y="214" width="253" height="95" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="214" width="7" height="95" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="248" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">역할의 제안</tspan></text><line x1="450" y1="152" x2="453" y2="205" stroke="#7555b7" stroke-width="3"/><polygon points="453,205 447.8883179798451,196.40519302573784 457.10914160348415,195.88325961307902" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="327" y="214" width="253" height="95" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="214" width="7" height="95" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="248" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">실행기의 통제</tspan></text><line x1="450" y1="152" x2="740" y2="205" stroke="#c57121" stroke-width="3"/><polygon points="740,205 730.4443810256112,207.9479053608112 732.104762323169,198.86280014775895" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="614" y="214" width="253" height="95" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="214" width="7" height="95" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="248" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">실제 검사·관찰</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  역할 한도</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">담당이 쓸 수 있는 최대 범</tspan><tspan x="47" dy="26.099999999999998">위를 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  작업 한도</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">이번 기능에는 더 좁은 경로</tspan><tspan x="341" dy="26.099999999999998">만 허용합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  변경 검사</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">응답의 실제 경로·원본 해시</tspan><tspan x="635" dy="26.099999999999998">·수정 내용을 확인합니다.</tspan></text></g></svg>