<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">브라우저 기록·localStorage·내보내기 — 개념도</title><desc id="desc">localStorage는 웹페이지가 브라우저의 해당 출처에 작은 데이터를 보관하는 기능입니다. 이 실습서의 확인 표시와 메모는 게임 저장 파일·AI 작업 기록·테스트 PASS와 별개입니다. 1. 기록: 읽은 단계·메모를 브라우저에 저장합니다. 2. 한계: 브라우저·출처·보안 설정·데이터 삭제에 따라 없어질 수 있습니다. 3. 보존: 기록 파일 내보내기와 불러오기로 별도 사본을 관리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  브라우저 기록</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="39" y="86" width="7" height="200" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="165.5" y="120" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">기록</tspan></text><text x="165.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">읽은 단계·메모를 브라우저에 저</tspan><tspan x="165.5" dy="26.099999999999998">장합니다.</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#156f75" stroke-width="3"/><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="326" y="86" width="253" height="200" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="326" y="86" width="7" height="200" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="452.5" y="120" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">한계</tspan></text><text x="452.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">브라우저·출처·보안 설정·데이터</tspan><tspan x="452.5" dy="26.099999999999998">삭제에 따라 없어질 수 있습니다.</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#7555b7" stroke-width="3"/><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="613" y="86" width="253" height="200" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="613" y="86" width="7" height="200" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="739.5" y="120" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">보존</tspan></text><text x="739.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">기록 파일 내보내기와 불러오기로</tspan><tspan x="739.5" dy="26.099999999999998">별도 사본을 관리합니다.</tspan></text><text x="450" y="329" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  기록</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">읽은 단계·메모를 브라우저</tspan><tspan x="47" dy="26.099999999999998">에 저장합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  한계</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">브라우저·출처·보안 설정·데</tspan><tspan x="341" dy="26.099999999999998">이터 삭제에 따라 없어질 수</tspan><tspan x="341" dy="26.099999999999998">있습니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  보존</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">기록 파일 내보내기와 불러</tspan><tspan x="635" dy="26.099999999999998">오기로 별도 사본을 관리합</tspan><tspan x="635" dy="26.099999999999998">니다.</tspan></text></g></svg>