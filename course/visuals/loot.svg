<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">전리품·가중치·드롭 확률 — 개념도</title><desc id="desc">전리품은 처치·상자 등의 보상입니다. 가중치는 여러 후보를 상대적 비중으로 선택하는 값이며, 그 자체가 퍼센트라는 뜻은 아닙니다. 1. 조건: 보상을 만들 사건과 횟수를 정합니다. 2. 선택: 가중치 합에 대한 비율로 항목을 고릅니다. 3. 생성: 정의·고유 ID·옵션을 한 번 결정합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  전리품</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="61" y="94" fill="#203447" font-size="23" font-weight="700" text-anchor="start"><tspan x="61" dy="0">가중치 1 : 2 : 7 · 합계 10</tspan></text><rect x="64" y="130" width="76" height="87" rx="10" fill="#156f7533" stroke="#156f75" stroke-width="2"/><text x="102.0" y="182" fill="#156f75" font-size="25" font-weight="700" text-anchor="middle"><tspan x="102.0" dy="0">10%</tspan></text><rect x="140" y="130" width="152" height="87" rx="10" fill="#7555b733" stroke="#7555b7" stroke-width="2"/><text x="216.0" y="182" fill="#7555b7" font-size="25" font-weight="700" text-anchor="middle"><tspan x="216.0" dy="0">20%</tspan></text><rect x="292" y="130" width="532" height="87" rx="10" fill="#c5712133" stroke="#c57121" stroke-width="2"/><text x="558.0" y="182" fill="#c57121" font-size="25" font-weight="700" text-anchor="middle"><tspan x="558.0" dy="0">70%</tspan></text><text x="448" y="282" fill="#203447" font-size="22" font-weight="500" text-anchor="middle"><tspan x="448" dy="0">한 번의 결과가 아니라 반복 시행의 확률</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  조건</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">보상을 만들 사건과 횟수를</tspan><tspan x="47" dy="26.099999999999998">정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  선택</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">가중치 합에 대한 비율로 항</tspan><tspan x="341" dy="26.099999999999998">목을 고릅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  생성</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">정의·고유 ID·옵션을 한 번</tspan><tspan x="635" dy="26.099999999999998">결정합니다.</tspan></text></g></svg>