<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">UI·HUD·UGUI — 개념도</title><desc id="desc">UI는 메뉴·버튼·가방 등 사용자가 정보를 보고 조작하는 화면입니다. HUD는 플레이 중 체력·마나·스킬 상태처럼 지속 표시되는 정보를 뜻합니다. UGUI는 Unity의 UI 시스템 중 하나입니다. 1. 정보 우선순위: 체력·위험·입력·보상을 구분합니다. 2. 배치: 화면 크기와 엄지손가락 위치를 고려합니다. 3. 동기화: 실제 게임 데이터에 맞춰 표시합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  UI</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="139" y="73" width="622" height="230" rx="25" fill="#223c4d" stroke="#223c4d" stroke-width="2"/><rect x="156" y="87" width="588" height="201" rx="13" fill="#edf4f2" stroke="#6d9598" stroke-width="2"/><rect x="175" y="102" width="547" height="164" rx="7" fill="none" stroke="#748690" stroke-width="2"/><circle cx="230" cy="221" r="39" fill="#dcece9" stroke="#156f75" stroke-width="3"/><circle cx="220" cy="211" r="16" fill="#156f75" stroke="#156f75" stroke-width="2"/><circle cx="639" cy="214" r="22" fill="#e9def7" stroke="#7555b7" stroke-width="3"/><circle cx="691" cy="190" r="22" fill="#e9def7" stroke="#7555b7" stroke-width="3"/><circle cx="612" cy="155" r="22" fill="#e9def7" stroke="#7555b7" stroke-width="3"/><g transform="translate(448,222) scale(1.09)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="202" y="122" fill="#203447" font-size="16" font-weight="500" text-anchor="start"><tspan x="202" dy="0">HP 100</tspan></text><text x="232" y="280" fill="#156f75" font-size="17" font-weight="500" text-anchor="middle"><tspan x="232" dy="0">입력 A</tspan></text><text x="648" y="280" fill="#7555b7" font-size="17" font-weight="500" text-anchor="middle"><tspan x="648" dy="0">입력 B</tspan></text><text x="450" y="331" fill="#203447" font-size="22" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">화면 배치 · 터치 ID · 안전영역을 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  정보 우선순위</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">체력·위험·입력·보상을 구분</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  배치</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">화면 크기와 엄지손가락 위</tspan><tspan x="341" dy="26.099999999999998">치를 고려합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  동기화</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 게임 데이터에 맞춰 표</tspan><tspan x="635" dy="26.099999999999998">시합니다.</tspan></text></g></svg>