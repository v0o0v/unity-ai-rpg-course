<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">시드·난수·PRNG — 개념도</title><desc id="desc">의사난수 생성기(PRNG)는 정해진 계산으로 불규칙해 보이는 수열을 만듭니다. 시드는 그 수열의 출발값입니다. 같은 시드만이 아니라 생성기·설정·호출 순서가 같아야 결과를 재현하기 쉽습니다. 1. 시드 보존: 실패한 생성의 출발값을 기록합니다. 2. 스트림 분리: 지형·적·장식·전리품의 난수 사용을 나눕니다. 3. 버전 기록: 알고리즘과 설정 버전을 함께 저장합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  시드</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="88" width="199" height="140" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="42" y="88" width="7" height="140" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="141.5" y="122" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="141.5" dy="0">시드 42</tspan></text><text x="141.5" y="168" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="141.5" dy="0">버전·설정 고정</tspan></text><line x1="249" y1="162" x2="302" y2="162" stroke="#156f75" stroke-width="3"/><polygon points="302,162 293.13005077220714,166.61779175541483 293.13005077220714,157.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="316" y="88" width="220" height="140" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="316" y="88" width="7" height="140" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="426.0" y="122" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="426.0" dy="0">지도용 흐름</tspan></text><text x="426.0" y="168" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspa