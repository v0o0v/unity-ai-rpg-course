 height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="617" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="650" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="683" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="716" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="749" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="782" y="177" width="31" height="31" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="315" y="256" width="221" height="53" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="315" y="256" width="7" height="53" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="425.5" y="290" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="425.5" dy="0">전리품용 흐름</tspan></text><text x="586" y="284" fill="#7555b7" font-size="20" font-weight="500" text-anchor="start"><tspan x="586" dy="0">장식과 독립적으로 기록</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  시드 보존</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">실패한 생성의 출발값을 기</tspan><tspan x="47" dy="26.099999999999998">록합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  스트림 분리</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">지형·적·장식·전리품의 난수</tspan><tspan x="341" dy="26.099999999999998">사용을 나눕니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  버전 기록</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">알고리즘과 설정 버전을 함</tspan><tspan x="635" dy="26.099999999999998">께 저장합니다.</tspan></text></g></svg>