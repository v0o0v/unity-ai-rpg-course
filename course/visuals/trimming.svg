<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">트리밍·오프셋·고정 셀 — 개념도</title><desc id="desc">트리밍은 투명한 여백을 잘라 그림의 유효 영역만 남기는 과정입니다. 원래 셀에서의 위치를 잃으면 프레임별 발 위치와 배치가 흔들릴 수 있습니다. 1. 원래 셀: 공통 크기와 Pivot을 보존합니다. 2. 자르기: 유효 영역과 잘라낸 오프셋을 기록합니다. 3. 복원 배치: 재생할 때 원래 기준점에 맞춰 보여 줍니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  트리밍</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="85" width="127" height="177" rx="6" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="49" y1="242" x2="157" y2="242" stroke="#156f75" stroke-width="2" stroke-dasharray="7 6"/><g transform="translate(101,240) scale(1.22)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17.0" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17.0" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26.0" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31.0" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30.0" x2="45.0" y2="-69.0" stroke="#c57121" stroke-width="5"/></g><circle cx="101" cy="240" r="4" fill="#c57121" stroke="#c57121" stroke-width="2"/><text x="103" y="285" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="103" dy="0">1 프레임</tspan></text><rect x="179" y="85" width="127" height="177" rx="6" fill="white" str