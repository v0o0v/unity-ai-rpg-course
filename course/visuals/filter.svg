<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Point·Bilinear 필터와 픽셀 아트 — 개념도</title><desc id="desc">필터 모드는 텍스처를 확대·축소하거나 중간 위치에서 읽을 때 픽셀 색을 고르는 방식입니다. Point는 가장 가까운 값을, Bilinear는 주변 값을 섞는 방식입니다. 1. 스타일 결정: 각진 픽셀을 보존할지 부드럽게 볼지 정합니다. 2. 설정: 가져오기와 화면 확대 규칙을 맞춥니다. 3. 실기기: 회전·축소·움직임에서 흔들림과 번짐을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Point</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="257" x2="276" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(177,252) scale(0.5)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="177" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="177" dy="0">PPU 128 → 0.5유닛</tspan></text><rect x="309" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="332" y1="257" x2="531" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(432,252) scale(1)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#7555b7" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#7555b7" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="432" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="432" dy="0">PPU 64 → 1유닛</tspan></text><rect x="583" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="606" y1="257" x2="805" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(706,252) scale(2)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#c57121" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#c57121" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="706" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="706" dy="0">PPU 32 → 2유닛</tspan></text><text x="452" y="328" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="452" dy="0">같은 64px 원본을 다른 월드 크기로 표현한 예</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  스타일 결정</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">각진 픽셀을 보존할지 부드</tspan><tspan x="47" dy="26.099999999999998">럽게 볼지 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  설정</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">가져오기와 화면 확대 규칙</tspan><tspan x="341" dy="26.099999999999998">을 맞춥니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  실기기</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">회전·축소·움직임에서 흔들</tspan><tspan x="635" dy="26.099999999999998">림과 번짐을 확인합니다.</tspan></text></g></svg>