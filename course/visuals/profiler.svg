<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Profiler·병목·실기기 측정 — 개념도</title><desc id="desc">Profiler는 시간·메모리 사용 등의 원인을 관찰하는 도구입니다. 병목은 전체 속도를 가장 크게 제한하는 부분입니다. Editor 결과와 실제 기기 결과는 구분해야 합니다. 1. 재현 장면: 같은 적 수·효과·시드 조건을 정합니다. 2. 관측: 대상 기기에서 프레임·메모리 자료를 수집합니다. 3. 검증: 한 원인을 바꾼 뒤 같은 조건으로 다시 측정합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Profiler</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="52" y="94" fill="#203447" font-size="22" font-weight="700" text-anchor="start"><tspan x="52" dy="0">프레임 시간 예산 · 수치는 설명용</tspan></text><text x="59" y="154" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">CPU 작업</tspan></text><rect x="246" y="126" width="310" height="39" rx="5" fill="#156f7533" stroke="#156f75" stroke-width="2"/><text x="573" y="153" fill="#156f75" font-size="19" font-weight="500" text-anchor="start"><tspan x="573" dy="0">10ms</tspan></text><text x="59" y="215" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">GPU 작업</tspan></text><rect x="246" y="187" width="434" height="39" rx="5" fill="#7555b733" stroke="#7555b7" stroke-width="2"/><text x="697" y="214" fill="#7555b7" font-size="19" font-weight="500" text-anchor="start"><tspan x="697" dy="0">14ms</tspan></text><text x="59" y="276" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">60fps 예산</tspan></text><rect x="246" y="248" width="517" height="39" rx="5" fill="#c5712133" stroke="#c57121" stroke-width="2"/><text x="779.7700000000001" y="275" fill="#c57121" font-size="19" font-weight="500" text-anchor="start"><tspan x="779.7700000000001" dy="0">16.67ms</tspan></text><text x="446" y="334" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="446" dy="0">겹쳐 실행될 수 있어 CPU+GPU 단순 합계는 아님</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  재현 장면</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">같은 적 수·효과·시드 조건</tspan><tspan x="47" dy="26.099999999999998">을 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  관측</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">대상 기기에서 프레임·메모</tspan><tspan x="341" dy="26.099999999999998">리 자료를 수집합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검증</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">한 원인을 바꾼 뒤 같은 조</tspan><tspan x="635" dy="26.099999999999998">건으로 다시 측정합니다.</tspan></text></g></svg>