<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Animator·Controller·전이 — 개념도</title><desc id="desc">Animator는 클립과 상태 전환 규칙을 실행합니다. Controller는 대기·걷기·공격처럼 어떤 클립을 언제 재생할지 정하고, Blend Tree는 값을 따라 여러 동작을 섞는 데 쓰입니다. 1. 파라미터: 속도·방향·공격 요청 등의 입력을 받습니다. 2. 상태 선택: 전이 조건에 따라 클립을 바꿉니다. 3. 결과 표시: 현재 게임 상태에 맞는 움직임을 보여 줍니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Animator</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><circle cx="166" cy="173" r="88" fill="#156f7515" stroke="#156f75" stroke-width="3"/><text x="166" y="170" fill="#156f75" font-size="22" font-weight="700" text-anchor="middle"><tspan x="166" dy="0">파라미터</tspan></text><line x1="264" y1="173" x2="344" y2="173" stroke="#156f75" stroke-width="3"/><polygon points="344,173 335.13005077220714,177.61779175541483 335.13005077220714,168.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><circle cx="449" cy="173" r="88" fill="#7555b715" stroke="#7555b7" stroke-width="3"/><text x="449" y="170" fill="#7555b7" font-size="22" font-weight="700" text-anchor="middle"><tspan x="449" dy="0">상태 선택</tspan></text><line x1="547" y1="173" x2="627" y2="173" stroke="#7555b7" stroke-width="3"/><polygon points="627,173 618.1300507722071,177.61779175541483 618.1300507722071,168.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><circle cx="732" cy="173" r="88" fill="#c5712115" stroke="#c57121" stroke-width="3"/><text x="732" y="170" fill="#c57121" font-size="22" font-weight="700" text-anchor="middle"><tspan x="732" dy="0">결과 표시</tspan></text><text x="451" y="302" fill="#203447" font-size="22" font-weight="500" text-anchor="middle"><tspan x="451" dy="0">전이 조건 · 취소 · 종료를 명시</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  파라미터</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">속도·방향·공격 요청 등의</tspan><tspan x="47" dy="26.099999999999998">입력을 받습니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  상태 선택</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">전이 조건에 따라 클립을 바</tspan><tspan x="341" dy="26.099999999999998">꿉니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  결과 표시</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">현재 게임 상태에 맞는 움직</tspan><tspan x="635" dy="26.099999999999998">임을 보여 줍니다.</tspan></text></g></svg>