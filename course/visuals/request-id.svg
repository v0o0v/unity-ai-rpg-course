<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">요청 ID·세대 ID·오래된 응답 — 개념도</title><desc id="desc">비동기 요청에 식별자를 붙여 어느 요청의 결과인지 확인하는 방법입니다. 취소·새 지도 생성·새 클릭 이후 늦게 온 응답이 현재 상태를 덮어쓰지 않게 합니다. 1. 발급: 새 요청마다 구분 가능한 ID를 만듭니다. 2. 완료 대조: 현재 유효한 요청인지 확인합니다. 3. 무효 정리: 오래된 결과와 핸들을 버리거나 해제합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  요청 ID</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="247" height="84" rx="7" fill="#156f7522" stroke="#156f75" stroke-width="2"/><text x="180.5" y="161" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="180.5" dy="0">발급</tspan></text><rect x="318" y="110" width="247" height="84" rx="7" fill="#7555b722" stroke="#7555b7" stroke-width="2"/><text x="441.5" y="161" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="441.5" dy="0">완료 대조</tspan></text><rect x="579" y="110" width="247" height="84" rx="7" fill="#c5712122" stroke="#c57121" stroke-width="2"/><text x="702.5" y="161" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="702.5" dy="0">무효 정리</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#203447" stroke-width="3"/><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#203447" stroke="#203447" stroke-width="2"/><text x="57" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="450" y="314" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">이전 상태와 늦게 도착한 결과를 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  발급</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">새 요청마다 구분 가능한 ID</tspan><tspan x="47" dy="26.099999999999998">를 만듭니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  완료 대조</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">현재 유효한 요청인지 확인</tspan><tspan x="341" dy="26.099999999999998">합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  무효 정리</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">오래된 결과와 핸들을 버리</tspan><tspan x="635" dy="26.099999999999998">거나 해제합니다.</tspan></text></g></svg>