<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">로컬 전투 기록·텔레메트리 — 개념도</title><desc id="desc">텔레메트리는 실제 사용 중 발생한 사건과 측정을 기록하는 것입니다. 이 과정에서는 개인을 추적하는 서버 분석보다 로컬 전투 시간·피해 원인·재료 수지·입력 실패 같은 자료를 사용합니다. 1. 질문 정하기: 어떤 문제를 판단할지 먼저 정합니다. 2. 최소 기록: 시드·버전·상황과 필요한 수치만 남깁니다. 3. 해석: 표본·조건을 맞추고 사람의 관찰과 함께 봅니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  로컬 전투 기록</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="52" y="94" fill="#203447" font-size="22" font-weight="700" text-anchor="start"><tspan x="52" dy="0">프레임 시간 예산 · 수치는 설명용</tspan></text><text x="59" y="154" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">CPU 작업</tspan></text><rect x="246" y="126" width="310" height="39" rx="5" fill="#156f7533" stroke="#156f75" stroke-width="2"/><text x="573" y="153" fill="#156f75" font-size="19" font-weight="500" text-anchor="start"><tspan x="573" dy="0">10ms</tspan></text><text x="59" y="215" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">GPU 작업</tspan></text><rect x="246" y="187" width="434" height="39" rx="5" fill="#7555b733" stroke="#7555b7" stroke-width="2"/><text x="697" y="214" fill="#7555b7" font-size="19" font-weight="500" text-anchor="start"><tspan x="697" dy="0">14ms</tspan></text><text x="59" y="276" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">60fps 예산</tspan></text><rect x="246" y="248" width="517" height="39" rx="5" fill="#c5712133" stroke="#c57121" stroke-width="2"/><text x="779.7700000000001" y="275" fill="#c57121" font-size="19" font-weight="500" text-anchor="start"><tspan x="779.7700000000001" dy="0">16.67ms</tspan></text><text x="446" y="334" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="446" dy="0">겹쳐 실행될 수 있어 CPU+GPU 단순 합계는 아님</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  질문 정하기</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">어떤 문제를 판단할지 먼저</tspan><tspan x="47" dy="26.099999999999998">정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  최소 기록</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">시드·버전·상황과 필요한 수</tspan><tspan x="341" dy="26.099999999999998">치만 남깁니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  해석</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">표본·조건을 맞추고 사람의</tspan><tspan x="635" dy="26.099999999999998">관찰과 함께 봅니다.</tspan></text></g></svg>