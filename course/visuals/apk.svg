<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">APK·Android 설치 파일 — 개념도</title><desc id="desc">APK는 Android 기기에 설치하는 앱 패키지 형식입니다. 코드·리소스·메타데이터·서명 등을 담습니다. 모든 기기에서 무조건 설치되는 파일은 아닙니다. 1. 생성: 목표 SDK·ABI·서명·앱 ID로 빌드합니다. 2. 설치: 기기 권한과 설치 경로를 확인합니다. 3. 검사: 새 설치·업데이트·오프라인·저장 동작을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  APK</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="80" width="253" height="234" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="80" width="7" height="234" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="114" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">생성</tspan></text><text x="166.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">목표 SDK·ABI·서명·앱 ID로 빌드</tspan><tspan x="166.5" dy="26.099999999999998">합니다.</tspan></text><circle cx="265" cy="98" r="17" fill="#156f75" stroke="#156f75" stroke-width="2"/><text x="265" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="265" dy="0">1</tspan></text><line x1="299" y1="197" x2="319" y2="197" stroke="#156f75" stroke-width="3"/><polygon points="319,197 310.13005077220714,201.61779175541483 310.13005077220714,192.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="327" y="80" width="253" height="234" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="80" width="7" height="234" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="114" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">설치</tspan></text><text x="453.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">기기 권한과 설치 경로를 확인합</tspan><tspan x="453.5" dy="26.099999999999998">니다.</tspan></text><circle cx="552" cy="98" r="17" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="552" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="552" dy="0">2</tspan></text><line x1="586" y1="197" x2="606" y2="197" stroke="#7555b7" stroke-width="3"/><polygon points="606,197 597.1300507722071,201.61779175541483 597.1300507722071,192.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="614" y="80" width="253" height="234" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="80" width="7" height="234" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="114" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">검사</tspan></text><text x="740.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">새 설치·업데이트·오프라인·저장</tspan><tspan x="740.5" dy="26.099999999999998">동작을 확인합니다.</tspan></text><circle cx="839" cy="98" r="17" fill="#c57121" stroke="#c57121" stroke-width="2"/><text x="839" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="839" dy="0">3</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  생성</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">목표 SDK·ABI·서명·앱 ID로</tspan><tspan x="47" dy="26.099999999999998">빌드합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  설치</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">기기 권한과 설치 경로를 확</tspan><tspan x="341" dy="26.099999999999998">인합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">새 설치·업데이트·오프라인·</tspan><tspan x="635" dy="26.099999999999998">저장 동작을 확인합니다.</tspan></text></g></svg>