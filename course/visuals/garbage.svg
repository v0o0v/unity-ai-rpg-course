<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">GC·할당·메모리 누수 — 개념도</title><desc id="desc">할당은 새 객체가 사용할 메모리를 준비하는 일이고 GC는 더 이상 사용하지 않는 관리 객체의 메모리를 회수하는 작업입니다. 누수는 필요 없어진 자원을 계속 붙잡는 상황을 포함합니다. 1. 반복 할당: 매 프레임 새 목록·문자열이 생기는지 봅니다. 2. 참조 정리: 구독·핸들·풀 크기를 확인합니다. 3. 측정: 프레임 스파이크와 메모리 증가를 실제로 관찰합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  GC</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="61" y="85" width="248" height="225" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="61" y="85" width="7" height="225" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="185.0" y="119" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="185.0" dy="0">보관 중</tspan></text><text x="185.0" y="165" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="185.0" dy="0">초기화된 재사용 대상</tspan></text><rect x="585" y="85" width="248" height="225" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="585" y="85" width="7" height="225" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="709.0" y="119" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="709.0" dy="0">사용 중</tspan></text><text x="709.0" y="165" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="709.0" dy="0">위치·수명·참조 관리</tspan></text><line x1="326" y1="145" x2="566" y2="145" stroke="#156f75" stroke-width="3"/><polygon points="566,145 557.1300507722071,149.61779175541483 557.1300507722071,140.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><text x="446" y="129" fill="#156f75" font-size="22" font-weight="500" text-anchor="middle"><tspan x="446" dy="0">꺼내기</tspan></text><line x1="570" y1="251" x2="326" y2="251" stroke="#7555b7" stroke-width="3"/><polygon points="326,251 334.86994922779286,246.38220824458517 334.86994922779286,255.61779175541483" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="450" y="284" fill="#7555b7" font-size="21" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">정리 후 돌려놓기</tspan></text><circle cx="118" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><circle cx="185" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><circle cx="251" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><circle cx="644" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><circle cx="716" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><circle cx="782" cy="232" r="17" fill="#156f7522" stroke="#156f75" stroke-width="2"/><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  반복 할당</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">매 프레임 새 목록·문자열이</tspan><tspan x="47" dy="26.099999999999998">생기는지 봅니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  참조 정리</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">구독·핸들·풀 크기를 확인합</tspan><tspan x="341" dy="26.099999999999998">니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  측정</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">프레임 스파이크와 메모리</tspan><tspan x="635" dy="26.099999999999998">증가를 실제로 관찰합니다.</tspan></text></g></svg>