<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="조사와 추적 단서의 단서 표현 → 발견 확정 → 해석과 선택 흐름. 아래에 같은 내용을 자세히 설명합니다."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f7697"/></marker></defs><rect width="900" height="540" fill="#f6f7fc" rx="18"/><text x="35" y="37" font-family="sans-serif" font-size="12" fill="#667798" text-anchor="start">GRAY OATH / 302</text><text x="35" y="84" font-family="sans-serif" font-size="28" fill="#2a3c51" text-anchor="start">조사와 추적 단서</text><rect x="35" y="145" width="260" height="262" rx="15" fill="#e9edf7" stroke="#cad6e2"/><text x="57" y="182" font-family="sans-serif" font-size="15" fill="#7972ae" text-anchor="start">01</text><text x="57" y="220" font-family="sans-serif" font-size="22" fill="#2a3c51" text-anchor="start">단서 표현</text><text x="57" y="264" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">범위 안에서 단서를 읽을 수</text><text x="57" y="290" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">있게 표시합니다.</text><path d="M301 269H317" stroke="#6f7697" stroke-width="2" marker-end="url(#arrow)"/><rect x="323" y="145" width="260" height="262" rx="15" fill="#e5eee9" stroke="#cad6e2"/><text x="345" y="182" font-family="sans-serif" font-size="15" fill="#7972ae" text-anchor="start">02</text><text x="345" y="220" font-family="sans-serif" font-size="22" fill="#2a3c51" text-anchor="start">발견 확정</text><text x="345" y="264" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">Inspect 사건과 지식</text><text x="345" y="290" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">fact를 저장합니다.</text><path d="M589 269H605" stroke="#6f7697" stroke-width="2" marker-end="url(#arrow)"/><rect x="611" y="145" width="260" height="262" rx="15" fill="#e9edf7" stroke="#cad6e2"/><text x="633" y="182" font-family="sans-serif" font-size="15" fill="#7972ae" text-anchor="start">03</text><text x="633" y="220" font-family="sans-serif" font-size="22" fill="#2a3c51" text-anchor="start">해석과 선택</text><text x="633" y="264" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">수집한 사실에 따라 계약 해결</text><text x="633" y="290" font-family="sans-serif" font-size="17" fill="#2a3c51" text-anchor="start">경로를 엽니다.</text><text x="36" y="463" font-family="sans-serif" font-size="19" fill="#2a3c51" text-anchor="start">실제 자산·상태·검사 결과를 연결해 확인합니다.</text><text x="35" y="516" font-family="sans-serif" font-size="12" fill="#6e7d91" text-anchor="start">원리 설명용 그림 · 실제 Unity 화면/서비스 결과/성능 측정이 아닙니다.</text></svg>