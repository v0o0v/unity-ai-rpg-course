<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Inspector와 참조 연결 — 개념도</title><desc id="desc">Inspector는 선택한 오브젝트나 에셋의 컴포넌트와 설정을 보는 창입니다. 값만 바꾸는 곳이 아니라 어떤 객체를 사용해야 하는지 참조를 연결하는 곳이기도 합니다. 1. 대상 확인: 현재 어떤 객체를 선택했는지 확인합니다. 2. 설정 확인: 이동 속도와 그림·버튼 참조 등을 봅니다. 3. 실행 확인: 실제로 쓰이는 프리팹 인스턴스의 연결을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Inspector와 참조 연결</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><text x="195" y="99" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">Inspector와 참조 연결</tspan></text><rect x="128" y="154" width="135" height="136" rx="8" fill="#edf5f3" stroke="#156f75" stroke-width="2"/><line x1="146" y1="177" x2="244" y2="177" stroke="#156f75" stroke-width="3"/><line x1="146" y1="201" x2="244" y2="201" stroke="#526776" stroke-width="3"/><line x1="146" y1="225" x2="244" y2="225" stroke="#526776" stroke-width="3"/><line x1="146" y1="249" x2="244" y2="249" stroke="#526776" stroke-width="3"/><line x1="345" y1="187" x2="409" y2="100" stroke="#156f75" stroke-width="3"/><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="414" height="70" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="7" height="70" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="629.0" y="100" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">대상 확인</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#7555b7" stroke-width="3"/><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="414" height="70" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="7" height="70" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="629.0" y="186" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">설정 확인</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#c57121" stroke-width="3"/><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="414" height="70" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="7" height="70" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="629.0" y="272" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">실행 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  대상 확인</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">현재 어떤 객체를 선택했는</tspan><tspan x="47" dy="26.099999999999998">지 확인합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  설정 확인</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">이동 속도와 그림·버튼 참조</tspan><tspan x="341" dy="26.099999999999998">등을 봅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  실행 확인</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제로 쓰이는 프리팹 인스</tspan><tspan x="635" dy="26.099999999999998">턴스의 연결을 확인합니다.</tspan></text></g></svg>