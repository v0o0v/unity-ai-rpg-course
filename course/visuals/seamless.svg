<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">심리스·타일 반복·스타일 일관성 — 개념도</title><desc id="desc">심리스는 이미지를 반복했을 때 경계가 자연스럽게 이어지는 성질입니다. 스타일 일관성은 원근·색·선·광원·세부 밀도가 같은 게임처럼 보이는 성질입니다. 1. 반복: 타일을 3×3 이상 이어 봅니다. 2. 방향: 위·아래·좌·우 경계와 광원 방향을 봅니다. 3. 조합: 캐릭터·벽·바닥을 실제 카메라 크기에서 함께 봅니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  심리스</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="80" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="118" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="156" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="194" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="232" y="73" width="36" height="36" rx="3" fill="#365064" stroke="#ccdde1" stroke-width="1"/><rect x="270" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="308" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="346" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="384" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="422" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="460" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdd