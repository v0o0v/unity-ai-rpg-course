<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">메타 파일과 GUID — 개념도</title><desc id="desc">Unity의 .meta 파일은 에셋 식별자와 가져오기 설정 등을 보존합니다. GUID는 이름이나 폴더 위치와 별도로 에셋을 식별하는 값입니다. 1. 생성: Unity가 새 에셋을 인식하며 메타 정보를 만듭니다. 2. 참조: 씬·프리팹이 식별자를 통해 에셋을 찾습니다. 3. 이동: 원본과 .meta를 함께 보존하면 참조를 유지하기 쉽습니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  메타 파일과 GUID</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><text x="195" y="99" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">메타 파일과 GUID</tspan></text><rect x="128" y="154" width="135" height="136" rx="8" fill="#edf5f3" stroke="#156f75" stroke-width="2"/><line x1="146" y1="177" x2="244" y2="177" stroke="#156f75" stroke-width="3"/><line x1="146" y1="201" x2="244" y2="201" stroke="#526776" stroke-width="3"/><line x1="146" y1="225" x2="244" y2="225" stroke="#526776" stroke-width="3"/><line x1="146" y1="249" x2="244" y2="249" stroke="#526776" stroke-width="3"/><line x1="345" y1="187" x2="409" y2="100" stroke="#156f75" stroke-width="3"/><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="414" height="70" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="422" y="66" width="7" height="70" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="629.0" y="100" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">생성</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#7555b7" stroke-width="3"/><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="414" height="70" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="422" y="152" width="7" height="70" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="629.0" y="186" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">참조</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#c57121" stroke-width="3"/><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="414" height="70" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="422" y="238" width="7" height="70" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="629.0" y="272" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">이동</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  생성</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">Unity가 새 에셋을 인식하며</tspan><tspan x="47" dy="26.099999999999998">메타 정보를 만듭니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  참조</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">씬·프리팹이 식별자를 통해</tspan><tspan x="341" dy="26.099999999999998">에셋을 찾습니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  이동</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">원본과 .meta를 함께 보존하</tspan><tspan x="635" dy="26.099999999999998">면 참조를 유지하기 쉽습니</tspan><tspan x="635" dy="26.099999999999998">다.</tspan></text></g></svg>