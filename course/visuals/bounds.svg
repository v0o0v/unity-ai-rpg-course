<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">경계 상자·AABB·반경 — 개념도</title><desc id="desc">Bounds는 대상을 감싸는 범위이며 AABB는 좌표축에 맞춘 경계 상자입니다. 넓은 후보를 빠르게 찾는 데 유용하지만 실제 모양과 같지는 않습니다. 1. 범위 구성: 대상의 최소·최대 좌표를 구합니다. 2. 넓은 검사: 겹칠 가능성이 있는 후보를 찾습니다. 3. 정밀 검사: 실제 원·다각형·Collider와 맞는지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  경계 상자</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="43" y="64" width="805" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="533" y="88" width="55" height="196" rx="3" fill="#496577" stroke="#496577" stroke-width="2"/><text x="560" y="79" fill="#203447" font-size="20" font-weight="500" text-anchor="middle"><tspan x="560" dy="0">벽</tspan></text><g transform="translate(245,261) scale(1.65)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-14.0" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="14.0" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-22.5" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-36.0" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-35.0" x2="53.0" y2="-71.5" stroke="#c57121" stroke-width="5"/></g><circle cx="245" cy="254" r="34" fill="none" stroke="#156f75" stroke-width="5"/><rect x="190" y="105" width="110" height="155" rx="12" fill="none" stroke="#7555b7" stroke-width="3"/><text x="86" y="92" fill="#203447" font-size="22" font-weight="700" text-anchor="start"><tspan x="86" dy="0">그림 ≠ 몸체 ≠ 공격</tspan></text><polygon points="275,220 424,157 431,261" fill="#c5712130" stroke="#c57121" stroke-width="3"/><text x="380" y="124" fill="#c57121" font-size="20" font-weight="500" text-anchor="middle"><tspan x="380" dy="0">공격 영역</tspan></text><text x="696" y="133" fill="#203447" font-size="22" font-weight="500" text-anchor="middle"><tspan x="696" dy="0">큰 그림이어도</tspan></text><text x="696" y="170" fill="#203447" font-size="22" font-weight="500" text-anchor="middle"><tspan x="696" dy="0">실제 경계는</tspan></text><text x="696" y="207" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="696" dy="0">따로 검사</tspan></text><text x="206" y="290" fill="#156f75" font-size="19" font-weight="500" text-anchor="start"><tspan x="206" dy="0">몸체</tspan></text><text x="120" y="141" fill="#7555b7" font-size="19" font-weight="500" text-anchor="start"><tspan x="120" dy="0">피격</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  범위 구성</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">대상의 최소·최대 좌표를 구</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  넓은 검사</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">겹칠 가능성이 있는 후보를</tspan><tspan x="341" dy="26.099999999999998">찾습니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  정밀 검사</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 원·다각형·Collider와</tspan><tspan x="635" dy="26.099999999999998">맞는지 확인합니다.</tspan></text></g></svg>