<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">오버드로·투명 효과 비용 — 개념도</title><desc id="desc">오버드로는 같은 화면 픽셀을 여러 번 그리는 상황입니다. 반투명 효과가 겹치면 최종적으로 한 픽셀만 보이더라도 여러 계산이 필요할 수 있습니다. 1. 겹침 관찰: 큰 투명 사각형과 효과 겹침을 찾습니다. 2. 영역 축소: 보이지 않는 여백과 입자 수명을 줄입니다. 3. 측정: GPU 시간과 읽기 쉬움을 함께 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  오버드로</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="102" y="86" width="319" height="110" rx="10" fill="#156f7524" stroke="#156f75" stroke-width="2"/><rect x="177" y="116" width="319" height="110" rx="10" fill="#7555b724" stroke="#7555b7" stroke-width="2"/><rect x="252" y="146" width="319" height="110" rx="10" fill="#c5712124" stroke="#c57121" stroke-width="2"/><rect x="327" y="176" width="319" height="110" rx="10" fill="#156f7524" stroke="#156f75" stroke-width="2"/><rect x="402" y="206" width="319" height="110" rx="10" fill="#7555b724" stroke="#7555b7" stroke-width="2"/><text x="667" y="131" fill="#203447" font-size="25" font-weight="500" text-anchor="middle"><tspan x="667" dy="0">같은 픽셀을</tspan></text><text x="667" y="176" fill="#203447" font-size="25" font-weight="700" text-anchor="middle"><tspan x="667" dy="0">여러 번 그리기</tspan></text><text x="667" y="233" fill="#156f75" font-size="20" font-weight="500" text-anchor="middle"><tspan x="667" dy="0">투명 면적도 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  겹침 관찰</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">큰 투명 사각형과 효과 겹침</tspan><tspan x="47" dy="26.099999999999998">을 찾습니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  영역 축소</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">보이지 않는 여백과 입자 수</tspan><tspan x="341" dy="26.099999999999998">명을 줄입니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  측정</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">GPU 시간과 읽기 쉬움을 함</tspan><tspan x="635" dy="26.099999999999998">께 확인합니다.</tspan></text></g></svg>