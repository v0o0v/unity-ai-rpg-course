<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">컬링·카메라 가림·LOD — 개념도</title><desc id="desc">컬링은 그리지 않아도 되는 대상을 제외하는 과정이고, LOD는 거리 등에 따라 표현의 세부 수준을 바꾸는 방식입니다. 카메라가 캐릭터를 벽으로 가리는 문제와 구분합니다. 1. 대상 판단: 카메라 밖·가려진 대상 등을 확인합니다. 2. 표현 조절: 안전한 기준으로 그리기나 세부를 줄입니다. 3. 게임 보존: 숨겨진 적의 규칙·저장·필수 정보는 의도대로 유지합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  컬링</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="45" y="65" width="355" height="242" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="130" y1="263" x2="335" y2="263" stroke="#156f75" stroke-width="3"/><polygon points="335,263 326.13005077220714,267.6177917554148 326.13005077220714,258.3822082445852" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="130" y1="263" x2="130" y2="95" stroke="#7555b7" stroke-width="3"/><polygon points="130,95 134.61779175541483,103.86994922779284 125.38220824458517,103.86994922779284" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="342" y="266" fill="#156f75" font-size="20" font-weight="500" text-anchor="start"><tspan x="342" dy="0">X</tspan></text><text x="122" y="85" fill="#7555b7" font-size="20" font-weight="500" text-anchor="start"><tspan x="122" dy="0">Y</tspan></text><text x="220" y="295" fill="#203447" font-size="20" font-weight="700" text-anchor="middle"><tspan x="220" dy="0">2D · XY</tspan></text><g transform="translate(265,181) scale(0.64)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><circle cx="265" cy="181" r="5" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="265" y1="181" x2="265" y2="263" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><text x="247" y="223" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="247" dy="0">(u, v)</tspan></text><rect x="490" y="65" width="355" height="242" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="575" y1="263" x2="780" y2="263" stroke="#156f75" stroke-width="3"/><polygon points="780,263 771.1300507722071,267.6177917554148 771.1300507722071,258.3822082445852" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="575" y1="263" x2="575" y2="95" stroke="#7555b7" stroke-width="3"/><polygon points="575,95 579.6177917554148,103.86994922779284 570.3822082445852,103.86994922779284" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="787" y="266" fill="#156f75" font-size="20" font-weight="500" text-anchor="start"><tspan x="787" dy="0">X</tspan></text><text x="567" y="85" fill="#7555b7" font-size="20" font-weight="500" text-anchor="start"><tspan x="567" dy="0">Z</tspan></text><text x="665" y="295" fill="#203447" font-size="20" font-weight="700" text-anchor="middle"><tspan x="665" dy="0">3D · XZ</tspan></text><g transform="translate(710,181) scale(0.64)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><circle cx="710" cy="181" r="5" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="710" y1="181" x2="710" y2="263" stroke="#526776" stroke-width="2" stroke-dasharray="7 6"/><text x="692" y="223" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="692" dy="0">(u, 0, v)</tspan></text><line x1="420" y1="173" x2="475" y2="173" stroke="#156f75" stroke-width="3"/><polygon points="475,173 466.13005077220714,177.61779175541483 466.13005077220714,168.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  대상 판단</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">카메라 밖·가려진 대상 등을</tspan><tspan x="47" dy="26.099999999999998">확인합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  표현 조절</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">안전한 기준으로 그리기나</tspan><tspan x="341" dy="26.099999999999998">세부를 줄입니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  게임 보존</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">숨겨진 적의 규칙·저장·필수</tspan><tspan x="635" dy="26.099999999999998">정보는 의도대로 유지합니</tspan><tspan x="635" dy="26.099999999999998">다.</tspan></text></g></svg>