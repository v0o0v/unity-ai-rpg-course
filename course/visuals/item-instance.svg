<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">아이템 인스턴스와 소유권 — 개념도</title><desc id="desc">인스턴스는 실제로 생성되어 소유되는 한 개의 물건입니다. 같은 종류의 검이라도 고유 ID·랜덤 옵션·소켓 상태가 각각 다를 수 있습니다. 1. 생성: 한 번 고유 ID와 옵션을 결정합니다. 2. 이동: 바닥→가방→장비→창고 사이에서 같은 물건을 옮깁니다. 3. 보존: 저장·로드에서 ID와 상태를 그대로 복원합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  아이템 인스턴스와 소유권</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="78" x2="95" y2="105" stroke="#156f75" stroke-width="5"/><rect x="120" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="275" y1="78" x2="293" y2="105" stroke="#156f75" stroke-width="5"/><rect x="318" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="54" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="120" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="209" y1="134" x2="227" y2="161" stroke="#156f75" stroke-width="5"/><rect x="252" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="318" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="407" y1="134" x2="425" y2="161" stroke="#156f75" stroke-width="5"/><rect x="54" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="120" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="143" y1="190" x2="161" y2="217" stroke="#156f75" stroke-width="5"/><rect x="186" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="318" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="341" y1="190" x2="359" y2="217" stroke="#156f75" stroke-width="5"/><rect x="384" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="54" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="246" x2="95" y2="273" stroke="#156f75" stroke-width="5"/><rect x="120" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="275" y1="246" x2="293" y2="273" stroke="#156f75" stroke-width="5"/><rect x="318" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="231" y="324" fill="#203447" font-size="21" font-weight="500" text-anchor="middle"><tspan x="231" dy="0">가방 24칸 · 위치는 달라도</tspan></text><line x1="467" y1="186" x2="538" y2="186" stroke="#156f75" stroke-width="3"/><polygon points="538,186 529.1300507722071,190.61779175541483 529.1300507722071,181.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="552" y="98" width="284" height="181" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="552" y="98" width="7" height="181" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="694.0" y="132" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="694.0" dy="0">고유 ID는 유지</tspan></text><text x="694.0" y="178" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="694.0" dy="0">가방 → 장비 → 창고</tspan><tspan x="694.0" dy="26.099999999999998">이동해도 같은 한 자루</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  생성</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">한 번 고유 ID와 옵션을 결</tspan><tspan x="47" dy="26.099999999999998">정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  이동</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">바닥→가방→장비→창고 사이에</tspan><tspan x="341" dy="26.099999999999998">서 같은 물건을 옮깁니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  보존</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">저장·로드에서 ID와 상태를</tspan><tspan 