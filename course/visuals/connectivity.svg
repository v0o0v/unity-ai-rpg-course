<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">연결성·BFS·도달 가능성 — 개념도</title><desc id="desc">연결성 검사는 출발점에서 허용된 통로를 따라 목표에 도달할 수 있는지 확인합니다. BFS는 가까운 단계부터 이웃을 넓혀 가는 탐색 방법입니다. 1. 출발 표시: 입구를 방문한 칸으로 기록합니다. 2. 이웃 확장: 통과 가능한 인접 칸을 반복 방문합니다. 3. 비교: 보스방·출구·보상 위치가 방문 목록에 있는지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  연결성</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="80" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="118" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="156" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="194" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="232" y="73" width="36" height="36" rx="3" fill="#365064" stroke="#ccdde1" stroke-width="1"/><rect x="270" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="308" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="346" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="384" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="422" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="460" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde