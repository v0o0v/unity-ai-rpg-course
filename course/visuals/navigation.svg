<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">경로와 경유점 — 개념도</title><desc id="desc">경로는 목적지까지 지나갈 점이나 구간의 목록입니다. 이동 모터는 다음 경유점을 향해 움직이고, 새 입력·막힘·사망 때 경로를 취소하거나 갱신합니다. 1. 계산: 현재 위치와 목표로 경로를 요청합니다. 2. 추종: 다음 경유점으로 이동합니다. 3. 갱신·취소: 새 명령과 지도 변경 때 오래된 결과를 버립니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  경로와 경유점</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="80" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="118" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="156" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="194" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="232" y="73" width="36" height="36" rx="3" fill="#365064" stroke="#ccdde1" stroke-width="1"/><rect x="270" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="308" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="346" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="384" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="422" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-width="1"/><rect x="460" y="73" width="36" height="36" rx="3" fill="white" stroke="#ccdde1" stroke-w