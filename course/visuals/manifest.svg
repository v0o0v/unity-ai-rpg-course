<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">매니페스트·패키지 목록·빌드 기록 — 개념도</title><desc id="desc">매니페스트는 어떤 구성요소와 설정이 포함되어 있는지 설명하는 목록입니다. Unity Packages의 manifest, Android Manifest, 실습 자료의 파일 목록은 이름이 같아도 역할이 다릅니다. 1. 대상 구분: 어느 시스템의 manifest인지 확인합니다. 2. 구성 기록: 패키지·권한·파일·버전 등 해당 항목을 읽습니다. 3. 실제 대조: 목록과 설치·빌드·파일 결과가 일치하는지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  매니페스트</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="39" y="86" width="7" height="200" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="165.5" y="120" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">대상 구분</tspan></text><text x="165.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">어느 시스템의 manifest인지 확인</tspan><tspan x="165.5" dy="26.099999999999998">합니다.</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#156f75" stroke-width="3"/><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="326" y="86" width="253" height="200" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="326" y="86" width="7" height="200" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="452.5" y="120" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">구성 기록</tspan></text><text x="452.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">패키지·권한·파일·버전 등 해당</tspan><tspan x="452.5" dy="26.099999999999998">항목을 읽습니다.</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#7555b7" stroke-width="3"/><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="613" y="86" width="253" height="200" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="613" y="86" width="7" height="200" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="739.5" y="120" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">실제 대조</tspan></text><text x="739.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">목록과 설치·빌드·파일 결과가 일</tspan><tspan x="739.5" dy="26.099999999999998">치하는지 확인합니다.</tspan></text><text x="450" y="329" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  대상 구분</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">어느 시스템의 manifest인지</tspan><tspan x="47" dy="26.099999999999998">확인합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  구성 기록</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">패키지·권한·파일·버전 등</tspan><tspan x="341" dy="26.099999999999998">해당 항목을 읽습니다.</tspa