<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">DTO·저장 데이터와 런타임 상태 — 개념도</title><desc id="desc">DTO는 저장이나 전송을 위해 필요한 값을 단순하게 묶은 데이터 구조입니다. 실행 중 컴포넌트·이벤트 구독·화면 객체를 그대로 담지 않도록 경계를 만듭니다. 1. 선택: 레벨·장비·퀘스트 등 영구 값만 고릅니다. 2. 형식: 복원 가능한 ID·수치·목록으로 표현합니다. 3. 재연결: 로드 후 정의·씬·UI를 현재 객체로 연결합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  DTO</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="39" y="86" width="7" height="200" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="165.5" y="120" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">선택</tspan></text><text x="165.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">레벨·장비·퀘스트 등 영구 값만</tspan><tspan x="165.5" dy="26.099999999999998">고릅니다.</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#156f75" stroke-width="3"/><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="326" y="86" width="253" height="200" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="326" y="86" width="7" height="200" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="452.5" y="120" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">형식</tspan></text><text x="452.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">복원 가능한 ID·수치·목록으로 표</tspan><tspan x="452.5" dy="26.099999999999998">현합니다.</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#7555b7" stroke-width="3"/><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="613" y="86" width="253" height="200" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="613" y="86" width="7" height="200" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="739.5" y="120" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">재연결</tspan></text><text x="739.5" y="166" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">로드 후 정의·씬·UI를 현재 객체</tspan><tspan x="739.5" dy="26.099999999999998">로 연결합니다.</tspan></text><text x="450" y="329" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  선택</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">레벨·장비·퀘스트 등 영구</tspan><tspan x="47" dy="26.099999999999998">값만 고릅니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  형식</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">복원 가능한 ID·수치·목록으</tspan><tspan x="341" dy="26.099999999999998">로 표현합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  재연결</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">로드 후 정의·씬·UI를 현재</tspan><tspan x="635" dy="26.099999999999998">객체로 연결합니다.</tspan></text></g></svg>