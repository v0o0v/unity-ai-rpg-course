<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">상태 기계·FSM — 개념도</title><desc id="desc">상태 기계는 현재 상태와 사건에 따라 다음 행동을 정하는 구조입니다. 대기·추적·공격 준비·공격·회복·사망처럼 동시에 해서는 안 되는 동작을 명확히 나눕니다. 1. 상태 정의: 각 상태에서 허용되는 행동을 정합니다. 2. 전환 조건: 거리·시야·시간·사망 사건을 검사합니다. 3. 진입·종료: 타이머와 공격 권한을 준비하고 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  상태 기계</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><circle cx="166" cy="173" r="88" fill="#156f7515" stroke="#156f75" stroke-width="3"/><text x="166" y="170" fill="#156f75" font-size="22" font-weight="700" text-anchor="middle"><tspan x="166" dy="0">상태 정의</tspan></text><line x1="264" y1="173" x2="344" y2="173" stroke="#156f75" stroke-width="3"/><polygon points="344,173 335.13005077220714,177.61779175541483 335.13005077220714,168.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><circle cx="449" cy="173" r="88" fill="#7555b715" stroke="#7555b7" stroke-width="3"/><text x="449" y="170" fill="#7555b7" font-size="22" font-weight="700" text-anchor="middle"><tspan x="449" dy="0">전환 조건</tspan></text><line x1="547" y1="173" x2="627" y2="173" stroke="#7555b7" stroke-width="3"/><polygon points="627,173 618.1300507722071,177.61779175541483 618.1300507722071,168.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><circle cx="732" cy="173" r="88" fill="#c5712115" stroke="#c57121" stroke-width="3"/><text x="732" y="170" fill="#c57121" font-size="22" font-weight="700" text-anchor="middle"><tspan x="732" dy="0">진입·종료</tspan></text><text x="451" y="302" fill="#203447" font-size="22" font-weight="500" text-anchor="middle"><tspan x="451" dy="0">전이 조건 · 취소 · 종료를 명시</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  상태 정의</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">각 상태에서 허용되는 행동</tspan><tspan x="47" dy="26.099999999999998">을 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  전환 조건</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">거리·시야·시간·사망 사건을</tspan><tspan x="341" dy="26.099999999999998">검사합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  진입·종료</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">타이머와 공격 권한을 준비</tspan><tspan x="635" dy="26.099999999999998">하고 정리합니다.</tspan></text></g></svg>