<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">동시 공격 제한·공격 토큰 — 개념도</title><desc id="desc">공격 토큰은 여러 적 중 동시에 공격할 수 있는 수를 제한하는 게임 규칙입니다. 접근 슬롯은 한 지점에 적이 겹치지 않도록 접근 위치를 나누는 규칙입니다. 모델 입력의 토큰과는 다릅니다. 1. 신청: 공격 가능한 적이 권한을 요청합니다. 2. 보유: 허용 수 안에서 예고·공격을 수행합니다. 3. 반환: 회복·취소·사망·씬 종료 때 권한을 돌려줍니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  동시 공격 제한</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="71" y="94" fill="#203447" font-size="24" font-weight="700" text-anchor="start"><tspan x="71" dy="0">한도 안에서만 권한·자원 사용</tspan></text><circle cx="94" cy="177" r="29" fill="#156f7522" stroke="#156f75" stroke-width="3"/><text x="94" y="184" fill="#156f75" font-size="16" font-weight="700" text-anchor="middle"><tspan x="94" dy="0">사용</tspan></text><circle cx="191" cy="177" r="29" fill="#156f7522" stroke="#156f75" stroke-width="3"/><text x="191" y="184" fill="#156f75" font-size="16" font-weight="700" text-anchor="middle"><tspan x="191" dy="0">사용</tspan></text><circle cx="288" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="288" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="288" dy="0">대기</tspan></text><circle cx="385" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="385" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="385" dy="0">대기</tspan></text><circle cx="482" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="482" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="482" dy="0">대기</tspan></text><circle cx="579" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="579" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="579" dy="0">대기</tspan></text><circle cx="676" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="676" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="676" dy="0">대기</tspan></text><circle cx="773" cy="177" r="29" fill="white" stroke="#ccdde1" stroke-width="3"/><text x="773" y="184" fill="#526776" font-size="16" font-weight="700" text-anchor="middle"><tspan x="773" dy="0">대기</tspan></text><text x="448" y="272" fill="#203447" font-size="23" font-weight="500" text-anchor="middle"><tspan x="448" dy="0">획득 → 작업 → 반환 / 정산</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  신청</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">공격 가능한 적이 권한을 요</tspan><tspan x="47" dy="26.099999999999998">청합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  보유</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">허용 수 안에서 예고·공격을</tspan><tspan x="341" dy="26.099999999999998">수행합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  반환</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">회복·취소·사망·씬 종료 때</tspan><tspan x="635" dy="26.099999999999998">권한을 돌려줍니다.</tspan></text></g></svg>