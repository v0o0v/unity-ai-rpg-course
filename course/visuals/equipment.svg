<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">장비·슬롯·재계산 — 개념도</title><desc id="desc">장비 시스템은 특정 슬롯에 아이템을 배치하고 그 결과로 능력치를 계산합니다. 재계산은 현재 기본값과 실제 장비 목록에서 매번 결과를 만드는 방식입니다. 1. 호환 확인: 무기·갑옷·장신구 슬롯에 맞는지 검사합니다. 2. 교체: 기존 아이템과 새 아이템 위치를 한 번에 바꿉니다. 3. 재계산: 기본·레벨·장비·룬 값을 규칙대로 합칩니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  장비</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="78" x2="95" y2="105" stroke="#156f75" stroke-width="5"/><rect x="120" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="275" y1="78" x2="293" y2="105" stroke="#156f75" stroke-width="5"/><rect x="318" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="68" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="54" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="120" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="209" y1="134" x2="227" y2="161" stroke="#156f75" stroke-width="5"/><rect x="252" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="318" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="124" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="407" y1="134" x2="425" y2="161" stroke="#156f75" stroke-width="5"/><rect x="54" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="120" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="143" y1="190" x2="161" y2="217" stroke="#156f75" stroke-width="5"/><rect x="186" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="318" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="341" y1="190" x2="359" y2="217" stroke="#156f75" stroke-width="5"/><rect x="384" y="180" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="54" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="246" x2="95" y2="273" stroke="#156f75" stroke-width="5"/><rect x="120" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="186" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="252" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="275" y1="246" x2="293" y2="273" stroke="#156f75" stroke-width="5"/><rect x="318" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><rect x="384" y="236" width="58" height="48" rx="5" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="231" y="324" fill="#203447" font-size="21" font-weight="500" text-anchor="middle"><tspan x="231" dy="0">가방 24칸 · 위치는 달라도</tspan></text><line x1="467" y1="186" x2="538" y2="186" stroke="#156f75" stroke-width="3"/><polygon points="538,186 529.1300507722071,190.61779175541483 529.1300507722071,181.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="552" y="98" width="284" height="181" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="552" y="98" width="7" height="181" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="694.0" y="132" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="694.0" dy="0">고유 ID는 유지</tspan></text><text x="694.0" y="178" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="694.0" dy="0">가방 → 장비 → 창고</tspan><tspan x="694.0" dy="26.099999999999998">이동해도 같은 한 자루</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  호환 확인</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">무기·갑옷·장신구 슬롯에 맞</tspan><tspan x="47" dy="26.099999999999998">는지 검사합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  교체</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">기존 아이템과 새 아이템 위</tspan><tspan x="341" dy="26.099999999999998">치를 한 번에 바꿉니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  재계산</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">기본·레벨·장비·룬 값을 규</tspan><tspan x="635" dy="26.099999999999998">칙대로 합칩니다.</tspan></text></g></svg>