<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">클래스·객체·인스턴스 — 개념도</title><desc id="desc">클래스는 데이터와 동작을 정의하는 틀이고 객체는 그 틀에 따라 만들어진 실제 대상입니다. Unity의 GameObject와 프로그래밍의 일반 객체는 범위가 다릅니다. 1. 정의: 어떤 데이터와 동작을 가질지 정합니다. 2. 생성: 필요한 객체를 만들고 값을 넣습니다. 3. 사용: 참조를 통해 읽고 동작을 요청합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  클래스</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="49" y="94" width="225" height="205" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="49" y="94" width="7" height="205" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="161.5" y="128" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="161.5" dy="0">종류 정의</tspan></text><text x="161.5" y="174" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="161.5" dy="0">철검</tspan><tspan x="161.5" dy="26.099999999999998">기본 공격력</tspan></text><line x1="286" y1="147" x2="399" y2="129" stroke="#7555b7" stroke-width="3"/><polygon points="399,129 390.96690547304456,134.9556185506628 389.51406723806184,125.8350229643822" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><line x1="286" y1="236" x2="399" y2="264" stroke="#c57121" stroke-width="3"/><polygon points="399,264 389.27977869233786,266.348892873264 391.50106557438824,257.3844136707035" fill="#c57121" stroke="#c57121" stroke-width="2"/><rect x="417" y="76" width="410" height="100" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="417" y="76" width="7" height="100" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="622.0" y="110" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="622.0" dy="0">검 A · item-a</tspan></text><text x="622.0" y="156" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="622.0" dy="0">확정 옵션 +3</tspan></text><rect x="417" y="214" width="410" height="100" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="417" y="214" width="7" height="100" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="622.0" y="248" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="622.0" dy="0">검 B · item-b</tspan></text><text x="622.0" y="294" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="622.0" dy="0">확정 옵션 +5</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  정의</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">어떤 데이터와 동작을 가질</tspan><tspan x="47" dy="26.099999999999998">지 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  생성</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">필요한 객체를 만들고 값을</tspan><tspan x="341" dy="26.099999999999998">넣습니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  사용</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">참조를 통해 읽고 동작을 요</tspan><tspan x="635" dy="26.099999999999998">청합니다.</tspan></text></g></svg>