<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">그림자·가림·가시성 — 개념도</title><desc id="desc">그림자는 빛이 물체에 가려져 생기는 어두운 영역이고, 카메라 가림은 시점과 대상 사이의 물체가 화면을 막는 문제입니다. 적 시야 차단은 게임 규칙의 감지 판정이라 세 가지를 구분합니다. 1. 빛 경로: 무엇이 그림자를 만들고 받는지 정합니다. 2. 카메라 경로: 주인공을 가리는 벽의 페이드·카메라 정책을 정합니다. 3. 감지 경로: AI가 벽을 투시하지 않게 별도로 검사합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  그림자</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="80" width="253" height="234" rx="10" fill="white" stroke="#156f75" stroke-width="2"/><rect x="40" y="80" width="7" height="234" rx="2" fill="#156f75" stroke="#156f75" stroke-width="0"/><text x="166.5" y="114" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">빛 경로</tspan></text><text x="166.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">무엇이 그림자를 만들고 받는지</tspan><tspan x="166.5" dy="26.099999999999998">정합니다.</tspan></text><circle cx="265" cy="98" r="17" fill="#156f75" stroke="#156f75" stroke-width="2"/><text x="265" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="265" dy="0">1</tspan></text><line x1="299" y1="197" x2="319" y2="197" stroke="#156f75" stroke-width="3"/><polygon points="319,197 310.13005077220714,201.61779175541483 310.13005077220714,192.38220824458517" fill="#156f75" stroke="#156f75" stroke-width="2"/><rect x="327" y="80" width="253" height="234" rx="10" fill="white" stroke="#7555b7" stroke-width="2"/><rect x="327" y="80" width="7" height="234" rx="2" fill="#7555b7" stroke="#7555b7" stroke-width="0"/><text x="453.5" y="114" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">카메라 경로</tspan></text><text x="453.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">주인공을 가리는 벽의 페이드·카</tspan><tspan x="453.5" dy="26.099999999999998">메라 정책을 정합니다.</tspan></text><circle cx="552" cy="98" r="17" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><text x="552" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="552" dy="0">2</tspan></text><line x1="586" y1="197" x2="606" y2="197" stroke="#7555b7" stroke-width="3"/><polygon points="606,197 597.1300507722071,201.61779175541483 597.1300507722071,192.38220824458517" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><rect x="614" y="80" width="253" height="234" rx="10" fill="white" stroke="#c57121" stroke-width="2"/><rect x="614" y="80" width="7" height="234" rx="2" fill="#c57121" stroke="#c57121" stroke-width="0"/><text x="740.5" y="114" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">감지 경로</tspan></text><text x="740.5" y="160" fill="#526776" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">AI가 벽을 투시하지 않게 별도로</tspan><tspan x="740.5" dy="26.099999999999998">검사합니다.</tspan></text><circle cx="839" cy="98" r="17" fill="#c57121" stroke="#c57121" stroke-width="2"/><text x="839" y="104" fill="white" font-size="15" font-weight="700" text-anchor="middle"><tspan x="839" dy="0">3</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  빛 경로</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">무엇이 그림자를 만들고 받</tspan><tspan x="47" dy="26.099999999999998">는지 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  카메라 경로</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">주인공을 가리는 벽의 페이</tspan><tspan x="341" dy="26.099999999999998">드·카메라 정책을 정합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  감지 경로</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">AI가 벽을 투시하지 않게 별</tspan><tspan x="635" dy="26.099999999999998">도로 검사합니다.</tspan></text></g></svg>