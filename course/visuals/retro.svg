<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Retro Diffusion·픽셀 모델·프리셋 — 개념도</title><desc id="desc">Retro Diffusion은 픽셀 아트에 맞춘 이미지 제작 모델과 프리셋을 제공하는 도구입니다. 프리셋은 스타일·크기·작업 목적에 맞춘 출발 설정이지 모든 프레임의 품질 보증은 아닙니다. 1. 경로 선택: 캐릭터·타일·동작에 맞는 실제 지원 프리셋을 확인합니다. 2. 후보 제작: 규격·참조·팔레트를 고정해 비교합니다. 3. 후처리: 실제 픽셀 크기와 투명도·연속성을 검사합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Retro Diffusion</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="77" y1="257" x2="276" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(177,252) scale(0.5)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#156f75" stroke="#156f75" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#156f75" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#156f75" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="177" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="177" dy="0">PPU 128 → 0.5유닛</tspan></text><rect x="309" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="332" y1="257" x2="531" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(432,252) scale(1)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#7555b7" stroke="#7555b7" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#7555b7" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#7555b7" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="432" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="432" dy="0">PPU 64 → 1유닛</tspan></text><rect x="583" y="67" width="244" height="243" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><line x1="606" y1="257" x2="805" y2="257" stroke="#526776" stroke-width="2"/><g transform="translate(706,252) scale(2)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#20344720"/><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#203447" stroke-width="2"/><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#c57121" stroke="#c57121" stroke-width="2"/><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#203447" stroke-width="7"/><line x1="10" y1="-22" x2="17" y2="0" stroke="#203447" stroke-width="7"/><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#c57121" stroke-width="8"/><line x1="18" y1="-50" x2="32" y2="-31" stroke="#c57121" stroke-width="8"/><line x1="30" y1="-30" x2="45" y2="-69" stroke="#c57121" stroke-width="5"/></g><text x="706" y="284" fill="#203447" font-size="17" font-weight="600" text-anchor="middle"><tspan x="706" dy="0">PPU 32 → 2유닛</tspan></text><text x="452" y="328" fill="#526776" font-size="19" font-weight="500" text-anchor="middle"><tspan x="452" dy="0">같은 64px 원본을 다른 월드 크기로 표현한 예</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  경로 선택</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">캐릭터·타일·동작에 맞는 실</tspan><tspan x="47" dy="26.099999999999998">제 지원 프리셋을 확인합니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  후보 제작</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">규격·참조·팔레트를 고정해</tspan><tspan x="341" dy="26.099999999999998">비교합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  후처리</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 픽셀 크기와 투명도·연</tspan><tspan x="635" dy="26.099999999999998">속성을 검사합니다.</tspan></text></g></svg>