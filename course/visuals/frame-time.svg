<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">FPS·프레임 시간·ms — 개념도</title><desc id="desc">FPS는 1초에 그린 프레임 수, 프레임 시간은 한 프레임에 걸린 시간입니다. 60FPS는 평균적으로 약 16.67ms, 30FPS는 약 33.33ms에 해당합니다. 순간 끊김은 평균만 보면 숨겨질 수 있습니다. 1. 예산: 목표 FPS에 맞는 시간을 잡습니다. 2. 측정: CPU·GPU·메모리·순간 스파이크를 봅니다. 3. 비교: 같은 기기·같은 전투로 수정 전후를 비교합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  FPS</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="52" y="94" fill="#203447" font-size="22" font-weight="700" text-anchor="start"><tspan x="52" dy="0">프레임 시간 예산 · 수치는 설명용</tspan></text><text x="59" y="154" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">CPU 작업</tspan></text><rect x="246" y="126" width="310" height="39" rx="5" fill="#156f7533" stroke="#156f75" stroke-width="2"/><text x="573" y="153" fill="#156f75" font-size="19" font-weight="500" text-anchor="start"><tspan x="573" dy="0">10ms</tspan></text><text x="59" y="215" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">GPU 작업</tspan></text><rect x="246" y="187" width="434" height="39" rx="5" fill="#7555b733" stroke="#7555b7" stroke-width="2"/><text x="697" y="214" fill="#7555b7" font-size="19" font-weight="500" text-anchor="start"><tspan x="697" dy="0">14ms</tspan></text><text x="59" y="276" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="59" dy="0">60fps 예산</tspan></text><rect x="246" y="248" width="517" height="39" rx="5" fill="#c5712133" stroke="#c57121" stroke-width="2"/><text x="779.7700000000001" y="275" fill="#c57121" font-size="19" font-weight="500" text-anchor="start"><tspan x="779.7700000000001" dy="0">16.67ms</tspan></text><text x="446" y="334" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="446" dy="0">겹쳐 실행될 수 있어 CPU+GPU 단순 합계는 아님</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  예산</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">목표 FPS에 맞는 시간을 잡</tspan><tspan x="47" dy="26.099999999999998">습니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  측정</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">CPU·GPU·메모리·순간 스파이</tspan><tspan x="341" dy="26.099999999999998">크를 봅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  비교</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">같은 기기·같은 전투로 수정</tspan><tspan x="635" dy="26.099999999999998">전후를 비교합니다.</tspan></text></g></svg>