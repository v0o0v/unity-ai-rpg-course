<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">입력 버퍼·취소·우선순위 — 개념도</title><desc id="desc">입력 버퍼는 지금 실행할 수 없는 입력을 아주 짧게 기억해 가능한 시점에 실행하는 기능입니다. 취소는 진행 중 행동을 중단하는 규칙으로, 자원·쿨다운·무적과 함께 설계해야 합니다. 1. 수신: 버튼을 누른 시간과 행동을 기록합니다. 2. 유효성: 짧은 유효 기간과 현재 상태를 확인합니다. 3. 실행·폐기: 가능하면 한 번 실행하고, 지나갔거나 취소됐으면 버립니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#f1f6f7" stroke="#f1f6f7" stroke-width="0"/><text x="28" y="34" fill="#203447" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  입력 버퍼</tspan></text><text x="871" y="33" fill="#526776" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="380" height="84" rx="7" fill="#156f7522" stroke="#156f75" stroke-width="2"/><text x="247.0" y="161" fill="#156f75" font-size="23" font-weight="700" text-anchor="middle"><tspan x="247.0" dy="0">예고</tspan></text><rect x="451" y="110" width="95" height="84" rx="7" fill="#7555b722" stroke="#7555b7" stroke-width="2"/><text x="498.5" y="161" fill="#7555b7" font-size="23" font-weight="700" text-anchor="middle"><tspan x="498.5" dy="0">타격</tspan></text><rect x="560" y="110" width="300" height="84" rx="7" fill="#c5712122" stroke="#c57121" stroke-width="2"/><text x="710.0" y="161" fill="#c57121" font-size="23" font-weight="700" text-anchor="middle"><tspan x="710.0" dy="0">회복</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#203447" stroke-width="3"/><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#203447" stroke="#203447" stroke-width="2"/><text x="57" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#203447" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="252" y="97" fill="#156f75" font-size="19" font-weight="500" text-anchor="middle"><tspan x="252" dy="0">0.60초</tspan></text><text x="498" y="97" fill="#7555b7" font-size="19" font-weight="500" text-anchor="middle"><tspan x="498" dy="0">0.15초</tspan></text><text x="708" y="97" fill="#c57121" font-size="19" font-weight="500" text-anchor="middle"><tspan x="708" dy="0">0.45초</tspan></text><text x="435" y="315" fill="#526776" font-size="18" font-weight="500" text-anchor="middle"><tspan x="435" dy="0">예시 시간 · 실제 재미는 플레이하며 조정</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="47" y="385" fill="#156f75" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  수신</tspan></text><text x="47" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">버튼을 누른 시간과 행동을</tspan><tspan x="47" dy="26.099999999999998">기록합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="341" y="385" fill="#7555b7" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  유효성</tspan></text><text x="341" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">짧은 유효 기간과 현재 상태</tspan><tspan x="341" dy="26.099999999999998">를 확인합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="white" stroke="#ccdde1" stroke-width="2"/><text x="635" y="385" fill="#c57121" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  실행·폐기</tspan></text><text x="635" y="420" fill="#203447" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">가능하면 한 번 실행하고,</tspan><tspan x="635" dy="26.099999999999998">지나갔거나 취소됐으면 버립</tspan><tspan x="635" dy="26.099999999999998">니다.</tspan></text></g></svg>