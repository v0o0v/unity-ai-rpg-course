<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="내 이야기 하나를 도구로 제작해 제품에 넣기 — 구조와 확인 지점"><title>내 이야기 하나를 도구로 제작해 제품에 넣기 — 구조와 확인 지점</title><desc>내 이야기 요구 → 두 해결 경로 초안 → 승인·게임 연결 → 플레이·검사·근거. 주의: 준비된 예제를 넘어 새 콘텐츠를 끝까지 완성</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="20" y="15" width="680" height="216" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="20" y="15" width="680" height="33" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="39" y="38" fill="var(--viz-muted,#5e7085)" font-size="17" font-weight="600" text-anchor="start">EDITOR · 도구의 구조 예시</text><rect x="35" y="62" width="135" height="148" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="102" y="89" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">대상 목록</text><rect x="50" y="105" width="105" height="18" rx="4" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="50" y="133" width="105" height="18" rx="4" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="50" y="161" width="105" height="18" rx="4" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="185" y="62" width="305" height="148" rx="6" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="203" y="88" width="103" height="48" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="254.5" y="120.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">현재 원본</text><rect x="353" y="88" width="113" height="48" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="409.5" y="120.0" fill="var(--viz-good,#20785e)" font-size="20" font-weight="600" text-anchor="middle">AI 후보</text><line x1="310" y1="113" x2="349" y2="113" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="349,113 339.0,108.0 339.0,118.0" fill="var(--viz-accent,#6651c8)"/><text x="337" y="185" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">차이·참조·오류 확인</text><rect x="505" y="62" width="178" height="148" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="594" y="88" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">요청과 상태</text><rect x="520" y="105" width="145" height="38" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="592.5" y="132.0" fill="var(--viz-warn,#a95815)" font-size="20" font-weight="600" text-anchor="middle">검토 대기</text><rect x="520" y="157" width="145" height="38" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="592.5" y="184.0" fill="var(--viz-good,#20785e)" font-size="20" font-weight="600" text-anchor="middle">승인 후 적용</text><g class="viz-risk-overlay"><line x1="328" y1="104" x2="346" y2="122" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="346" y1="104" x2="328" y2="122" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><text x="337" y="159" fill="var(--viz-bad,#b34251)" font-size="17" font-weight="600" text-anchor="middle">오래된 후보는 거부</text></g></g></svg>