<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="시작 메뉴와 테스트 공간 연결하기 — 구조와 확인 지점"><title>시작 메뉴와 테스트 공간 연결하기 — 구조와 확인 지점</title><desc>Boot → 시작 메뉴 → 테스트 공간 → 메뉴로 복귀. 주의: 초기화 서비스와 플레이어가 중복되지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="20" y="51" width="185" height="142" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="20" y="51" width="185" height="26" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="113" y="126" fill="var(--viz-ink,#213147)" font-size="21" font-weight="600" text-anchor="middle">시작 화면</text><rect x="45" y="149" width="135" height="22" rx="5" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-soft,#e9e4fd)" stroke-width="2" /><line x1="210" y1="120" x2="260" y2="120" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="260,120 250.0,115.0 250.0,125.0" fill="var(--viz-accent,#6651c8)"/><rect x="265" y="51" width="185" height="142" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="265" y="51" width="185" height="26" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="358" y="126" fill="var(--viz-ink,#213147)" font-size="21" font-weight="600" text-anchor="middle">현재 플레이</text><rect x="290" y="149" width="135" height="22" rx="5" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-soft,#e9e4fd)" stroke-width="2" /><line x1="455" y1="120" x2="505" y2="120" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="505,120 495.0,115.0 495.0,125.0" fill="var(--viz-accent,#6651c8)"/><rect x="510" y="51" width="185" height="142" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="510" y="51" width="185" height="26" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="603" y="126" fill="var(--viz-ink,#213147)" font-size="21" font-weight="600" text-anchor="middle">다음 상태</text><rect x="535" y="149" width="135" height="22" rx="5" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-soft,#e9e4fd)" stroke-width="2" /><text x="360" y="232" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="middle">각 단계는 실제 결과를 확인한 뒤 이어갑니다.</text><g class="viz-risk-overlay"><line x1="232" y1="112" x2="250" y2="130" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="250" y1="112" x2="232" y2="130" stroke="var(--viz-bad,#b34251)" stroke-width="4" /></g></g></svg>