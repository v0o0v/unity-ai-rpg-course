<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="같은 상황을 반복해 성능 기준선 만들기 — 구조와 확인 지점"><title>같은 상황을 반복해 성능 기준선 만들기 — 구조와 확인 지점</title><desc>같은 장면·기기 → 반복 경로 → 프레임 분포 → 기준선 보존. 주의: 미측정 값을 0으로 채우지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><text x="31" y="32" fill="var(--viz-ink,#213147)" font-size="21" font-weight="600" text-anchor="start">프레임의 시간을 나눠 원인 찾기</text><text x="32" y="83" fill="var(--viz-muted,#5e7085)" font-size="20" font-weight="600" text-anchor="start">로직</text><rect x="130" y="57" width="395" height="34" rx="4" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="131" y="58" width="178" height="32" rx="3" fill="var(--viz-accent,#6651c8)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="32" y="135" fill="var(--viz-muted,#5e7085)" font-size="20" font-weight="600" text-anchor="start">렌더링</text><rect x="130" y="109" width="395" height="34" rx="4" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="131" y="110" width="300" height="32" rx="3" fill="var(--viz-warn,#a95815)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="32" y="187" fill="var(--viz-muted,#5e7085)" font-size="20" font-weight="600" text-anchor="start">대기</text><rect x="130" y="161" width="395" height="34" rx="4" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="131" y="162" width="110" height="32" rx="3" fill="var(--viz-good,#20785e)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><rect x="552" y="62" width="141" height="54" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="622.5" y="97.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">같은 조건</text><rect x="552" y="146" width="141" height="54" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="622.5" y="181.0" fill="var(--viz-good,#20785e)" font-size="20" font-weight="600" text-anchor="middle">다시 측정</text><line x1="622" y1="118" x2="622" y2="143" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="622,143 627.0,133.0 617.0,133.0" fill="var(--viz-accent,#6651c8)"/><text x="31" y="239" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="start">막대 길이는 설명용입니다. 실제 측정값이 아닙니다.</text><g class="viz-risk-overlay"><text x="342" y="142" fill="var(--viz-ink,#213147)" font-size="18" font-weight="600" text-anchor="start">← 이 구간의 원인부터</text></g></g></svg>