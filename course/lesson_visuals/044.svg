<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="시드로 같은 던전 다시 만들기 — 구조와 확인 지점"><title>시드로 같은 던전 다시 만들기 — 구조와 확인 지점</title><desc>시드·생성 버전 → 방 배치 난수 → 전리품 난수 → 장식 난수. 주의: 장식 변경이 방과 보상을 다시 뽑지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><line x1="148" y1="85" x2="243" y2="58" stroke="var(--viz-accent,#6651c8)" stroke-width="12" /><line x1="305" y1="91" x2="305" y2="151" stroke="var(--viz-accent,#6651c8)" stroke-width="12" /><line x1="370" y1="187" x2="453" y2="187" stroke="var(--viz-accent,#6651c8)" stroke-width="12" /><line x1="453" y1="187" x2="453" y2="118" stroke="var(--viz-accent,#6651c8)" stroke-width="12" /><line x1="453" y1="118" x2="519" y2="118" stroke="var(--viz-accent,#6651c8)" stroke-width="12" /><rect x="25" y="47" width="124" height="76" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="87.0" y="93.0" fill="var(--viz-good,#20785e)" font-size="22" font-weight="600" text-anchor="middle">입구</text><rect x="243" y="22" width="127" height="70" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="306.5" y="65.0" fill="var(--viz-accent,#6651c8)" font-size="22" font-weight="600" text-anchor="middle">연결 구역</text><rect x="245" y="151" width="125" height="70" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="307.5" y="194.0" fill="var(--viz-accent,#6651c8)" font-size="22" font-weight="600" text-anchor="middle">분기 구역</text><rect x="519" y="58" width="175" height="119" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="606.5" y="125.5" fill="var(--viz-warn,#a95815)" font-size="22" font-weight="600" text-anchor="middle">목표 위치</text><g class="viz-risk-overlay"><line x1="296" y1="111" x2="314" y2="129" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="314" y1="111" x2="296" y2="129" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><text x="386" y="29" fill="var(--viz-bad,#b34251)" font-size="19" font-weight="600" text-anchor="start">끊기면 도달 불가</text></g></g></svg>