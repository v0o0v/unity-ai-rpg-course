<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Meshy 텍스트로 소품을 만들고 게임에 넣기 — 구조와 확인 지점"><title>Meshy 텍스트로 소품을 만들고 게임에 넣기 — 구조와 확인 지점</title><desc>텍스트 요구 → 형태 preview → 표면 정리·수신 → 게임 프리팹 연결. 주의: 검 모델 길이가 실제 공격 범위를 바꾸지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><polygon points="50,89 142,43 213,83 121,131" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-accent,#6651c8)" stroke-width="3"/><polygon points="50,89 121,131 121,200 50,157" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="3"/><polygon points="121,131 213,83 213,152 121,200" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-accent,#6651c8)" stroke-width="3"/><text x="131" y="235" fill="var(--viz-muted,#5e7085)" font-size="21" font-weight="600" text-anchor="middle">모양·치수</text><polygon points="280,89 372,43 443,83 351,131" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-good,#20785e)" stroke-width="3"/><polygon points="280,89 351,131 351,200 280,157" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="3"/><polygon points="351,131 443,83 443,152 351,200" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-good,#20785e)" stroke-width="3"/><text x="361" y="235" fill="var(--viz-muted,#5e7085)" font-size="21" font-weight="600" text-anchor="middle">참조·재질</text><polygon points="510,89 602,43 673,83 581,131" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-warn,#a95815)" stroke-width="3"/><polygon points="510,89 581,131 581,200 510,157" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-warn,#a95815)" stroke-width="3"/><polygon points="581,131 673,83 673,152 581,200" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-warn,#a95815)" stroke-widt