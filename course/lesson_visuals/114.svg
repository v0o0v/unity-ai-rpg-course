<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="테스트를 실행하고 결과 읽기 — 구조와 확인 지점"><title>테스트를 실행하고 결과 읽기 — 구조와 확인 지점</title><desc>등록된 검사 실행 → 프로세스 종료 → 결과 파일 해석 → 실행 수·오류 확인. 주의: 빈 검사와 모순된 성공·실패 요약 거부</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="22" y="36" width="192" height="64" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="118.0" y="76.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">현재 소스</text><rect x="264" y="36" width="192" height="64" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="360.0" y="76.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">실제 검사</text><rect x="505" y="36" width="192" height="64" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="601.0" y="76.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">현재 결과</text><line x1="217" y1="68" x2="260" y2="68" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="260,68 250.0,63.0 250.0,73.0" fill="var(--viz-accent,#6651c8)"/><line x1="458" y1="68" x2="501" y2="68" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="501,68 491.0,63.0 491.0,73.0" fill="var(--viz-accent,#6651c8)"/><rect x="264" y="138" width="192" height="62" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="360" y="178" fill="var(--viz-ink,#213147)" font-size="21" font-weight="600" text-anchor="middle">근거·승인 확인</text><line x1="360" y1="102" x2="360" y2="135" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="360,135 365.0,125.0 355.0,125.0" fill="var(--viz-accent,#6651c8)"/><text x="360" y="234" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="middle">완료라는 답변과 실제 변경·검증은 구분합니다.</text><g class="viz-risk-overlay"><line x1="471" y1="60" x2="489" y2="78" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="489" y1="60" x2="471" y2="78" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><text x="587" y="133" fill="var(--viz-bad,#b34251)" font-size="17" font-weight="600" text-anchor="middle">조건이 다르면 멈춤</text></g></g></svg>