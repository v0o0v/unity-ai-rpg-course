<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="게임 규칙은 재사용하고 공간만 바꾸기 — 구조와 확인 지점"><title>게임 규칙은 재사용하고 공간만 바꾸기 — 구조와 확인 지점</title><desc>공통 규칙 → 2D의 XY → 논리 위치 → 3D의 XZ. 주의: 공간만 바꾸고 ID·피해 규칙은 유지</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><line x1="60" y1="180" x2="259" y2="180" stroke="var(--viz-muted,#5e7085)" stroke-width="3" /><polygon points="259,180 249.0,175.0 249.0,185.0" fill="var(--viz-muted,#5e7085)"/><line x1="60" y1="180" x2="60" y2="28" stroke="var(--viz-muted,#5e7085)" stroke-width="3" /><polygon points="60,28 55.0,38.0 65.0,38.0" fill="var(--viz-muted,#5e7085)"/><text x="264" y="187" fill="var(--viz-ink,#213147)" font-size="20" font-weight="600" text-anchor="start">X</text><text x="55" y="23" fill="var(--viz-ink,#213147)" font-size="20" font-weight="600" text-anchor="start">Y</text><circle cx="165" cy="100" r="13" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><text x="187" y="99" fill="var(--viz-accent,#6651c8)" font-size="19" font-weight="600" text-anchor="start">(u, v)</text><line x1="435" y1="180" x2="634" y2="180" stroke="var(--viz-muted,#5e7085)" stroke-width="3" /><polygon points="634,180 624.0,175.0 624.0,185.0" fill="var(--viz-muted,#5e7085)"/><line x1="435" y1="180" x2="435" y2="28" stroke="var(--viz-muted,#5e7085)" stroke-width="3" /><polygon points="435,28 430.0,38.0 440.0,38.0" fill="var(--viz-muted,#5e7085)"/><text x="639" y="187" fill="var(--viz-ink,#213147)" font-size="20" font-weight="600" text-anchor="start">X</text><text x="430" y="23" fill="var(--viz-ink,#213147)" font-size="20" font-weight="600" text-anchor="start">Z</text><circle cx="540" cy="100" r="13" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><text x="562" y="99" fill="var(--viz-accent,#6651c8)" font-size="19" font-weight="600" text-anchor="start">(u, v)</text><line x1="299" y1="111" x2="397" y2="111" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="397,111 387.0,106.0 387.0,116.0" fill="var(--viz-good,#20785e)"/><text x="140" y="230" fill="var(--viz-muted,#5e7085)" font-size="22" font-weight="600" text-anchor="middle">2D의 XY</text><text x="530" y="230" fill="var(--viz-muted,#5e7085)" font-size="22" font-weight="600" text-anchor="middle">3D의 XZ</text></g></svg>