<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="피격 불꽃과 먼지 만들기 — 구조와 확인 지점"><title>피격 불꽃과 먼지 만들기 — 구조와 확인 지점</title><desc>피격 사건 → 입자 생성 → 시간에 따른 변화 → 끝나면 회수. 주의: 효과 자체가 피해나 보상을 추가하지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><circle cx="127" cy="129" r="79" fill="none" stroke="var(--viz-line,#cbd6e5)" stroke-width="3" /><circle cx="127" cy="129" r="52" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><circle cx="127" cy="129" r="23" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><text x="127" y="238" fill="var(--viz-muted,#5e7085)" font-size="21" font-weight="600" text-anchor="middle">표현과 판정</text><rect x="276" y="41" width="180" height="60" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="366.0" y="79.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">게임 사건</text><rect x="276" y="141" width="180" height="60" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="366.0" y="179.0" fill="var(--viz-good,#20785e)" font-size="20" font-weight="600" text-anchor="middle">효과의 수명</text><line x1="224" y1="130" x2="274" y2="77" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="274,77 263.5,80.8 270.8,87.7" fill="var(--viz-accent,#6651c8)"/><line x1="366" y1="104" x2="366" y2="137" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="366,137 371.0,127.0 361.0,127.0" fill="var(--viz-good,#20785e)"/><rect x="519" y="86" width="177" height="72" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="607.5" y="130.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">종료·회수</text><line x1="460" y1="169" x2="515" y2="129" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="515,129 504.0,130.8 509.9,138.9" fill="var(--viz-good,#20785e)"/><g class="viz-risk-overlay"><circle cx="128" cy="129" r="99" fill="none" stroke="var(--viz-bad,#b34251)" stroke-width="3" /><text x="519" y="223" fill="var(--viz-bad,#b34251)" font-size="17" font-weight="600" text-anchor="start">시각 범위 ≠ 자동 피해</text></g></g></svg>