<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="화상·냉기·표식으로 전투 확장하기 — 구조와 확인 지점"><title>화상·냉기·표식으로 전투 확장하기 — 구조와 확인 지점</title><desc>화상 시간 → 냉기 속도 → 표식 소비 → 종료·사망 정리. 주의: 지속 피해가 직접 공격용 효과를 연쇄 발동하지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="23" y="84" width="190" height="68" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="118" y="126" fill="var(--viz-warn,#a95815)" font-size="21" font-weight="600" text-anchor="middle">준비·예고</text><circle cx="118" cy="51" r="13" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-warn,#a95815)" stroke-width="3" /><line x1="217" y1="118" x2="259" y2="118" stroke="var(--viz-warn,#a95815)" stroke-width="3" /><polygon points="259,118 249.0,113.0 249.0,123.0" fill="var(--viz-warn,#a95815)"/><rect x="265" y="84" width="190" height="68" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bad,#b34251)" stroke-width="2" /><text x="360" y="126" fill="var(--viz-bad,#b34251)" font-size="21" font-weight="600" text-anchor="middle">타격·판정</text><circle cx="360" cy="51" r="13" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-bad,#b34251)" stroke-width="3" /><line x1="459" y1="118" x2="501" y2="118" stroke="var(--viz-bad,#b34251)" stroke-width="3" /><polygon points="501,118 491.0,113.0 491.0,123.0" fill="var(--viz-bad,#b34251)"/><rect x="507" y="84" width="190" height="68" rx="10" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="602" y="126" fill="var(--viz-good,#20785e)" font-size="21" font-weight="600" text-anchor="middle">회복·다음 행동</text><circle cx="602" cy="51" r="13" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="3" /><line x1="43" y1="181" x2="676" y2="181" stroke="var(--viz-muted,#5e7085)" stroke-width="3" /><text x="43" y="209" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="start">시간 →</text><text x="677" y="209" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="end">표시와 실제 판정 연결</text><g class="viz-risk-overlay"><line x1="351" y1="42" x2="369" y2="60" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="369" y1="42" x2="351" y2="60" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><text x="360" y="26" fill="var(--viz-bad,#b34251)" font-size="18" font-weight="600" text-anchor="middle">두 번 타격하면 오류</text></g></g></svg>