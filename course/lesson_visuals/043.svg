<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="빌드를 바꾸며 전투 비교하기 — 구조와 확인 지점"><title>빌드를 바꾸며 전투 비교하기 — 구조와 확인 지점</title><desc>구성 A → 같은 전투 → 마을 초기화 → 구성 B 비교. 주의: 초기화로 체력·마나·대기시간을 회복하지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="20" y="88" width="124" height="62" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="82.0" y="127.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">기본 노드</text><rect x="181" y="88" width="124" height="62" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="243.0" y="127.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">선행 조건</text><rect x="350" y="24" width="135" height="62" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="417.5" y="63.0" fill="var(--viz-good,#20785e)" font-size="20" font-weight="600" text-anchor="middle">선택 A</text><rect x="350" y="150" width="135" height="62" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="417.5" y="189.0" fill="var(--viz-warn,#a95815)" font-size="20" font-weight="600" text-anchor="middle">선택 B</text><rect x="559" y="88" width="140" height="62" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="629.0" y="127.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">활성 효과</text><line x1="144" y1="119" x2="179" y2="119" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="179,119 169.0,114.0 169.0,124.0" fill="var(--viz-accent,#6651c8)"/><line x1="305" y1="114" x2="347" y2="56" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="347,56 337.1,61.2 345.2,67.0" fill="var(--viz-good,#20785e)"/><line x1="305" y1="127" x2="347" y2="177" stroke="var(--viz-warn,#a95815)" stroke-width="3" /><polygon points="347,177 344.4,166.1 336.7,172.6" fill="var(--viz-warn,#a95815)"/><line x1="485" y1="55" x2="557" y2="115" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="557,115 552.5,104.8 546.1,112.4" fill="var(--viz-good,#20785e)"/><line x1="485" y1="180" x2="557" y2="128" stroke="var(--viz-warn,#a95815)" stroke-width="3" /><polygon points="557,128 546.0,129.8 551.8,137.9" fill="var(--viz-warn,#a95815)"/><g class="viz-risk-overlay"><line x1="485" y1="54" x2="536" y2="89" stroke="var(--viz-bad,#b34251)" stroke-width="4" stroke-dasharray="7 5"/><line x1="514" y1="67" x2="532" y2="85" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="532" y1="67" x2="514" y2="85" stroke="var(--viz-bad,#b34251)" stroke-width="4" /></g><text x="20" y="241" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="start">선의 배치보다 조건·참조·끝에 도달하는지가 중요합니다.</text></g></svg>