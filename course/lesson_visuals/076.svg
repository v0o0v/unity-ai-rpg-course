<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="연결이 끊겨도 게임 계속하기 — 구조와 확인 지점"><title>연결이 끊겨도 게임 계속하기 — 구조와 확인 지점</title><desc>요청 실행 → 취소·연결 단절 → 기본 자산 유지 → 복귀 뒤 새 요청. 주의: 옛 완료 콜백이 새 선택을 덮지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="20" y="42" width="187" height="144" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="113" y="80" fill="var(--viz-ink,#213147)" font-size="23" font-weight="600" text-anchor="middle">파일 전송</text><rect x="45" y="108" width="137" height="19" rx="5" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="46" y="109" width="135" height="17" rx="4" fill="var(--viz-good,#20785e)" stroke="var(--viz-good,#20785e)" stroke-width="2" /><text x="113" y="164" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">받은 파일</text><line x1="215" y1="113" x2="258" y2="113" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="258,113 248.0,108.0 248.0,118.0" fill="var(--viz-accent,#6651c8)"/><rect x="265" y="42" width="187" height="144" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="358" y="80" fill="var(--viz-ink,#213147)" font-size="23" font-weight="600" text-anchor="middle">자산 로드</text><rect x="290" y="108" width="137" height="19" rx="5" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="291" y="109" width="74" height="17" rx="4" fill="var(--viz-accent,#6651c8)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="358" y="164" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">객체 구성</text><line x1="460" y1="113" x2="503" y2="113" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="503,113 493.0,108.0 493.0,118.0" fill="var(--viz-accent,#6651c8)"/><rect x="510" y="42" width="187" height="144" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="603" y="80" fill="var(--viz-ink,#213147)" font-size="23" font-weight="600" text-anchor="middle">사용 준비</text><rect x="535" y="108" width="137" height="19" rx="5" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="536" y="109" width="16" height="17" rx="4" fill="var(--viz-warn,#a95815)" stroke="var(--viz-warn,#a95815)" stroke-width="2" /><text x="603" y="164" fill="var(--viz-muted,#5e7085)" font-size="18" font-weight="600" text-anchor="middle">입장 가능?</text><text x="360" y="229" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="middle">다운로드가 끝난 것과 화면에서 사용할 준비는 다릅니다.</text><g class="viz-risk-overlay"><line x1="477" y1="102" x2="495" y2="120" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="495" y1="102" x2="477" y2="120" stroke="var(--viz-bad,#b34251)" stroke-width="4" /></g></g></svg>