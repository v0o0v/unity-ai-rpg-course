<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="상점·거래·창고·도난품 경제 만들기 — 구조와 확인 지점"><title>상점·거래·창고·도난품 경제 만들기 — 구조와 확인 지점</title><desc>상점 재고·평판 → 가격 미리보기 → 거래 검증 → 가방·창고 이동. 주의: 재고가 바뀐 옛 견적을 그대로 확정하지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="28" y="30" width="216" height="164" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="136" y="62" fill="var(--viz-ink,#213147)" font-size="22" font-weight="600" text-anchor="middle">원래 위치</text><rect x="462" y="30" width="216" height="164" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><text x="570" y="62" fill="var(--viz-ink,#213147)" font-size="22" font-weight="600" text-anchor="middle">새 위치</text><rect x="56" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="110" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="164" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="488" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="542" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><rect x="596" y="90" width="46" height="70" rx="6" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><line x1="79" y1="99" x2="79" y2="145" stroke="var(--viz-accent,#6651c8)" stroke-width="5" /><line x1="65" y1="126" x2="92" y2="126" stroke="var(--viz-accent,#6651c8)" stroke-width="4" /><line x1="511" y1="99" x2="511" y2="145" stroke="var(--viz-accent,#6651c8)" stroke-width="5" /><line x1="497" y1="126" x2="524" y2="126" stroke="var(--viz-accent,#6651c8)" stroke-width="4" /><line x1="253" y1="103" x2="452" y2="103" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="452,103 442.0,98.0 442.0,108.0" fill="var(--viz-good,#20785e)"/><text x="354" y="83" fill="var(--viz-good,#20785e)" font-size="21" font-weight="600" text-anchor="middle">같은 ID</text><rect x="267" y="132" width="177" height="43" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="355.5" y="161.5" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">검증 후 반영</text><text x="354" y="225" fill="var(--viz-muted,#5e7085)" font-size="19" font-weight="600" text-anchor="middle">소유 데이터와 위치를 함께 확인합니다.</text><g class="viz-risk-overlay"><line x1="341" y1="95" x2="359" y2="113" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="359" y1="95" x2="341" y2="113" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><text x="353" y="126" fill="var(--viz-bad,#b34251)" font-size="16" font-weight="600" text-anchor="middle">중복·누락 금지</text></g></g></svg>