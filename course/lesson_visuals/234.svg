<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="자막·번역·색각·조작 설정 마무리하기 — 구조와 확인 지점"><title>자막·번역·색각·조작 설정 마무리하기 — 구조와 확인 지점</title><desc>자막 크기·언어 → 색각·음소거 → 키 재설정 → 저장 후 복원. 주의: 색이나 소리 한 종류에만 중요한 정보를 맡기지 않기</desc><style>.viz-risk-overlay{display:none}.show-risk .viz-risk-overlay{display:inline}</style><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="720" height="260" rx="14" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-bg,#f1f4fa)" stroke-width="2" /><rect x="22" y="31" width="676" height="183" rx="24" fill="var(--viz-bg,#f1f4fa)" stroke="var(--viz-line,#cbd6e5)" stroke-width="2" /><circle cx="122" cy="120" r="56" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><circle cx="122" cy="120" r="23" fill="var(--viz-soft,#e9e4fd)" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><rect x="264" y="79" width="192" height="78" rx="10" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-accent,#6651c8)" stroke-width="2" /><text x="360.0" y="126.0" fill="var(--viz-accent,#6651c8)" font-size="20" font-weight="600" text-anchor="middle">독립 상태</text><circle cx="551" cy="125" r="24" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="3" /><circle cx="614" cy="91" r="24" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="3" /><circle cx="614" cy="159" r="24" fill="var(--viz-paper,#ffffff)" stroke="var(--viz-good,#20785e)" stroke-width="3" /><line x1="184" y1="120" x2="258" y2="120" stroke="var(--viz-accent,#6651c8)" stroke-width="3" /><polygon points="258,120 248.0,115.0 248.0,125.0" fill="var(--viz-accent,#6651c8)"/><line x1="462" y1="120" x2="523" y2="120" stroke="var(--viz-good,#20785e)" stroke-width="3" /><polygon points="523,120 513.0,115.0 513.0,125.0" fill="var(--viz-good,#20785e)"/><text x="122" y="245" fill="var(--viz-muted,#5e7085)" font-size="20" font-weight="600" text-anchor="middle">이동 손가락</text><text x="592" y="245" fill="var(--viz-muted,#5e7085)" font-size="20" font-weight="600" text-anchor="middle">공격·카메라</text><g class="viz-risk-overlay"><line x1="481" y1="112" x2="499" y2="130" stroke="var(--viz-bad,#b34251)" stroke-width="4" /><line x1="499" y1="112" x2="481" y2="130" stroke="var(--viz-bad,#b34251)" stroke-width="4" /></g></g></svg>