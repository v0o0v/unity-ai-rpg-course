<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Grid·셀·격자 좌표 — 개념도</title><desc id="desc">격자는 공간을 일정한 칸으로 나눈 표현입니다. 셀 좌표는 몇 번째 칸인지, 월드 좌표는 실제 위치가 어디인지 나타냅니다. 셀 크기에 따라 둘의 변환이 달라집니다. 1. 셀 정의: 가로·세로 수와 칸 크기를 정합니다. 2. 논리 값: 바닥·벽·문 같은 상태를 칸에 기록합니다. 3. 공간 변환: 셀 중심과 실제 월드 위치를 일관되게 연결합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Grid</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="80" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="118" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="156" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="194" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="232" y="73" width="36" height="36" rx="3" fill="#88a2b8" stroke="#50687d" stroke-width="1" /><rect x="270" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="308" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="346" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="384" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="422" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="460" y="73" width="36" heig