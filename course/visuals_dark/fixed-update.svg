<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Update·FixedUpdate·LateUpdate — 개념도</title><desc id="desc">Update는 화면 프레임을 따라, FixedUpdate는 고정 시간 간격의 물리 갱신을 따라 호출됩니다. LateUpdate는 Update 이후의 후처리로 사용됩니다. 정확한 횟수는 프레임 상황과 설정에 따라 달라집니다. 1. 입력 읽기: 짧은 버튼 입력을 놓치지 않게 기록합니다. 2. 물리 이동: 기록한 요청을 물리 갱신에서 반영합니다. 3. 추적 화면: 이동 결과를 보고 카메라를 따라가게 합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Update</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="247" height="84" rx="7" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><text x="180.5" y="161" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="180.5" dy="0">입력 읽기</tspan></text><rect x="318" y="110" width="247" height="84" rx="7" fill="#c4a7f222" stroke="#c4a7f2" stroke-width="2" /><text x="441.5" y="161" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="441.5" dy="0">물리 이동</tspan></text><rect x="579" y="110" width="247" height="84" rx="7" fill="#f2bc7022" stroke="#f2bc70" stroke-width="2" /><text x="702.5" y="161" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="702.5" dy="0">추적 화면</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#e4ebf6" stroke-width="3" /><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><text x="57" y="275" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="450" y="314" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">이전 상태와 늦게 도착한 결과를 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  입력 읽기</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">짧은 버튼 입력을 놓치지 않</tspan><tspan x="47" dy="26.099999999999998">게 기록합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  물리 이동</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">기록한 요청을 물리 갱신에</tspan><tspan x="341" dy="26.099999999999998">서 반영합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  추적 화면</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">이동 결과를 보고 카메라를</tspan><tspan x="635" dy="26.099999999999998">따라가게 합니다.</tspan></text></g></svg>