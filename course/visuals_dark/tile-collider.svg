셀 좌표 ≠ 화면 픽셀</tspan></text><text x="541" y="270" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="start"><tspan x="541" dy="0">이동·장식을 분리</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  타일 변경</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">벽 칸을 배치하거나 제거합</tspan><tspan x="47" dy="26.099999999999998">니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  경계 갱신</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">설정에 따라 결합된 충돌 모</tspan><tspan x="341" dy="26.099999999999998">양을 다시 준비합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  이동 확인</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">모서리·좁은 문·경계 틈을</tspan><tspan x="635" dy="26.099999999999998">실제 몸체로 검사합니다.</tspan></text></g></svg>