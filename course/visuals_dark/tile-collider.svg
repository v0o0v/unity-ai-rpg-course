<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Tilemap Collider·Composite Collider — 개념도</title><desc id="desc">Tilemap Collider 2D는 타일의 충돌 모양을 만들고, Composite Collider 2D는 여러 모양을 결합하는 데 사용합니다. 타일 변경과 충돌 갱신 완료 시점도 고려해야 합니다. 1. 타일 변경: 벽 칸을 배치하거나 제거합니다. 2. 경계 갱신: 설정에 따라 결합된 충돌 모양을 다시 준비합니다. 3. 이동 확인: 모서리·좁은 문·경계 틈을 실제 몸체로 검사합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Tilemap Collider</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="80" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="118" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="156" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="194" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="232" y="73" width="36" height="36" rx="3" fill="#88a2b8" stroke="#50687d" stroke-width="1" /><rect x="270" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="308" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="346" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="384" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="422" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#5068