<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">2D 편집기·Aseprite·부위 분리 — 개념도</title><desc id="desc">2D 편집기는 프레임·레이어·팔레트·피벗을 정리하는 도구입니다. Aseprite·Pixelorama 같은 도구의 자동화·라이선스·지원 기능은 각각 확인해야 합니다. 여기서는 픽셀을 직접 찍는 대신 AI에게 편집 작업을 요청합니다. 1. 입력 보존: 원본 프레임을 따로 보관합니다. 2. 편집: 지원 명령·스크립트·승인된 자동화로 정리합니다. 3. 출력: 동일 셀·팔레트·프레임 순서와 메타데이터를 검사합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  2D 편집기</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><text x="195" y="99" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">2D 편집기</tspan></text><rect x="128" y="154" width="135" height="136" rx="8" fill="#18372f" stroke="#83d4cb" stroke-width="2" /><line x1="146" y1="177" x2="244" y2="177" stroke="#83d4cb" stroke-width="3" /><line x1="146" y1="201" x2="244" y2="201" stroke="#b2c3d9" stroke-width="3" /><line x1="146" y1="225" x2="244" y2="225" stroke="#b2c3d9" stroke-width="3" /><line x1="146" y1="249" x2="244" y2="249" stroke="#b2c3d9" stroke-width="3" /><line x1="345" y1="187" x2="409" y2="100" stroke="#83d4cb" stroke-width="3" /><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="414" height="70" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="7" height="70" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="629.0" y="100" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">입력 보존</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#c4a7f2" stroke-width="3" /><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="414" height="70" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="7" height="70" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="629.0" y="186" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">편집</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#f2bc70" stroke-width="3" /><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="414" height="70" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="7" height="70" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="629.0" y="272" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">출력</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  입력 보존</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">원본 프레임을 따로 보관합</tspan><tspan x="47" dy="26.099999999999998">니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  편집</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">지원 명령·스크립트·승인된</tspan><tspan x="341" dy="26.099999999999998">자동화로 정리합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  출력</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">동일 셀·팔레트·프레임 순서</tspan><tspan x="635" dy="26.099999999999998">와 메타데이터를 검사합니다</tspan><tspan x="635" dy="26.099999999999998">.</tspan></text></g></svg>