<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">게임 시간·실시간·일시정지 — 개념도</title><desc id="desc">게임 시간은 일시정지나 느린 연출에 따라 흐름을 조절할 수 있습니다. 실시간은 그와 별개로 흐르며 메뉴·다운로드·일부 UI에 필요합니다. 1. 대상 분류: 전투·UI·다운로드가 어떤 시간을 쓸지 정합니다. 2. 정지: 게임 동작만 멈출지 연출만 늦출지 선택합니다. 3. 복귀: 원래 속도·입력·오디오 상태를 복원합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  게임 시간</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="57" y="110" width="247" height="84" rx="7" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><text x="180.5" y="161" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="180.5" dy="0">대상 분류</tspan></text><rect x="318" y="110" width="247" height="84" rx="7" fill="#c4a7f222" stroke="#c4a7f2" stroke-width="2" /><text x="441.5" y="161" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="441.5" dy="0">정지</tspan></text><rect x="579" y="110" width="247" height="84" rx="7" fill="#f2bc7022" stroke="#f2bc70" stroke-width="2" /><text x="702.5" y="161" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="702.5" dy="0">복귀</tspan></text><line x1="57" y1="242" x2="843" y2="242" stroke="#e4ebf6" stroke-width="3" /><polygon points="843,242 834.1300507722071,246.61779175541483 834.1300507722071,237.38220824458517" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><text x="57" y="275" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="start"><tspan x="57" dy="0">시작</tspan></text><text x="842" y="275" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="end"><tspan x="842" dy="0">시간 →</tspan></text><text x="450" y="314" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">이전 상태와 늦게 도착한 결과를 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  대상 분류</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">전투·UI·다운로드가 어떤 시</tspan><tspan x="47" dy="26.099999999999998">간을 쓸지 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  정지</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">게임 동작만 멈출지 연출만</tspan><tspan x="341" dy="26.099999999999998">늦출지 선택합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  복귀</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">원래 속도·입력·오디오 상태</tspan><tspan x="635" dy="26.099999999999998">를 복원합니다.</tspan></text></g></svg>