<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">파서·XML·결과 판정 — 개념도</title><desc id="desc">파서는 텍스트나 파일의 구조를 읽어 데이터로 바꾸는 프로그램입니다. 테스트 판정기는 파싱한 결과의 실제 실행 수·식별자·실패·대상을 추가 검사해야 합니다. 1. 구조 읽기: JSON·XML 등 형식을 해석합니다. 2. 일관성 검사: 중복 ID·모순된 요약·빈 결과를 거부합니다. 3. 근거 연결: 현재 명령·소스·파일 해시와 연결합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  파서</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="39" y="86" width="7" height="200" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="165.5" y="120" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">구조 읽기</tspan></text><text x="165.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">JSON·XML 등 형식을 해석합니다.</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#83d4cb" stroke-width="3" /><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="326" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="326" y="86" width="7" height="200" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="452.5" y="120" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">일관성 검사</tspan></text><text x="452.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">중복 ID·모순된 요약·빈 결과를</tspan><tspan x="452.5" dy="26.099999999999998">거부합니다.</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#c4a7f2" stroke-width="3" /><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="613" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="613" y="86" width="7" height="200" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="739.5" y="120" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">근거 연결</tspan></text><text x="739.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">현재 명령·소스·파일 해시와 연결</tspan><tspan x="739.5" dy="26.099999999999998">합니다.</tspan></text><text x="450" y="329" fill="#b2c3d9" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  구조 읽기</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">JSON·XML 등 형식을 해석합</tspan><tspan x="47" dy="26.099999999999998">니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  일관성 검사</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">중복 ID·모순된 요약·빈 결</tspan><tspan x="341" dy="26.099999999999998">과를 거부합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  근거 연결</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">현재 명령·소스·파일 해시와</tspan><tspan x="635" dy="26.099999999999998">연결합니다.</tspan></text></g></svg>