<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">해시·SHA-256·체크섬 — 개념도</title><desc id="desc">해시는 입력 내용을 짧은 고정 길이 값으로 요약하는 계산입니다. SHA-256 같은 값은 파일이 달라졌는지 비교하는 데 사용합니다. 암호화나 작성자 인증과는 다릅니다. 1. 계산: 비교할 정확한 바이트와 경로 집합을 정합니다. 2. 기록: 소스·후보·결과 파일의 해시를 남깁니다. 3. 대조: 같은 입력·증거인지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  해시</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="91" width="7" height="190" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="125" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">소스 A</tspan></text><text x="166.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">f030ff5fd261</tspan></text><line x1="300" y1="187" x2="319" y2="187" stroke="#83d4cb" stroke-width="3" /><polygon points="319,187 310.13005077220714,191.61779175541483 310.13005077220714,182.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="327" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="91" width="7" height="190" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="125" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">소스 B</tspan></text><text x="453.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">b07a0bb9ee0c</tspan></text><line x1="587" y1="187" x2="606" y2="187" stroke="#83d4cb" stroke-width="3" /><polygon points="606,187 597.1300507722071,191.61779175541483 597.1300507722071,182.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="614" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="91" width="7" height="190" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="125" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">다시 소스 A</tspan></text><text x="740.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">f030ff5fd261</tspan></text><text x="450" y="327" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">SHA-256 앞 12자리 표시 · 내용이 다르면 값도 달라짐</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  계산</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">비교할 정확한 바이트와 경</tspan><tspan x="47" dy="26.099999999999998">로 집합을 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  기록</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">소스·후보·결과 파일의 해시</tspan><tspan x="341" dy="26.099999999999998">를 남깁니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  대조</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">같은 입력·증거인지 확인합</tspan><tspan x="635" dy="26.099999999999998">니다.</tspan></text></g></svg>