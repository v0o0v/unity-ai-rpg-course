<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">공격 ID·사건 ID·중복 피해 방지 — 개념도</title><desc id="desc">한 번의 공격이나 지급 사건을 식별하는 값입니다. 같은 공격에서 여러 Collider를 찾거나 여러 콜백이 와도 같은 대상에 중복 효과를 주지 않도록 돕습니다. 1. 공격 시작: 한 논리 공격의 ID를 정합니다. 2. 대상 묶기: Collider 대신 실제 ActorId 기준으로 봅니다. 3. 처리 기록: 이미 맞은 대상을 기록하고 수명 종료 때 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  공격 ID</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="71" y="94" fill="#e4ebf6" font-size="24" font-weight="700" text-anchor="start"><tspan x="71" dy="0">한도 안에서만 권한·자원 사용</tspan></text><circle cx="94" cy="177" r="29" fill="#83d4cb22" stroke="#83d4cb" stroke-width="3" /><text x="94" y="184" fill="#83d4cb" font-size="16" font-weight="700" text-anchor="middle"><tspan x="94" dy="0">사용</tspan></text><circle cx="191" cy="177" r="29" fill="#83d4cb22" stroke="#83d4cb" stroke-width="3" /><text x="191" y="184" fill="#83d4cb" font-size="16" font-weight="700" text-anchor="middle"><tspan x="191" dy="0">사용</tspan></text><circle cx="288" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="288" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="288" dy="0">대기</tspan></text><circle cx="385" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="385" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="385" dy="0">대기</tspan></text><circle cx="482" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="482" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="482" dy="0">대기</tspan></text><circle cx="579" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="579" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="579" dy="0">대기</tspan></text><circle cx="676" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="676" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="676" dy="0">대기</tspan></text><circle cx="773" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="773" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="773" dy="0">대기</tspan></text><text x="448" y="272" fill="#e4ebf6" font-size="23" font-weight="500" text-anchor="middle"><tspan x="448" dy="0">획득 → 작업 → 반환 / 정산</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  공격 시작</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">한 논리 공격의 ID를 정합니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  대상 묶기</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">Collider 대신 실제 ActorId</tspan><tspan x="341" dy="26.099999999999998">기준으로 봅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  처리 기록</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">이미 맞은 대상을 기록하고</tspan><tspan x="635" dy="26.099999999999998">수명 종료 때 정리합니다.</tspan></text></g></svg>