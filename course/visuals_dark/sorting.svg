<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Sorting Layer·Order·발 정렬 — 개념도</title><desc id="desc">2D에서 무엇을 앞에 그릴지 정하는 규칙입니다. 큰 범주의 Sorting Layer와 세부 순서, 카메라·투명 정렬 설정 등이 함께 작용합니다. 발 높이 기준은 이 게임의 탑다운 표현 규칙입니다. 1. 큰 층: 바닥·캐릭터·전경·UI를 구분합니다. 2. 기준점: 캐릭터와 나무의 발 위치를 일관되게 둡니다. 3. 동률 규칙: 같은 높이일 때 흔들리지 않는 순서를 정합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Sorting Layer</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="32" y="68" width="404" height="249" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><g transform="translate(239,187) scale(1.4)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#c4a7f2" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#c4a7f2" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><rect x="173" y="141" width="34" height="104" rx="3" fill="#987557" stroke="#987557" stroke-width="2" /><circle cx="190" cy="127" r="63" fill="#7dad87" stroke="#347b62" stroke-width="3" /><line x1="69" y1="247" x2="349" y2="247" stroke="#83d4cb" stroke-width="2" stroke-dasharray="7 6" /><text x="220" y="303" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="middle"><tspan x="220" dy="0">뒤쪽 발 → 먼저 그림</tspan></text><rect x="466" y="68" width="404" height="249" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="607" y="141" width="34" height="104" rx="3" fill="#987557" stroke="#987557" stroke-width="2" /><circle cx="624" cy="127" r="63" fill="#7dad87" stroke="#347b62" stroke-width="3" /><g transform="translate(665,265) scale(1.4)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#c4a7f2" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#c4a7f2" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><line x1="503" y1="247" x2="783" y2="247" stroke="#83d4cb" stroke-width="2" stroke-dasharray="7 6" /><text x="654" y="303" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="middle"><tspan x="654" dy="0">앞쪽 발 → 나중에 그림</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  큰 층</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">바닥·캐릭터·전경·UI를 구분</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  기준점</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">캐릭터와 나무의 발 위치를</tspan><tspan x="341" dy="26.099999999999998">일관되게 둡니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  동률 규칙</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">같은 높이일 때 흔들리지 않</tspan><tspan x="635" dy="26.099999999999998">는 순서를 정합니다.</tspan></text></g></svg>