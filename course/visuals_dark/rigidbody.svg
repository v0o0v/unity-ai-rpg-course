<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Rigidbody2D와 물리 몸체 — 개념도</title><desc id="desc">Rigidbody2D는 2D 물리 시스템이 객체를 어떻게 움직이고 접촉에 반응시킬지 관리하는 몸체입니다. Dynamic·Kinematic·Static은 물리적 행동 방식이 다른 설정입니다. 1. 종류 선택: 힘에 반응할지 직접 이동할지 정합니다. 2. 몸체 연결: Collider2D와 중력·회전 제약 등을 맞춥니다. 3. 이동 반영: 선택한 종류에 맞는 속도·이동 API를 사용합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Rigidbody2D와 물리 몸체</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="43" y="64" width="805" height="243" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="533" y="88" width="55" height="196" rx="3" fill="#66849a" stroke="#66849a" stroke-width="2" /><text x="560" y="79" fill="#e4ebf6" font-size="20" font-weight="500" text-anchor="middle"><tspan x="560" dy="0">벽</tspan></text><g transform="translate(245,261) scale(1.65)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-14.0" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="14.0" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-22.5" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-36.0" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-35.0" x2="53.0" y2="-71.5" stroke="#f2bc70" stroke-width="5" /></g><circle cx="245" cy="254" r="34" fill="none" stroke="#83d4cb" stroke-width="5" /><rect x="190" y="105" width="110" height="155" rx="12" fill="none" stroke="#c4a7f2" stroke-width="3" /><text x="86" y="92" fill="#e4ebf6" font-size="22" font-weight="700" text-anchor="start"><tspan x="86" dy="0">그림 ≠ 몸체 ≠ 공격</tspan></text><polygon points="275,220 424,157 431,261" fill="#f2bc7030" stroke="#f2bc70" stroke-width="3" /><text x="380" y="124" fill="#f2bc70" font-size="20" font-weight="500" text-anchor="middle"><tspan x="380" dy="0">공격 영역</tspan></text><text x="696" y="133" fill="#e4ebf6" font-size="22" font-weight="500" text-anchor="middle"><tspan x="696" dy="0">큰 그림이어도</tspan></text><text x="696" y="170" fill="#e4ebf6" font-size="22" font-weight="500" text-anchor="middle"><tspan x="696" dy="0">실제 경계는</tspan></text><text x="696" y="207" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="696" dy="0">따로 검사</tspan></text><text x="206" y="290" fill="#83d4cb" font-size="19" font-weight="500" text-anchor="start"><tspan x="206" dy="0">몸체</tspan></text><text x="120" y="141" fill="#c4a7f2" font-size="19" font-weight="500" text-anchor="start"><tspan x="120" dy="0">피격</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  종류 선택</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">힘에 반응할지 직접 이동할</tspan><tspan x="47" dy="26.099999999999998">지 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  몸체 연결</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">Collider2D와 중력·회전 제</tspan><tspan x="341" dy="26.099999999999998">약 등을 맞춥니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  이동 반영</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">선택한 종류에 맞는 속도·이</tspan><tspan x="635" dy="26.099999999999998">동 API를 사용합니다.</tspan></text></g></svg>