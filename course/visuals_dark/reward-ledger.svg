<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="보상 수령 장부의 요청 확인 → 한 번 확정 → 재요청 대응 흐름. 아래에 같은 내용을 자세히 설명합니다."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#adb6da" /></marker></defs><rect width="900" height="540" fill="#111d2b" rx="18" /><text x="35" y="37" font-family="sans-serif" font-size="12" fill="#a1b5d7" text-anchor="start">GRAY OATH / 294</text><text x="35" y="84" font-family="sans-serif" font-size="28" fill="#dce7f3" text-anchor="start">보상 수령 장부</text><rect x="35" y="145" width="260" height="262" rx="15" fill="#2c3b55" stroke="#536681" /><text x="57" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">01</text><text x="57" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">요청 확인</text><text x="57" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">quest instance와</text><text x="57" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">reward key를</text><text x="57" y="316" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">고정합니다.</text><path d="M301 269H317" stroke="#adb6da" stroke-width="2" marker-end="url(#arrow)" /><rect x="323" y="145" width="260" height="262" rx="15" fill="#24443b" stroke="#536681" /><text x="345" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">02</text><text x="345" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">한 번 확정</text><text x="345" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">재화·아이템·완료</text><text x="345" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">상태·영수증을 하나의 거래로</text><text x="345" y="316" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">커밋합니다.</text><path d="M589 269H605" stroke