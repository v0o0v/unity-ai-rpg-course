<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="역운동학과 발 접지의 목표 계산 → 보정 적용 → 실패 제한 흐름. 아래에 같은 내용을 자세히 설명합니다."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#adb6da" /></marker></defs><rect width="900" height="540" fill="#111d2b" rx="18" /><text x="35" y="37" font-family="sans-serif" font-size="12" fill="#a1b5d7" text-anchor="start">GRAY OATH / 274</text><text x="35" y="84" font-family="sans-serif" font-size="28" fill="#dce7f3" text-anchor="start">역운동학과 발 접지</text><rect x="35" y="145" width="260" height="262" rx="15" fill="#2c3b55" stroke="#536681" /><text x="57" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">01</text><text x="57" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">목표 계산</text><text x="57" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">지면/손잡이와 닿을</text><text x="57" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">위치·방향을 구합니다.</text><path d="M301 269H317" stroke="#adb6da" stroke-width="2" marker-end="url(#arrow)" /><rect x="323" y="145" width="260" height="262" rx="15" fill="#24443b" stroke="#536681" /><text x="345" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">02</text><text x="345" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">보정 적용</text><text x="345" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">관절 제한과 가중치로 기본</text><text x="345" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">동작을 보정합니다.</text><path d="M589 269H605" stroke="#adb6da" stroke-width="2" marker-end="url(#arrow)" /><rect x="611" y="145" width="260" height="262" rx="15" fill="#2c3b55" stroke="#536681" /><text x="633" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">03</text><text x="633" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">실패 제한</text><text x="633" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">목표가 멀거나 없어지면</text><text x="633" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">안전하게 보정을 줄입니다.</text><text x="36" y="463" font-family="sans-serif" font-size="19" fill="#dce7f3" text-anchor="start">실제 자산·상태·검사 결과를 연결해 확인합니다.</text><text x="35" y="516" font-family="sans-serif" font-size="12" fill="#a5b7ce" text-anchor="start">원리 설명용 그림 · 실제 Unity 화면/서비스 결과/성능 측정이 아닙니다.</text></svg>