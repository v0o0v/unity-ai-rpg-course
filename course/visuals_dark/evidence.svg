<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">증거·검사 상태·미실행 — 개념도</title><desc id="desc">증거는 어떤 대상에 어떤 검사를 실제 실행했는지 확인할 수 있는 자료입니다. PASS·FAIL·BLOCKED·NOT RUN은 성공·실패·조건 부족·미실행을 구분합니다. 1. 실제 실행: 대상·명령·결과·실행 수를 기록합니다. 2. 동일 대상: 현재 seal·기기·콘텐츠와 연결합니다. 3. 범위 구분: 자동 검사·화면·실제 터치·사람의 판단을 나눕니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  증거</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="91" width="7" height="190" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="125" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">실제 실행</tspan></text><text x="166.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">대상·명령·결과·실행 수를 기록합</tspan><tspan x="166.5" dy="26.099999999999998">니다.</tspan></text><line x1="300" y1="187" x2="319" y2="187" stroke="#83d4cb" stroke-width="3" /><polygon points="319,187 310.13005077220714,191.61779175541483 310.13005077220714,182.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="327" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="91" width="7" height="190" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="125" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">동일 대상</tspan></text><text x="453.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">현재 seal·기기·콘텐츠와 연결합</tspan><tspan x="453.5" dy="26.099999999999998">니다.</tspan></text><line x1="587" y1="187" x2="606" y2="187" stroke="#83d4cb" stroke-width="3" /><polygon points="606,187 597.1300507722071,191.61779175541483 597.1300507722071,182.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="614" y="91" width="253" height="190" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="91" width="7" height="190" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="125" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">범위 구분</tspan></text><text x="740.5" y="171" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">자동 검사·화면·실제 터치·사람의</tspan><tspan x="740.5" dy="26.099999999999998">판단을 나눕니다.</tspan></text><text x="450" y="327" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">현재 대상과 실제 결과를 연결해야 함</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  실제 실행</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">대상·명령·결과·실행 수를</tspan><tspan x="47" dy="26.099999999999998">기록합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  동일 대상</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">현재 seal·기기·콘텐츠와 연</tspan><tspan x="341" dy="26.099999999999998">결합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  범위 구분</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">자동 검사·화면·실제 터치·</tspan><tspan x="635" dy="26.099999999999998">사람의 판단을 나눕니다.</tspan></text></g></svg>