<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">스폰·디스폰·안전한 배치 — 개념도</title><desc id="desc">스폰은 게임 세계에 캐릭터·적·아이템을 생성하거나 활성화해 배치하는 일입니다. 안전한 스폰은 지면·충돌·다른 객체·접근 가능성까지 확인합니다. 1. 후보 선택: 방 역할에 맞는 위치를 찾습니다. 2. 안전 검사: 몸체·벽·문·다른 객체와의 여유를 확인합니다. 3. 활성화: 초기 상태와 식별자를 준비한 뒤 보여 줍니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  스폰</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="80" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="118" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="156" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="194" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="232" y="73" width="36" height="36" rx="3" fill="#88a2b8" stroke="#50687d" stroke-width="1" /><rect x="270" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="308" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="346" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="384" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="422" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="460" y="73" width="36" height="36" rx="3"