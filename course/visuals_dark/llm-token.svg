<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">AI 토큰·입출력·비용 — 개념도</title><desc id="desc">AI 토큰은 모델이 텍스트 등을 처리하는 단위입니다. 글자나 단어와 일대일로 같지 않으며 모델·언어에 따라 나뉘는 방식이 다릅니다. 입력·출력 사용량은 비용·한도와 관련됩니다. 1. 입력: 프롬프트·파일·도구 결과가 문맥에 들어갑니다. 2. 출력: 모델의 응답·변경안이 생성됩니다. 3. 기록: 실제 공급자의 사용량·가격 기준을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  AI 토큰</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><text x="71" y="94" fill="#e4ebf6" font-size="24" font-weight="700" text-anchor="start"><tspan x="71" dy="0">한도 안에서만 권한·자원 사용</tspan></text><circle cx="94" cy="177" r="29" fill="#83d4cb22" stroke="#83d4cb" stroke-width="3" /><text x="94" y="184" fill="#83d4cb" font-size="16" font-weight="700" text-anchor="middle"><tspan x="94" dy="0">사용</tspan></text><circle cx="191" cy="177" r="29" fill="#83d4cb22" stroke="#83d4cb" stroke-width="3" /><text x="191" y="184" fill="#83d4cb" font-size="16" font-weight="700" text-anchor="middle"><tspan x="191" dy="0">사용</tspan></text><circle cx="288" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="288" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="288" dy="0">대기</tspan></text><circle cx="385" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="385" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="385" dy="0">대기</tspan></text><circle cx="482" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="482" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="482" dy="0">대기</tspan></text><circle cx="579" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="579" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="579" dy="0">대기</tspan></text><circle cx="676" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="676" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="676" dy="0">대기</tspan></text><circle cx="773" cy="177" r="29" fill="#192838" stroke="#50687d" stroke-width="3" /><text x="773" y="184" fill="#b2c3d9" font-size="16" font-weight="700" text-anchor="middle"><tspan x="773" dy="0">대기</tspan></text><text x="448" y="272" fill="#e4ebf6" font-size="23" font-weight="500" text-anchor="middle"><tspan x="448" dy="0">획득 → 작업 → 반환 / 정산</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  입력</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">프롬프트·파일·도구 결과가</tspan><tspan x="47" dy="26.099999999999998">문맥에 들어갑니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  출력</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">모델의 응답·변경안이 생성</tspan><tspan x="341" dy="26.099999999999998">됩니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  기록</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 공급자의 사용량·가격</tspan><tspan x="635" dy="26.099999999999998">기준을 확인합니다.</tspan></text></g></svg>