<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="분해·제작 거래의 사전 검사 → 원자적 커밋 → 결과 복원 흐름. 아래에 같은 내용을 자세히 설명합니다."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#adb6da" /></marker></defs><rect width="900" height="540" fill="#111d2b" rx="18" /><text x="35" y="37" font-family="sans-serif" font-size="12" fill="#a1b5d7" text-anchor="start">GRAY OATH / 311</text><text x="35" y="84" font-family="sans-serif" font-size="28" fill="#dce7f3" text-anchor="start">분해·제작 거래</text><rect x="35" y="145" width="260" height="262" rx="15" fill="#2c3b55" stroke="#536681" /><text x="57" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">01</text><text x="57" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">사전 검사</text><text x="57" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">재료·가격·공간·잠금·레시피</text><text x="57" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">조건을 확인합니다.</text><path d="M301 269H317" stroke="#adb6da" stroke-width="2" marker-end="url(#arrow)" /><rect x="323" y="145" width="260" height="262" rx="15" fill="#24443b" stroke="#536681" /><text x="345" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">02</text><text x="345" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">원자적 커밋</text><text x="345" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">차감과 결과 인스턴스·영수증을</text><text x="345" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">한 번에 확정합니다.</text><path d="M589 269H605" stroke="#adb6da" stroke-width="2" marker-end="url(#arrow)" /><rect x="611" y="145" width="260" height="262" rx="15" fill="#2c3b55" stroke="#536681" /><text x="633" y="182" font-family="sans-serif" font-size="15" fill="#b3aceb" text-anchor="start">03</text><text x="633" y="220" font-family="sans-serif" font-size="22" fill="#dce7f3" text-anchor="start">결과 복원</text><text x="633" y="264" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">연타·앱 중단·저장 복원에서</text><text x="633" y="290" font-family="sans-serif" font-size="17" fill="#dce7f3" text-anchor="start">일관성을 확인합니다.</text><text x="36" y="463" font-family="sans-serif" font-size="19" fill="#dce7f3" text-anchor="start">실제 자산·상태·검사 결과를 연결해 확인합니다.</text><text x="35" y="516" font-family="sans-serif" font-size="12" fill="#a5b7ce" text-anchor="start">원리 설명용 그림 · 실제 Unity 화면/서비스 결과/성능 측정이 아닙니다.</text></svg>