<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">월드 좌표와 로컬 좌표 — 개념도</title><desc id="desc">월드 좌표는 장면 전체를 기준으로 한 위치이고, 로컬 좌표는 부모를 기준으로 한 위치입니다. 부모의 회전·크기도 월드 결과에 영향을 줍니다. 1. 부모 기준: 자식의 로컬 위치를 정합니다. 2. 변환: 부모의 위치·회전·크기를 함께 적용합니다. 3. 월드 결과: 실제 장면에서 보이는 위치를 얻습니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  월드 좌표와 로컬 좌표</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="45" y="65" width="355" height="242" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="130" y1="263" x2="335" y2="263" stroke="#83d4cb" stroke-width="3" /><polygon points="335,263 326.13005077220714,267.6177917554148 326.13005077220714,258.3822082445852" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="130" y1="263" x2="130" y2="95" stroke="#c4a7f2" stroke-width="3" /><polygon points="130,95 134.61779175541483,103.86994922779284 125.38220824458517,103.86994922779284" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><text x="342" y="266" fill="#83d4cb" font-size="20" font-weight="500" text-anchor="start"><tspan x="342" dy="0">X</tspan></text><text x="122" y="85" fill="#c4a7f2" font-size="20" font-weight="500" text-anchor="start"><tspan x="122" dy="0">Y</tspan></text><text x="220" y="295" fill="#e4ebf6" font-size="20" font-weight="700" text-anchor="middle"><tspan x="220" dy="0">2D · XY</tspan></text><g transform="translate(265,181) scale(0.64)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><circle cx="265" cy="181" r="5" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><line x1="265" y1="181" x2="265" y2="263" stroke="#b2c3d9" stroke-width="2" stroke-dasharray="7 6" /><text x="247" y="223" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="247" dy="0">(u, v)</tspan></text><rect x="490" y="65" width="355" height="242" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="575" y1="263" x2="780" y2="263" stroke="#83d4cb" stroke-width="3" /><polygon points="780,263 771.1300507722071,267.6177917554148 771.1300507722071,258.3822082445852" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="575" y1="263" x2="575" y2="95" stroke="#c4a7f2" stroke-width="3" /><polygon points="575,95 579.6177917554148,103.86994922779284 570.3822082445852,103.86994922779284" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><text x="787" y="266" fill="#83d4cb" font-size="20" font-weight="500" text-anchor="start"><tspan x="787" dy="0">X</tspan></text><text x="567" y="85" fill="#c4a7f2" font-size="20" font-weight="500" text-anchor="start"><tspan x="567" dy="0">Z</tspan></text><text x="665" y="295" fill="#e4ebf6" font-size="20" font-weight="700" text-anchor="middle"><tspan x="665" dy="0">3D · XZ</tspan></text><g transform="translate(710,181) scale(0.64)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><circle cx="710" cy="181" r="5" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><line x1="710" y1="181" x2="710" y2="263" stroke="#b2c3d9" stroke-width="2" stroke-dasharray="7 6" /><text x="692" y="223" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="692" dy="0">(u, 0, v)</tspan></text><line x1="420" y1="173" x2="475" y2="173" stroke="#83d4cb" stroke-width="3" /><polygon points="475,173 466.13005077220714,177.61779175541483 466.13005077220714,168.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  부모 기준</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">자식의 로컬 위치를 정합니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  변환</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">부모의 위치·회전·크기를 함</tspan><tspan x="341" dy="26.099999999999998">께 적용합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  월드 결과</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 장면에서 보이는 위치</tspan><tspan x="635" dy="26.099999999999998">를 얻습니다.</tspan></text></g></svg>