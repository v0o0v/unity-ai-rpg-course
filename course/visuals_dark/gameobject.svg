<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">GameObject — 개념도</title><desc id="desc">GameObject는 씬에 놓이는 기본 단위입니다. 이름·활성 상태와 Transform을 가지며, 실제 기능은 붙인 컴포넌트의 조합으로 결정됩니다. 1. 몸체 만들기: 씬에 객체를 둡니다. 2. 기능 붙이기: Renderer·Collider·게임 로직을 붙입니다. 3. 연결 확인: 필요한 자료와 다른 객체를 참조하게 합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  GameObject</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><text x="195" y="99" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">GameObject</tspan></text><g transform="translate(194,278) scale(1.45)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><line x1="345" y1="187" x2="409" y2="100" stroke="#83d4cb" stroke-width="3" /><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="414" height="70" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="7" height="70" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="629.0" y="100" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">몸체 만들기</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#c4a7f2" stroke-width="3" /><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="414" height="70" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="7" height="70" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="629.0" y="186" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">기능 붙이기</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#f2bc70" stroke-width="3" /><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="414" height="70" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="7" height="70" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="629.0" y="272" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">연결 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  몸체 만들기</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">씬에 객체를 둡니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  기능 붙이기</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">Renderer·Collider·게임 로</tspan><tspan x="341" dy="26.099999999999998">직을 붙입니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  연결 확인</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">필요한 자료와 다른 객체를</tspan><tspan x="635" dy="26.099999999999998">참조하게 합니다.</tspan></text></g></svg>