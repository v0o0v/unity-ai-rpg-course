<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">오브젝트 풀링 — 개념도</title><desc id="desc">풀링은 자주 만들고 버리는 객체를 미리 준비하거나 재사용하는 방식입니다. 사용이 끝나면 파괴 대신 풀로 반환하고 다음 사용 전에 상태를 초기화합니다. 1. 대여: 준비된 효과·탄환을 꺼냅니다. 2. 사용: 현재 사건의 상태와 참조를 설정합니다. 3. 반환: 수명·피해 목록·구독·색·핸들을 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  오브젝트 풀링</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="61" y="85" width="248" height="225" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="61" y="85" width="7" height="225" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="185.0" y="119" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="185.0" dy="0">보관 중</tspan></text><text x="185.0" y="165" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="185.0" dy="0">초기화된 재사용 대상</tspan></text><rect x="585" y="85" width="248" height="225" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="585" y="85" width="7" height="225" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="709.0" y="119" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="709.0" dy="0">사용 중</tspan></text><text x="709.0" y="165" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="709.0" dy="0">위치·수명·참조 관리</tspan></text><line x1="326" y1="145" x2="566" y2="145" stroke="#83d4cb" stroke-width="3" /><polygon points="566,145 557.1300507722071,149.61779175541483 557.1300507722071,140.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><text x="446" y="129" fill="#83d4cb" font-size="22" font-weight="500" text-anchor="middle"><tspan x="446" dy="0">꺼내기</tspan></text><line x1="570" y1="251" x2="326" y2="251" stroke="#c4a7f2" stroke-width="3" /><polygon points="326,251 334.86994922779286,246.38220824458517 334.86994922779286,255.61779175541483" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><text x="450" y="284" fill="#c4a7f2" font-size="21" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">정리 후 돌려놓기</tspan></text><circle cx="118" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><circle cx="185" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><circle cx="251" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><circle cx="644" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><circle cx="716" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><circle cx="782" cy="232" r="17" fill="#83d4cb22" stroke="#83d4cb" stroke-width="2" /><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  대여</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">준비된 효과·탄환을 꺼냅니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  사용</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">현재 사건의 상태와 참조를</tspan><tspan x="341" dy="26.099999999999998">설정합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  반환</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">수명·피해 목록·구독·색·핸</tspan><tspan x="635" dy="26.099999999999998">들을 정리합니다.</tspan></text></g></svg>