<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">QA·비평·독립 검토 — 개념도</title><desc id="desc">QA는 결함을 재현·검사하고, 비평·검토는 원래 요구와 실제 결과 사이의 문제를 평가합니다. 구현자가 자기 설명만 검토하는 것보다 입력과 권한을 분리하는 것이 중요합니다. 1. 요구 재독: 원래 목표와 제한을 읽습니다. 2. 실제 대조: 변경안·실행 근거·관찰한 화면을 봅니다. 3. 문제 보고: 본 범위와 미검증을 구분해 수정 요구를 남깁니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  QA</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="291" y="64" width="317" height="79" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="291" y="64" width="7" height="79" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="449.5" y="98" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="449.5" dy="0">사람의 요구·승인</tspan></text><line x1="450" y1="152" x2="166" y2="205" stroke="#83d4cb" stroke-width="3" /><polygon points="166,205 173.8722680160369,198.8333642653646 175.56655904151307,207.91220674150105" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="7" height="95" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="248" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">역할의 제안</tspan></text><line x1="450" y1="152" x2="453" y2="205" stroke="#c4a7f2" stroke-width="3" /><polygon points="453,205 447.8883179798451,196.40519302573784 457.10914160348415,195.88325961307902" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="7" height="95" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="248" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">실행기의 통제</tspan></text><line x1="450" y1="152" x2="740" y2="205" stroke="#f2bc70" stroke-width="3" /><polygon points="740,205 730.4443810256112,207.9479053608112 732.104762323169,198.86280014775895" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="7" height="95" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="248" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">실제 검사·관찰</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  요구 재독</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">원래 목표와 제한을 읽습니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  실제 대조</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">변경안·실행 근거·관찰한 화</tspan><tspan x="341" dy="26.099999999999998">면을 봅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  문제 보고</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">본 범위와 미검증을 구분해</tspan><tspan x="635" dy="26.099999999999998">수정 요구를 남깁니다.</tspan></text></g></svg>