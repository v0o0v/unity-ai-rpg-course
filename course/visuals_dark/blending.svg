<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">블렌딩·알파 혼합·가산 합성 — 개념도</title><desc id="desc">블렌딩은 새로 그리는 색을 이미 그려진 배경과 섞는 규칙입니다. 알파 혼합은 투명도를 사용하고, 가산 합성은 빛처럼 값을 더하는 표현에 자주 사용합니다. 1. 입력: 앞 그림의 색·알파와 배경색을 읽습니다. 2. 규칙: 일반 알파·가산 등 셰이더의 합성 방식을 정합니다. 3. 확인: 밝은 바닥·어두운 바닥·효과 겹침에서 가독성을 봅니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  블렌딩</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="84" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="103" y="84" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="167" y="84" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="231" y="84" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="39" y="133" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="103" y="133" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="167" y="133" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="231" y="133" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="39" y="182" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="103" y="182" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="167" y="182" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="231" y="182" width="64" height="49" rx="0" fill="#263e