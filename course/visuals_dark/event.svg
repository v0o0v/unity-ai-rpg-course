<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">이벤트·콜백·구독·이벤트 버스 — 개념도</title><desc id="desc">이벤트는 어떤 일이 일어났다는 알림입니다. 구독자는 관심 있는 알림을 받아 콜백을 실행합니다. 이벤트 버스는 여러 기능 사이의 알림 전달을 모으는 구조입니다. 1. 발행: 한 번 확정된 사건을 보냅니다. 2. 반응: UI·소리·퀘스트가 필요한 내용만 처리합니다. 3. 해제: 더 이상 필요 없는 구독을 제거합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  이벤트</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="80" width="253" height="234" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="80" width="7" height="234" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="114" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">발행</tspan></text><text x="166.5" y="160" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="166.5" dy="0">한 번 확정된 사건을 보냅니다.</tspan></text><circle cx="265" cy="98" r="17" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><text x="265" y="104" fill="#e4ebf6" font-size="15" font-weight="700" text-anchor="middle"><tspan x="265" dy="0">1</tspan></text><line x1="299" y1="197" x2="319" y2="197" stroke="#83d4cb" stroke-width="3" /><polygon points="319,197 310.13005077220714,201.61779175541483 310.13005077220714,192.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="327" y="80" width="253" height="234" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="80" width="7" height="234" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="114" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">반응</tspan></text><text x="453.5" y="160" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="453.5" dy="0">UI·소리·퀘스트가 필요한 내용만</tspan><tspan x="453.5" dy="26.099999999999998">처리합니다.</tspan></text><circle cx="552" cy="98" r="17" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><text x="552" y="104" fill="#e4ebf6" font-size="15" font-weight="700" text-anchor="middle"><tspan x="552" dy="0">2</tspan></text><line x1="586" y1="197" x2="606" y2="197" stroke="#c4a7f2" stroke-width="3" /><polygon points="606,197 597.1300507722071,201.61779175541483 597.1300507722071,192.38220824458517" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="614" y="80" width="253" height="234" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="80" width="7" height="234" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="114" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">해제</tspan></text><text x="740.5" y="160" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="740.5" dy="0">더 이상 필요 없는 구독을 제거합</tspan><tspan x="740.5" dy="26.099999999999998">니다.</tspan></text><circle cx="839" cy="98" r="17" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><text x="839" y="104" fill="#e4ebf6" font-size="15" font-weight="700" text-anchor="middle"><tspan x="839" dy="0">3</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  발행</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">한 번 확정된 사건을 보냅니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  반응</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">UI·소리·퀘스트가 필요한 내</tspan><tspan x="341" dy="26.099999999999998">용만 처리합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  해제</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">더 이상 필요 없는 구독을</tspan><tspan x="635" dy="26.099999999999998">제거합니다.</tspan></text></g></svg>