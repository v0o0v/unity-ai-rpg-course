<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Layer·LayerMask·Tag — 개념도</title><desc id="desc">Layer는 렌더링·물리 조회에서 대상을 분류하는 값이고 LayerMask는 어떤 레이어를 포함할지 고르는 필터입니다. Tag는 객체를 이름 있는 범주로 구분할 때 쓰며 역할이 다릅니다. 1. 분류: 플레이어·적·벽·UI 등의 실제 레이어를 정합니다. 2. 필터: 공격이나 시야 검사가 볼 대상을 지정합니다. 3. 반례: 자기 몸·장식·보상 물체를 잘못 맞히지 않는지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Layer</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="282" height="245" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><text x="195" y="99" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="195" dy="0">Layer</tspan></text><g transform="translate(194,278) scale(1.45)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><line x1="345" y1="187" x2="409" y2="100" stroke="#83d4cb" stroke-width="3" /><polygon points="409,100 407.4636874495186,109.88128249506275 400.02423074348934,104.40857871131706" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="414" height="70" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="422" y="66" width="7" height="70" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="629.0" y="100" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">분류</tspan></text><line x1="345" y1="187" x2="409" y2="186" stroke="#c4a7f2" stroke-width="3" /><polygon points="409,186 400.20327752151474,190.75580420502277 400.0589891414108,181.52134787836903" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="414" height="70" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="422" y="152" width="7" height="70" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="629.0" y="186" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">필터</tspan></text><line x1="345" y1="187" x2="409" y2="272" stroke="#f2bc70" stroke-width="3" /><polygon points="409,272 399.97568276794857,267.69167103214016 407.35372047069814,262.1364426441876" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="414" height="70" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="422" y="238" width="7" height="70" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="629.0" y="272" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="629.0" dy="0">반례</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  분류</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">플레이어·적·벽·UI 등의 실</tspan><tspan x="47" dy="26.099999999999998">제 레이어를 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  필터</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">공격이나 시야 검사가 볼 대</tspan><tspan x="341" dy="26.099999999999998">상을 지정합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  반례</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">자기 몸·장식·보상 물체를</tspan><tspan x="635" dy="26.099999999999998">잘못 맞히지 않는지 확인합</tspan><tspan x="635" dy="26.099999999999998">니다.</tspan></text></g></svg>