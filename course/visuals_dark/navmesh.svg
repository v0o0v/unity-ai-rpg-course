t><text x="541" y="270" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="start"><tspan x="541" dy="0">실제 모터와 연결</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  생성</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">사용할 지형·레이어·에이전</tspan><tspan x="47" dy="26.099999999999998">트 크기로 표면을 계산합니</tspan><tspan x="47" dy="26.099999999999998">다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  경로 요청</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">현재 위치와 목표의 도달 가</tspan><tspan x="341" dy="26.099999999999998">능 경로를 묻습니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  이동 연결</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">이 과정에서는 단일 모터에</tspan><tspan x="635" dy="26.099999999999998">경로를 전달합니다.</tspan></text></g></svg>