<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">NavMesh·Surface·Agent — 개념도</title><desc id="desc">NavMesh는 3D 공간에서 걸어갈 수 있는 표면을 길찾기용으로 표현한 자료입니다. Surface는 그 자료를 만들 범위를, Agent는 이동 주체의 크기와 경로 행동 등을 다룹니다. 1. 생성: 사용할 지형·레이어·에이전트 크기로 표면을 계산합니다. 2. 경로 요청: 현재 위치와 목표의 도달 가능 경로를 묻습니다. 3. 이동 연결: 이 과정에서는 단일 모터에 경로를 전달합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  NavMesh</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="80" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="118" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="156" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="194" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="232" y="73" width="36" height="36" rx="3" fill="#88a2b8" stroke="#50687d" stroke-width="1" /><rect x="270" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="308" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="346" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="384" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="422" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><