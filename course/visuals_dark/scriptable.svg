<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">ScriptableObject와 정의 데이터 — 개념도</title><desc id="desc">ScriptableObject는 여러 객체가 공유할 데이터 등을 에셋으로 관리할 수 있게 하는 Unity 방식입니다. 아이템 원형·스킬 정의처럼 바뀌지 않는 설계 자료에 유용합니다. 1. 정의: 이름·기본 공격력·아이콘 등 공통 정보를 저장합니다. 2. 참조: 실제 아이템은 정의 ID와 자기 상태를 연결합니다. 3. 분리: 플레이어 진행은 별도 저장 DTO로 보존합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  ScriptableObject와 정의 데이터</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="49" y="94" width="225" height="205" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="49" y="94" width="7" height="205" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="161.5" y="128" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="161.5" dy="0">종류 정의</tspan></text><text x="161.5" y="174" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="161.5" dy="0">철검</tspan><tspan x="161.5" dy="26.099999999999998">기본 공격력</tspan></text><line x1="286" y1="147" x2="399" y2="129" stroke="#c4a7f2" stroke-width="3" /><polygon points="399,129 390.96690547304456,134.9556185506628 389.51406723806184,125.8350229643822" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><line x1="286" y1="236" x2="399" y2="264" stroke="#f2bc70" stroke-width="3" /><polygon points="399,264 389.27977869233786,266.348892873264 391.50106557438824,257.3844136707035" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="417" y="76" width="410" height="100" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="417" y="76" width="7" height="100" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="622.0" y="110" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="622.0" dy="0">검 A · item-a</tspan></text><text x="622.0" y="156" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="622.0" dy="0">확정 옵션 +3</tspan></text><rect x="417" y="214" width="410" height="100" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="417" y="214" width="7" height="100" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="622.0" y="248" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="622.0" dy="0">검 B · item-b</tspan></text><text x="622.0" y="294" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="622.0" dy="0">확정 옵션 +5</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  정의</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">이름·기본 공격력·아이콘 등</tspan><tspan x="47" dy="26.099999999999998">공통 정보를 저장합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  참조</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">실제 아이템은 정의 ID와 자</tspan><tspan x="341" dy="26.099999999999998">기 상태를 연결합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  분리</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">플레이어 진행은 별도 저장</tspan><tspan x="635" dy="26.099999999999998">DTO로 보존합니다.</tspan></text></g></svg>