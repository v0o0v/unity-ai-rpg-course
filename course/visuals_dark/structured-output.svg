<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">구조화 응답·변경안 계약 — 개념도</title><desc id="desc">구조화 응답은 자유로운 설명 대신 정해진 필드와 타입으로 결과를 받는 방식입니다. 파일 경로·원본 해시·새 내용·작업 ID 등을 검증해 안전하게 후보로 다룰 수 있습니다. 1. 형식 검사: 필수 필드·타입·크기를 확인합니다. 2. 의미 검사: 작업 ID·경로·원본 해시가 맞는지 봅니다. 3. 독립 검토: 실제 변경과 완료 조건을 비교합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  구조화 응답</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="39" y="86" width="7" height="200" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="165.5" y="120" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">형식 검사</tspan></text><text x="165.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">필수 필드·타입·크기를 확인합니</tspan><tspan x="165.5" dy="26.099999999999998">다.</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#83d4cb" stroke-width="3" /><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="326" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="326" y="86" width="7" height="200" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="452.5" y="120" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">의미 검사</tspan></text><text x="452.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">작업 ID·경로·원본 해시가 맞는지</tspan><tspan x="452.5" dy="26.099999999999998">봅니다.</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#c4a7f2" stroke-width="3" /><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="613" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="613" y="86" width="7" height="200" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="739.5" y="120" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">독립 검토</tspan></text><text x="739.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">실제 변경과 완료 조건을 비교합</tspan><tspan x="739.5" dy="26.099999999999998">니다.</tspan></text><text x="450" y="329" fill="#b2c3d9" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  형식 검사</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">필수 필드·타입·크기를 확인</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  의미 검사</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">작업 ID·경로·원본 해시가</tspan><tspan x="341" dy="26.099999999999998">맞는지 봅니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  독립 검토</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실제 변경과 완료 조건을 비</tspan><tspan x="635" dy="26.099999999999998">교합니다.</tspan></text></g></svg>