<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">알파·RGBA·투명 배경 — 개념도</title><desc id="desc">RGBA는 빨강·초록·파랑의 색 채널과 투명도를 나타내는 알파 채널입니다. 흰 배경이나 체크무늬가 그려진 이미지가 실제 투명 이미지인 것은 아닙니다. 1. 채널 확인: 파일에 실제 알파가 있는지 봅니다. 2. 합성: 배경 위에 색과 알파를 섞어 표시합니다. 3. 가장자리 검사: 검정·흰색·색 있는 배경에서 테두리 잔상을 봅니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  알파</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="84" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="103" y="84" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="167" y="84" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="231" y="84" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="39" y="133" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="103" y="133" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="167" y="133" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="231" y="133" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="39" y="182" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="103" y="182" width="64" height="49" rx="0" fill="#263e47" stroke="none" stroke-width="0" /><rect x="167" y="182" width="64" height="49" rx="0" fill="#192838" stroke="none" stroke-width="0" /><rect x="231" y="182" width="64" height="49" rx="0" fill="#263e47" stro