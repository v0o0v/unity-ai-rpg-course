<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">포인터 ID·누름·해제·캡처 — 개념도</title><desc id="desc">포인터는 마우스나 터치 접점처럼 화면을 가리키는 입력입니다. ID는 동시에 들어오는 접점을 구분하고, 누름·이동·해제·취소는 한 입력의 단계입니다. 1. 시작: 포인터 ID와 시작 대상을 기록합니다. 2. 유지: 이동·캡처·버튼 밖 이동에도 같은 입력을 추적합니다. 3. 종료: 해제·취소·앱 중단에서 상태를 반드시 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  포인터 ID</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="139" y="73" width="622" height="230" rx="25" fill="#abc3d5" stroke="#abc3d5" stroke-width="2" /><rect x="156" y="87" width="588" height="201" rx="13" fill="#213b36" stroke="#a0c3c6" stroke-width="2" /><rect x="175" y="102" width="547" height="164" rx="7" fill="none" stroke="#adbfc9" stroke-width="2" /><circle cx="230" cy="221" r="39" fill="#27443e" stroke="#83d4cb" stroke-width="3" /><circle cx="220" cy="211" r="16" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><circle cx="639" cy="214" r="22" fill="#3a2e53" stroke="#c4a7f2" stroke-width="3" /><circle cx="691" cy="190" r="22" fill="#3a2e53" stroke="#c4a7f2" stroke-width="3" /><circle cx="612" cy="155" r="22" fill="#3a2e53" stroke="#c4a7f2" stroke-width="3" /><g transform="translate(448,222) scale(1.09)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><text x="202" y="122" fill="#e4ebf6" font-size="16" font-weight="500" text-anchor="start"><tspan x="202" dy="0">HP 100</tspan></text><text x="232" y="280" fill="#83d4cb" font-size="17" font-weight="500" text-anchor="middle"><tspan x="232" dy="0">입력 A</tspan></text><text x="648" y="280" fill="#c4a7f2" font-size="17" font-weight="500" text-anchor="middle"><tspan x="648" dy="0">입력 B</tspan></text><text x="450" y="331" fill="#e4ebf6" font-size="22" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">화면 배치 · 터치 ID · 안전영역을 구분</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  시작</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">포인터 ID와 시작 대상을 기</tspan><tspan x="47" dy="26.099999999999998">록합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  유지</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">이동·캡처·버튼 밖 이동에도</tspan><tspan x="341" dy="26.099999999999998">같은 입력을 추적합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  종료</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">해제·취소·앱 중단에서 상태</tspan><tspan x="635" dy="26.099999999999998">를 반드시 정리합니다.</tspan></text></g></svg>