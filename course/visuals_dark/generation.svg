" font-size="19" font-weight="500" text-anchor="start"><tspan x="541" dy="0">이동·장식을 분리</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  후보 생성</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">시드와 설정으로 방·통로를</tspan><tspan x="47" dy="26.099999999999998">만듭니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  유효성 검사</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">겹침·막힌 길·입구·보스 접</tspan><tspan x="341" dy="26.099999999999998">근을 확인합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  복구</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">제한된 재시도 후 실패하면</tspan><tspan x="635" dy="26.099999999999998">검증된 고정 지도로 돌아갑</tspan><tspan x="635" dy="26.099999999999998">니다.</tspan></text></g></svg>