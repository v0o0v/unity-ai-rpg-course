<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">절차적·무작위 지형 생성 — 개념도</title><desc id="desc">절차적 생성은 사람이 정한 규칙을 프로그램이 실행해 콘텐츠를 만드는 방식입니다. 무작위 값을 섞을 수 있지만 아무렇게나 배치한다는 뜻은 아닙니다. 1. 후보 생성: 시드와 설정으로 방·통로를 만듭니다. 2. 유효성 검사: 겹침·막힌 길·입구·보스 접근을 확인합니다. 3. 복구: 제한된 재시도 후 실패하면 검증된 고정 지도로 돌아갑니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  절차적</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="42" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="80" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="118" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="156" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="194" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="232" y="73" width="36" height="36" rx="3" fill="#88a2b8" stroke="#50687d" stroke-width="1" /><rect x="270" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="308" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="346" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="384" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="422" y="73" width="36" height="36" rx="3" fill="#192838" stroke="#50687d" stroke-width="1" /><rect x="460" y="73" width="36" height=