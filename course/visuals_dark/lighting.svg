<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">조명·Lit·Unlit·그림자 — 개념도</title><desc id="desc">조명은 표면이 밝고 어두워 보이는 원인을 계산하는 요소입니다. Lit 재질은 지정된 조명 경로의 영향을 받고 Unlit은 일반적으로 그 조명 계산 없이 표시됩니다. 1. 호환 확인: Renderer와 재질에 맞는 빛을 씁니다. 2. 역할 분리: 환경 분위기와 공격 예고의 가독성을 나눕니다. 3. 성능 검사: 빛·그림자 수와 대상 기기 비용을 측정합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  조명</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><circle cx="105" cy="99" r="35" fill="#efc76a" stroke="#f2bc70" stroke-width="3" /><polygon points="199,270 672,288 741,248 395,238" fill="#37455233" stroke="none" stroke-width="2" /><rect x="299" y="145" width="106" height="126" rx="10" fill="#609491" stroke="#83d4cb" stroke-width="2" /><line x1="149" y1="124" x2="285" y2="174" stroke="#f2bc70" stroke-width="3" /><polygon points="285,174 275.0814145962261,175.27344555755005 278.2682971739338,166.6051249461852" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><line x1="48" y1="276" x2="842" y2="276" stroke="#e4ebf6" stroke-width="3" /><text x="112" y="162" fill="#e4ebf6" font-size="21" font-weight="500" text-anchor="start"><tspan x="112" dy="0">빛</tspan></text><text x="350" y="313" fill="#e4ebf6" font-size="21" font-weight="500" text-anchor="middle"><tspan x="350" dy="0">물체</tspan></text><text x="620" y="313" fill="#e4ebf6" font-size="21" font-weight="500" text-anchor="middle"><tspan x="620" dy="0">그림자와 바닥</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  호환 확인</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">Renderer와 재질에 맞는 빛</tspan><tspan x="47" dy="26.099999999999998">을 씁니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  역할 분리</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">환경 분위기와 공격 예고의</tspan><tspan x="341" dy="26.099999999999998">가독성을 나눕니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  성능 검사</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">빛·그림자 수와 대상 기기</tspan><tspan x="635" dy="26.099999999999998">비용을 측정합니다.</tspan></text></g></svg>