<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">변수·자료형·리스트·딕셔너리 — 개념도</title><desc id="desc">변수는 값을 가리키거나 담는 이름이고 자료형은 값의 종류를 정합니다. 리스트·배열은 순서 있는 여러 값, 딕셔너리는 키로 값을 찾는 구조, 집합은 중복 없이 모은 구조입니다. 1. 값 선택: 정수·실수·문자열·참/거짓 등을 구분합니다. 2. 묶음 선택: 순서·검색·중복 정책에 맞는 구조를 선택합니다. 3. 검증: 없는 키·범위 밖 인덱스·중복 ID를 처리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  변수</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="77" y1="78" x2="95" y2="105" stroke="#83d4cb" stroke-width="5" /><rect x="120" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="186" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="252" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="275" y1="78" x2="293" y2="105" stroke="#83d4cb" stroke-width="5" /><rect x="318" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="384" y="68" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="54" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="120" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="186" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="209" y1="134" x2="227" y2="161" stroke="#83d4cb" stroke-width="5" /><rect x="252" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="318" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="384" y="124" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="407" y1="134" x2="425" y2="161" stroke="#83d4cb" stroke-width="5" /><rect x="54" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="120" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="143" y1="190" x2="161" y2="217" stroke="#83d4cb" stroke-width="5" /><rect x="186" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="252" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="318" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="341" y1="190" x2="359" y2="217" stroke="#83d4cb" stroke-width="5" /><rect x="384" y="180" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="54" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="77" y1="246" x2="95" y2="273" stroke="#83d4cb" stroke-width="5" /><rect x="120" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="186" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="252" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="275" y1="246" x2="293" y2="273" stroke="#83d4cb" stroke-width="5" /><rect x="318" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><rect x="384" y="236" width="58" height="48" rx="5" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="231" y="324" fill="#e4ebf6" font-size="21" font-weight="500" text-anchor="middle"><tspan x="231" dy="0">가방 24칸 · 위치는 달라도</tspan></text><line x1="467" y1="186" x2="538" y2="186" stroke="#83d4cb" stroke-width="3" /><polygon points="538,186 529.1300507722071,190.61779175541483 529.1300507722071,181.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="552" y="98" width="284" height="181" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="552" y="98" width="7" height="181" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="694.0" y="132" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="694.0" dy="0">고유 ID는 유지</tspan></text><text x="694.0" y="178" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="694.0" dy="0">가방 → 장비 → 창고</tspan><tspan x="694.0" dy="26.099999999999998">이동해도 같은 한 자루</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  값 선택</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">정수·실수·문자열·참/거짓</tspan><tspan x="47" dy="26.099999999999998">등을 구분합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  묶음 선택</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">순서·검색·중복 정책에 맞는</tspan><tspan x="341" dy="26.099999999999998">구조를 선택합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검증</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">없는 키·범위 밖 인덱스·중</tspan><tspan x="635" dy="26.099999999999998">복 ID를 처리합니다.</tspan></text></g></svg>