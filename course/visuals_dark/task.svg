<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">작업표·완료 조건·계획 — 개념도</title><desc id="desc">작업표는 목표·담당·입력·출력·선행 작업·완료 조건을 명시한 실행 계약입니다. 기획 AI가 초안을 만들 수 있지만 허용 경로·예산·실행 승인까지 마음대로 정하게 하지 않습니다. 1. 요구 좁히기: 포함·제외 범위를 정합니다. 2. 자료 연결: 실제 파일과 담당 역할을 지정합니다. 3. 판정 명시: 성공과 실패 예시를 구체적으로 적습니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  작업표</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="291" y="64" width="317" height="79" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="291" y="64" width="7" height="79" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="449.5" y="98" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="449.5" dy="0">현재 요청</tspan></text><line x1="450" y1="152" x2="166" y2="205" stroke="#83d4cb" stroke-width="3" /><polygon points="166,205 173.8722680160369,198.8333642653646 175.56655904151307,207.91220674150105" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="7" height="95" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="248" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">요구 좁히기</tspan></text><line x1="450" y1="152" x2="453" y2="205" stroke="#c4a7f2" stroke-width="3" /><polygon points="453,205 447.8883179798451,196.40519302573784 457.10914160348415,195.88325961307902" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="7" height="95" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="248" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">자료 연결</tspan></text><line x1="450" y1="152" x2="740" y2="205" stroke="#f2bc70" stroke-width="3" /><polygon points="740,205 730.4443810256112,207.9479053608112 732.104762323169,198.86280014775895" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="7" height="95" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="248" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">판정 명시</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  요구 좁히기</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">포함·제외 범위를 정합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  자료 연결</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">실제 파일과 담당 역할을 지</tspan><tspan x="341" dy="26.099999999999998">정합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  판정 명시</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">성공과 실패 예시를 구체적</tspan><tspan x="635" dy="26.099999999999998">으로 적습니다.</tspan></text></g></svg>