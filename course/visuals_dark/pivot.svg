" dy="0">6 프레임</tspan></text><text x="47" y="66" fill="#e4ebf6" font-size="20" font-weight="700" text-anchor="start"><tspan x="47" dy="0">같은 셀 크기 · 같은 발 기준점</tspan></text><line x1="198" y1="305" x2="729" y2="305" stroke="#f2bc70" stroke-width="3" /><polygon points="729,305 720.1300507722071,309.6177917554148 720.1300507722071,300.3822082445852" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  공통 기준</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">발의 위치를 시트 전체에서</tspan><tspan x="47" dy="26.099999999999998">맞춥니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  일관된 셀</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">프레임 크기와 여백을 통일</tspan><tspan x="341" dy="26.099999999999998">합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  실제 재생</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">걷기·공격에서 발과 그림의</tspan><tspan x="635" dy="26.099999999999998">이동을 확인합니다.</tspan></text></g></svg>