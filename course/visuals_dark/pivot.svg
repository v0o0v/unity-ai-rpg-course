<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Pivot과 발 기준점 — 개념도</title><desc id="desc">Pivot은 그림을 배치·회전·정렬할 때 사용하는 기준점입니다. 탑다운 캐릭터는 발바닥 근처의 일정한 기준점을 쓰면 프레임마다 몸이 튀는 현상을 줄일 수 있습니다. 1. 공통 기준: 발의 위치를 시트 전체에서 맞춥니다. 2. 일관된 셀: 프레임 크기와 여백을 통일합니다. 3. 실제 재생: 걷기·공격에서 발과 그림의 이동을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Pivot과 발 기준점</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="40" y="85" width="127" height="177" rx="6" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="49" y1="242" x2="157" y2="242" stroke="#83d4cb" stroke-width="2" stroke-dasharray="7 6" /><g transform="translate(101,240) scale(1.22)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17.0" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17.0" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26.0" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31.0" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30.0" x2="45.0" y2="-69.0" stroke="#f2bc70" stroke-width="5" /></g><circle cx="101" cy="240" r="4" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><text x="103" y="285" fill="#b2c3d9" font-size="18" font-weight="500" text-anchor="middle"><tspan x="103" dy="0">1 프레임</tspan></text><rect x="179" y="85" width="127" he