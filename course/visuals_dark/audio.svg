<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">AudioClip·AudioSource·AudioListener — 개념도</title><desc id="desc">AudioClip은 소리 자료, AudioSource는 재생 위치·볼륨 등을 가진 재생 주체, AudioListener는 소리를 듣는 기준입니다. 효과음과 배경음악은 목적에 따라 관리합니다. 1. 자료: 길이·루프·출처·포맷을 확인합니다. 2. 재생: 게임 사건에 맞춰 한 번 또는 반복 재생합니다. 3. 정리: 씬 종료·풀 반환에서 원치 않는 반복을 멈춥니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  AudioClip</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="70" y="84" width="201" height="210" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="70" y="84" width="7" height="210" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="170.5" y="118" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="170.5" dy="0">소리 파일</tspan></text><line x1="282" y1="197" x2="328" y2="197" stroke="#83d4cb" stroke-width="3" /><polygon points="328,197 319.13005077220714,201.61779175541483 319.13005077220714,192.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="101" y1="201.0" x2="101" y2="211.0" stroke="#83d4cb" stroke-width="4" /><line x1="111" y1="186.65287818200954" x2="111" y2="225.34712181799046" stroke="#83d4cb" stroke-width="4" /><line x1="121" y1="181.0085279391699" x2="121" y2="230.9914720608301" stroke="#83d4cb" stroke-width="4" /><line x1="131" y1="187.49073638897698" x2="131" y2="224.50926361102302" stroke="#83d4cb" stroke-width="4" /><line x1="141" y1="199.8325171314484" x2="141" y2="212.1674828685516" stroke="#83d4cb" stroke-width="4" /><line x1="151" y1="185.86395009384