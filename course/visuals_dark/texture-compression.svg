<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">파일 용량과 실행 메모리 — 개념도</title><desc id="desc">파일 용량은 저장장치의 바이트 수이고 실행 메모리는 로드 후 필요한 공간입니다. 같은 PNG라도 실행 형식·해상도·밉맵·플랫폼 압축에 따라 메모리가 달라집니다. 1. 파일: 압축된 저장 크기를 확인합니다. 2. 로드: 실제 포맷과 픽셀 수로 메모리를 생각합니다. 3. 해제: 더 쓰지 않는 자료의 참조와 핸들을 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  파일 용량과 실행 메모리</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="54" y="67" width="244" height="243" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="77" y1="257" x2="276" y2="257" stroke="#b2c3d9" stroke-width="2" /><g transform="translate(177,252) scale(0.5)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><text x="177" y="284" fill="#e4ebf6" font-size="17" font-weight="600" text-anchor="middle"><tspan x="177" dy="0">PPU 128 → 0.5유닛</tspan></text><rect x="309" y="67" width="244" height="243" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="332" y1="257" x2="531" y2="257" stroke="#b2c3d9" stroke-width="2" /><g transform="translate(432,252) scale(1)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#c4a7f2" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#c4a7f2" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><text x="432" y="284" fill="#e4ebf6" font-size="17" font-weight="600" text-anchor="middle"><tspan x="432" dy="0">PPU 64 → 1유닛</tspan></text><rect x="583" y="67" width="244" height="243" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><line x1="606" y1="257" x2="805" y2="257" stroke="#b2c3d9" stroke-width="2" /><g transform="translate(706,252) scale(2)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#f2bc70" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#f2bc70" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><text x="706" y="284" fill="#e4ebf6" font-size="17" font-weight="600" text-anchor="middle"><tspan x="706" dy="0">PPU 32 → 2유닛</tspan></text><text x="452" y="328" fill="#b2c3d9" font-size="19" font-weight="500" text-anchor="middle"><tspan x="452" dy="0">같은 64px 원본을 다른 월드 크기로 표현한 예</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  파일</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">압축된 저장 크기를 확인합</tspan><tspan x="47" dy="26.099999999999998">니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  로드</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">실제 포맷과 픽셀 수로 메모</tspan><tspan x="341" dy="26.099999999999998">리를 생각합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  해제</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">더 쓰지 않는 자료의 참조와</tspan><tspan x="635" dy="26.099999999999998">핸들을 정리합니다.</tspan></text></g></svg>