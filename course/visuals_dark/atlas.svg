ight="750" text-anchor="start"><tspan x="341" dy="0">02  배치</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">간격·회전·트리밍·크기를 조</tspan><tspan x="341" dy="26.099999999999998">절해 패킹합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">가져오기·실제 화면·메모리·</tspan><tspan x="635" dy="26.099999999999998">드로우콜을 확인합니다.</tspan></text></g></svg>