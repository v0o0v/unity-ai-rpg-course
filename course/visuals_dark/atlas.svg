<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Sprite Atlas와 패킹 — 개념도</title><desc id="desc">아틀라스는 여러 스프라이트 텍스처를 큰 텍스처에 모아 관리하는 자료입니다. 텍스처 전환을 줄이는 데 도움이 될 수 있지만 드로우콜이 언제나 하나가 되는 것은 아닙니다. 1. 모으기: 함께 쓸 스프라이트를 고릅니다. 2. 배치: 간격·회전·트리밍·크기를 조절해 패킹합니다. 3. 검사: 가져오기·실제 화면·메모리·드로우콜을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  Sprite Atlas와 패킹</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="51" y="81" width="313" height="212" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><text x="207" y="67" fill="#83d4cb" font-size="20" font-weight="700" text-anchor="middle"><tspan x="207" dy="0">원본 시트 · 시간 순서</tspan></text><rect x="72" y="103" width="78" height="79" rx="3" fill="#111d2b" stroke="#50687d" stroke-width="2" /><g transform="translate(111,172) scale(0.58)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><rect x="164" y="103" width="78" height="79" rx="3" fill="#111d2b" stroke="#50687d" stroke-width="2" /><g transform