<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">UV와 텍스처 좌표 — 개념도</title><desc id="desc">UV는 3D 표면의 어느 지점이 텍스처의 어느 부분을 사용할지 정하는 좌표입니다. 월드 X·Y·Z와 구분하기 위해 U·V라는 이름을 씁니다. 1. 펼치기: 표면을 텍스처에 대응하도록 나눕니다. 2. 매핑: 각 정점에 U·V 좌표를 지정합니다. 3. 표시: 재질이 좌표를 통해 텍스처 색을 읽습니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  UV와 텍스처 좌표</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><polygon points="80,267 162,100 213,300" fill="#83d4cb25" stroke="#83d4cb" stroke-width="3" /><polygon points="162,100 312,121 213,300" fill="#c4a7f225" stroke="#c4a7f2" stroke-width="3" /><polygon points="312,121 372,258 213,300" fill="#f2bc7025" stroke="#f2bc70" stroke-width="3" /><circle cx="80" cy="267" r="6" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><circle cx="162" cy="100" r="6" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><circle cx="312" cy="121" r="6" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><circle cx="372" cy="258" r="6" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><circle cx="213" cy="300" r="6" fill="#e4ebf6" stroke="#e4ebf6" stroke-width="2" /><line x1="416" y1="201" x2="489" y2="201" stroke="#f2bc70" stroke-width="3" /><polygon points="489,201 480.13005077220714,205.61779175541483 480.13005077220714,196.38220824458517" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="536" y="80" width="290" height="223" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="550" y="93" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="600" y="93" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="650" y="93" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="700" y="93" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="750" y="93" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="550" y="142" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="600" y="142" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="650" y="142" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="700" y="142" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="750" y="142" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="550" y="191" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="600" y="191" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="650" y="191" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="700" y="191" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="750" y="191" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="550" y="240" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="600" y="240" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><rect x="650" y="240" width="48" height="47" rx="1" fill="#f2bc7033" stroke="white" stroke-width="1" /><rect x="700" y="240" width="48" height="47" rx="1" fill="#83d4cb33" stroke="white" stroke-width="1" /><rect x="750" y="240" width="48" height="47" rx="1" fill="#c4a7f233" stroke="white" stroke-width="1" /><text x="220" y="327" fill="#e4ebf6" font-size="21" font-weight="500" text-anchor="middl