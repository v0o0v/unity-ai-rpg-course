<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">VFX·Particle System·플립북 — 개념도</title><desc id="desc">VFX는 불꽃·먼지·마법 같은 시각 효과입니다. Particle System은 작은 입자 여러 개를 생성·이동·소멸시키며, 플립북은 텍스처의 여러 프레임을 순서대로 보여 주는 방식입니다. 1. 발생: 피격 등 확정된 게임 사건에서 효과를 요청합니다. 2. 표현: 수명·크기·속도·프레임을 조절합니다. 3. 종료: 효과를 지우거나 풀로 돌려 이전 상태를 정리합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  VFX</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><g transform="translate(224,287) scale(1.6)" opacity="1"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="17" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-26" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-31" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-30" x2="45" y2="-69" stroke="#f2bc70" stroke-width="5" /></g><circle cx="612.0" cy="187.0" r="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="1" opacity="0.2" /><circle cx="536.82" cy="214.79" r="6" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="1" opacity="0.35" /><circle cx="582.07" cy="131.63" r="7" fill="#f2bc70" stroke="#f2bc70" stroke-width="1" opacity="0.5" /><circle cx="637.03" cy="241.49" r="8" fill="#83d4cb" stroke="#83d4cb" stroke-width="1" opacity="0.6499999999999999" /><circle cx="463.05" cy="1