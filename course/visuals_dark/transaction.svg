<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">트랜잭션·거래의 한 번 적용 — 개념도</title><desc id="desc">트랜잭션은 여러 변경을 하나의 논리적 거래로 묶는 방법입니다. 제작이라면 재료 차감과 장비 지급이 함께 성공하거나 함께 실패해야 합니다. Git 커밋과는 문맥이 다릅니다. 1. 사전 검사: 재료·공간·상태를 먼저 확인합니다. 2. 한 번 반영: 동일 요청의 중복 실행을 막고 변경을 적용합니다. 3. 저장·복구: 실패 시 일관된 이전·이후 상태로 돌아갑니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  트랜잭션</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="39" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="39" y="86" width="7" height="200" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="165.5" y="120" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="165.5" dy="0">거래 전</tspan></text><text x="165.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="165.5" dy="0">재료 10 · 검 0</tspan></text><line x1="299" y1="191" x2="317" y2="191" stroke="#83d4cb" stroke-width="3" /><polygon points="317,191 308.13005077220714,195.61779175541483 308.13005077220714,186.38220824458517" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="326" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="326" y="86" width="7" height="200" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="452.5" y="120" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="452.5" dy="0">요청 R1 적용</tspan></text><text x="452.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="452.5" dy="0">재료 7 · 검 1</tspan></text><line x1="586" y1="191" x2="604" y2="191" stroke="#c4a7f2" stroke-width="3" /><polygon points="604,191 595.1300507722071,195.61779175541483 595.1300507722071,186.38220824458517" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="613" y="86" width="253" height="200" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="613" y="86" width="7" height="200" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="739.5" y="120" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="739.5" dy="0">R1 재전송</tspan></text><text x="739.5" y="166" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="739.5" dy="0">재료 7 · 검 1</tspan></text><text x="450" y="329" fill="#b2c3d9" font-size="18" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">형식이 맞는 것과 의미가 맞는 것을 함께 확인</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  사전 검사</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">재료·공간·상태를 먼저 확인</tspan><tspan x="47" dy="26.099999999999998">합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  한 번 반영</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">동일 요청의 중복 실행을 막</tspan><tspan x="341" dy="26.099999999999998">고 변경을 적용합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  저장·복구</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">실패 시 일관된 이전·이후</tspan><tspan x="635" dy="26.099999999999998">상태로 돌아갑니다.</tspan></text></g></svg>