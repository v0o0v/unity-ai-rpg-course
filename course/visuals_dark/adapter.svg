<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">어댑터·인터페이스·의존성 분리 — 개념도</title><desc id="desc">인터페이스는 기능에 요구하는 약속이고 어댑터는 서로 다른 구현을 그 약속에 맞춰 연결하는 구성요소입니다. 의존성 주입은 사용할 구현을 외부에서 지정하는 방식입니다. 1. 공통 약속: “경로 요청”처럼 필요한 기능을 정의합니다. 2. 다른 구현: 2D A*와 3D NavMesh를 각각 연결합니다. 3. 검사: 같은 규칙 입력이 적절한 공간 기능을 쓰는지 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  어댑터</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><rect x="291" y="64" width="317" height="79" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="291" y="64" width="7" height="79" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="449.5" y="98" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="449.5" dy="0">공통 게임 규칙</tspan></text><line x1="450" y1="152" x2="166" y2="205" stroke="#83d4cb" stroke-width="3" /><polygon points="166,205 173.8722680160369,198.8333642653646 175.56655904151307,207.91220674150105" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="40" y="214" width="7" height="95" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="166.5" y="248" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="166.5" dy="0">2D 연결부</tspan></text><line x1="450" y1="152" x2="453" y2="205" stroke="#c4a7f2" stroke-width="3" /><polygon points="453,205 447.8883179798451,196.40519302573784 457.10914160348415,195.88325961307902" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#c4a7f2" stroke-width="2" /><rect x="327" y="214" width="7" height="95" rx="2" fill="#c4a7f2" stroke="#c4a7f2" stroke-width="0" /><text x="453.5" y="248" fill="#c4a7f2" font-size="23" font-weight="700" text-anchor="middle"><tspan x="453.5" dy="0">3D 연결부</tspan></text><line x1="450" y1="152" x2="740" y2="205" stroke="#f2bc70" stroke-width="3" /><polygon points="740,205 730.4443810256112,207.9479053608112 732.104762323169,198.86280014775895" fill="#f2bc70" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="253" height="95" rx="10" fill="#192838" stroke="#f2bc70" stroke-width="2" /><rect x="614" y="214" width="7" height="95" rx="2" fill="#f2bc70" stroke="#f2bc70" stroke-width="0" /><text x="740.5" y="248" fill="#f2bc70" font-size="23" font-weight="700" text-anchor="middle"><tspan x="740.5" dy="0">같은 데이터 검사</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  공통 약속</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="47" dy="0">“경로 요청”처럼 필요한 기</tspan><tspan x="47" dy="26.099999999999998">능을 정의합니다.</tspan></text><rect x="324" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="341" y="385" fill="#c4a7f2" font-size="20" font-weight="750" text-anchor="start"><tspan x="341" dy="0">02  다른 구현</tspan></text><text x="341" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="341" dy="0">2D A*와 3D NavMesh를 각각</tspan><tspan x="341" dy="26.099999999999998">연결합니다.</tspan></text><rect x="618" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="635" y="385" fill="#f2bc70" font-size="20" font-weight="750" text-anchor="start"><tspan x="635" dy="0">03  검사</tspan></text><text x="635" y="420" fill="#e4ebf6" font-size="18" font-weight="500" text-anchor="start"><tspan x="635" dy="0">같은 규칙 입력이 적절한 공</tspan><tspan x="635" dy="26.099999999999998">간 기능을 쓰는지 확인합니</tspan><tspan x="635" dy="26.099999999999998">다.</tspan></text></g></svg>