<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">리그·본·스키닝·Avatar — 개념도</title><desc id="desc">리그는 모델이나 부위 그림을 움직이는 뼈대 구조입니다. 스키닝은 그림·메시의 부분이 어느 뼈를 얼마나 따라갈지 정하는 작업입니다. Avatar는 사람형 뼈 매핑 등에 사용됩니다. 1. 뼈대: 몸통·팔·다리 관계를 만듭니다. 2. 가중치: 각 부위가 따를 뼈와 정도를 정합니다. 3. 동작 검사: 걷기·공격에서 찢어짐·뒤집힘을 확인합니다.</desc><g font-family="system-ui, -apple-system, Malgun Gothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="900" height="540" rx="18" fill="#111d2b" stroke="#111d2b" stroke-width="0" /><text x="28" y="34" fill="#e4ebf6" font-size="21" font-weight="750" text-anchor="start"><tspan x="28" dy="0">그림으로 읽기  ·  리그</tspan></text><text x="871" y="33" fill="#b2c3d9" font-size="15" font-weight="500" text-anchor="end"><tspan x="871" dy="0">원리 설명용</tspan></text><g transform="translate(202,291) scale(2)" opacity="0.45"><ellipse cx="0" cy="2" rx="28" ry="7" fill="#e4ebf620" /><circle cx="0" cy="-77" r="15" fill="#f0c49c" stroke="#e4ebf6" stroke-width="2" /><rect x="-18" y="-59" width="36" height="39" rx="5" fill="#83d4cb" stroke="#83d4cb" stroke-width="2" /><line x1="-10" y1="-22" x2="-13.4" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="10" y1="-22" x2="13.4" y2="0" stroke="#e4ebf6" stroke-width="7" /><line x1="-18" y1="-50" x2="-32" y2="-21.8" stroke="#83d4cb" stroke-width="8" /><line x1="18" y1="-50" x2="32" y2="-37.0" stroke="#83d4cb" stroke-width="8" /><line x1="30" y1="-36.0" x2="54.6" y2="-72.0" stroke="#f2bc70" stroke-width="5" /></g><line x1="202" y1="179" x2="202" y2="248" stroke="#c4a7f2" stroke-width="5" /><line x1="202" y1="140" x2="202" y2="179" stroke="#c4a7f2" stroke-width="4" /><line x1="202" y1="179" x2="167" y2="204" stroke="#c4a7f2" stroke-width="4" /><line x1="167" y1="204" x2="152" y2="230" stroke="#c4a7f2" stroke-width="4" /><line x1="202" y1="179" x2="237" y2="204" stroke="#c4a7f2" stroke-width="4" /><line x1="237" y1="204" x2="263" y2="220" stroke="#c4a7f2" stroke-width="4" /><line x1="202" y1="179" x2="181" y2="268" stroke="#c4a7f2" stroke-width="4" /><line x1="181" y1="268" x2="169" y2="291" stroke="#c4a7f2" stroke-width="4" /><line x1="202" y1="179" x2="223" y2="268" stroke="#c4a7f2" stroke-width="4" /><line x1="223" y1="268" x2="235" y2="291" stroke="#c4a7f2" stroke-width="4" /><circle cx="202" cy="140" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="202" cy="179" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="167" cy="204" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="152" cy="230" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="237" cy="204" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="263" cy="220" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="181" cy="268" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="169" cy="291" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="223" cy="268" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><circle cx="235" cy="291" r="7" fill="#192838" stroke="#c4a7f2" stroke-width="3" /><rect x="424" y="89" width="380" height="185" rx="10" fill="#192838" stroke="#83d4cb" stroke-width="2" /><rect x="424" y="89" width="7" height="185" rx="2" fill="#83d4cb" stroke="#83d4cb" stroke-width="0" /><text x="614.0" y="123" fill="#83d4cb" font-size="23" font-weight="700" text-anchor="middle"><tspan x="614.0" dy="0">본 → 스키닝 → 동작</tspan></text><text x="614.0" y="169" fill="#b2c3d9" font-size="18" font-weight="450" text-anchor="middle"><tspan x="614.0" dy="0">그림·메시의 어느 부분이</tspan><tspan x="614.0" dy="26.099999999999998">어느 관절을 따라가는지 연결</tspan></text><rect x="30" y="354" width="281" height="158" rx="10" fill="#192838" stroke="#50687d" stroke-width="2" /><text x="47" y="385" fill="#83d4cb" font-size="20" font-weight="750" text-anchor="start"><tspan x="47" dy="0">01  뼈대</tspan></text><text x="47" y="420" fill="#e4ebf6" font-size="18" fon